<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Changelog — apliteni·ui</title>
<meta name="description" content="Release history for the Apliteni design system.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?{{CSSHASH}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/kit.css?{{CSSHASH}}">
<style>
  body { overflow-x: hidden; }
  .nav { position: sticky; top: 0; z-index: 20; backdrop-filter: blur(12px); background: color-mix(in srgb, var(--bg) 82%, transparent); }
  .wrap { max-width: 820px; margin: 0 auto; padding: 0 clamp(18px, 4vw, 34px); }
  .nav .wrap { max-width: 1120px; }
  .nav__in { display: flex; align-items: center; gap: 16px; height: 62px; }
  .nav a.lk { color: var(--dim); font-size: 14px; text-decoration: none; }
  .nav a.lk:hover { color: var(--strong); }
  .nav a.lk.on { color: var(--strong); }
  .ver { font-size: 11px; font-weight: 600; letter-spacing: .03em; color: var(--muted); background: var(--surface-2); border-radius: 999px; padding: 3px 9px; }

  .head { padding: clamp(48px, 8vh, 90px) 0 10px; }
  .head h1 { font: 700 clamp(34px, 5vw, 48px)/1.05 var(--font-sans); color: var(--strong); letter-spacing: -.02em; margin-bottom: 12px; }
  .head p { color: var(--dim); font-size: 17px; line-height: 1.6; max-width: 54ch; }

  .log { padding: 40px 0 100px; }
  .rel { display: grid; grid-template-columns: 22px 1fr; gap: 20px; }
  .rel__rail { position: relative; display: flex; justify-content: center; }
  .rel__rail::before { content: ""; position: absolute; top: 6px; bottom: -8px; width: 2px; background: var(--border); }
  .rel:last-child .rel__rail::before { display: none; }
  .rel__dot { position: relative; z-index: 1; width: 13px; height: 13px; margin-top: 6px; border-radius: 50%; background: var(--surface-3); box-shadow: 0 0 0 4px var(--bg); }
  .rel__dot.is-latest { background: var(--accent); box-shadow: 0 0 0 4px var(--bg), 0 0 0 6px var(--glow-purple); }
  .rel__body { padding-bottom: 40px; min-width: 0; }
  .rel__head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .rel__v { font: 700 20px/1 var(--font-sans); color: var(--strong); letter-spacing: -.01em; }
  .rel__date { font-size: 13px; color: var(--muted); }
  .rel__list { list-style: none; display: flex; flex-direction: column; gap: 12px; }
  .rel__list li { display: grid; grid-template-columns: 82px 1fr; gap: 14px; align-items: baseline; color: var(--dim); font-size: 15px; line-height: 1.55; }
  .rel__list li > span:last-child { min-width: 0; }

  .tag { justify-self: start; font: 700 10px/1 var(--font-sans); letter-spacing: .1em; text-transform: uppercase; padding: 5px 9px; border-radius: 999px; white-space: nowrap; }
  .tag--added { color: var(--green); background: var(--glow-green); }
  .tag--fixed { color: var(--amber); background: color-mix(in srgb, var(--amber) 15%, transparent); }
  .tag--changed { color: var(--purple-mid); background: var(--glow-purple); }
  .tag--removed { color: var(--pink); background: var(--glow-pink); }

  footer { border-top: 1px solid var(--border); padding: 34px 0; }
  footer .wrap { max-width: 1120px; display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
  footer a { color: var(--muted); }
  @media (max-width: 560px) { .rel__list li { grid-template-columns: 1fr; gap: 6px; } }
</style>
</head>
<body>

<header class="nav">
  <div class="wrap nav__in">
    <a class="brand" href="/" aria-label="apliteni ui" style="text-decoration:none">
      <svg viewBox="0 0 32 32" width="23" height="23" aria-hidden="true"><defs><clipPath id="pr"><rect x="1" y="1" width="30" height="30" rx="9"/></clipPath></defs><g clip-path="url(#pr)"><rect x="1" y="1" width="15" height="15" fill="#9b5dff"/><rect x="16" y="1" width="15" height="15" fill="#ff6a3d"/><rect x="1" y="16" width="15" height="15" fill="#3b9dff"/><rect x="16" y="16" width="15" height="15" fill="#16c98a"/></g></svg>
      <span style="font-weight:600;color:var(--strong)">apliteni<span style="color:var(--accent)">·</span>ui</span>
    </a>
    <span class="ver">{{VERSION}}</span>
    <span style="flex:1"></span>
    <a class="lk on" href="/changelog/">Changelog</a>
    <a class="lk hide-sm" href="https://github.com/apliteni/apliteni-ui">GitHub</a>
    <button class="toggle" id="tgl" aria-label="Toggle theme"><span class="ic" id="tglIc"></span><span id="tglLb">Light</span></button>
    <a class="ui-btn ui-btn--primary" href="/storybook/" style="text-decoration:none">Storybook</a>
  </div>
</header>

<div class="head wrap">
  <h1>Changelog</h1>
  <p>Every release of the Apliteni design system, newest first. Versions ship to GitHub Packages and this site.</p>
</div>

<main class="log wrap">
  {{MAIN}}
</main>

<footer>
  <div class="wrap">
    <span>© Apliteni · apliteni·ui</span>
    <span style="display:flex;gap:22px"><a href="/">Home</a><a href="/storybook/">Storybook</a><a href="https://github.com/apliteni/apliteni-ui">GitHub</a></span>
  </div>
</footer>

<script>
  var root = document.documentElement;
  var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  function applyTheme(t){ root.setAttribute('data-theme', t); document.getElementById('tglIc').innerHTML = t==='dark'?SUN:MOON; document.getElementById('tglLb').textContent = t==='dark'?'Light':'Dark'; try{localStorage.setItem('aplitech-ui-theme',t);}catch(e){} }
  var savedT=null; try{ savedT=localStorage.getItem('aplitech-ui-theme'); }catch(e){}
  applyTheme(savedT || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
  document.getElementById('tgl').addEventListener('click', function(){ applyTheme(root.getAttribute('data-theme')==='dark'?'light':'dark'); });
  try { var a = localStorage.getItem('aplitech-ui-accent'); if (a && a!=='default') root.setAttribute('data-accent', a); } catch(e){}
</script>
</body>
</html>
