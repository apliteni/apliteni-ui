<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Changelog — apliteni-ui</title>
<meta name="description" content="Release history for the Apliteni design system.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?{{CSSHASH}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/kit.css?{{CSSHASH}}">
<style>
  body { overflow-x: hidden; }
  {{CHROME_CSS}}
  .wrap { max-width: var(--measure); margin: 0 auto; padding: 0 clamp(18px, 4vw, 34px); }

  .head { padding: clamp(48px, 8vh, 90px) 0 10px; }
  .head h1 { font: 700 clamp(34px, 5vw, 48px)/1.05 var(--font-sans); color: var(--strong); letter-spacing: -.02em; margin-bottom: 12px; }
  .head p { color: var(--dim); font-size: 17px; line-height: 1.6; max-width: var(--prose-lede); }

  .log { padding: 40px 0 100px; }
  .rel { display: grid; grid-template-columns: 22px 1fr; gap: 20px; }
  .rel__rail { position: relative; display: flex; justify-content: center; }
  .rel__rail::before { content: ""; position: absolute; top: 6px; bottom: -8px; width: 2px; background: var(--border); }
  .rel:last-child .rel__rail::before { display: none; }
  .rel__dot { position: relative; z-index: 1; width: 13px; height: 13px; margin-top: 6px; border-radius: 50%; background: var(--surface-3); box-shadow: 0 0 0 4px var(--bg); }
  .rel__dot.is-latest { background: var(--accent); box-shadow: 0 0 0 4px var(--bg), 0 0 0 6px var(--glow-purple); }
  .rel__body { padding-bottom: 40px; min-width: 0; }
  .rel__head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .rel__v { font: 700 20px/1 var(--font-sans); color: var(--strong); letter-spacing: -.01em; }
  .rel__date { font-size: 13px; color: var(--muted); }
  .rel__list { list-style: none; display: flex; flex-direction: column; gap: 12px; }
  .rel__list li { display: grid; grid-template-columns: 82px 1fr; gap: 14px; align-items: baseline; color: var(--dim); font-size: 15px; line-height: 1.55; }
  .rel__list li > .chg { min-width: 0; }

  /* A change shows its summary and folds its reasoning. Both are slices of one
     authored string (site/changelog.mjs splitChange) — the fold is a reading
     aid, never a second field somebody has to fill in. <details> is native, so
     the page needs no script of its own. */
  .chg__what { color: var(--dim); }
  .chg__why { margin-top: 7px; }
  .chg__why > summary { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; list-style: none; font: 600 12px/1 var(--font-sans); color: var(--muted); padding: 3px 0; width: fit-content; }
  .chg__why > summary::-webkit-details-marker { display: none; }
  .chg__why > summary::before { content: ""; width: 0; height: 0; border-left: 4px solid currentColor; border-block: 3.5px solid transparent; transition: transform .14s; }
  .chg__why[open] > summary::before { transform: rotate(90deg); }
  .chg__why > summary:hover { color: var(--strong); }
  .chg__why > summary:focus-visible { outline: none; box-shadow: var(--ring); border-radius: 4px; }
  .chg__why > p { margin-top: 8px; padding-inline-start: 12px; border-inline-start: 2px solid var(--border); color: var(--muted); font-size: 14px; line-height: 1.6; }

  /* Uppercase here is the kit's chip idiom (badge.css, table.css, nav.css), not a kicker: a `.tag`
     is the change's category inline in the list item, and no heading follows it. */
  .tag { justify-self: start; font: 700 10px/1 var(--font-sans); letter-spacing: .1em; text-transform: uppercase; padding: 5px 9px; border-radius: 999px; white-space: nowrap; }
  .tag--added { color: var(--chip-success-ink); background: var(--chip-success-fill); }
  .tag--fixed { color: var(--amber); background: color-mix(in srgb, var(--amber) 15%, transparent); }
  .tag--changed { color: var(--purple-mid); background: var(--glow-purple); }
  .tag--removed { color: var(--pink); background: var(--glow-pink); }
  .tag--breaking { color: #fff; background: var(--pink); }
  .ui-badge--breaking { color: var(--pink); background: var(--glow-pink); display: inline-flex; align-items: center; gap: 5px; }
  .ui-badge--breaking svg { width: 11px; height: 11px; }

  .chips { display: inline-flex; flex-wrap: wrap; gap: 6px; margin-left: 2px; vertical-align: baseline; }
  .comp { display: inline-flex; align-items: center; font: 600 12px/1 var(--font-sans); color: var(--purple-mid); background: var(--glow-purple); border: 1px solid transparent; padding: 5px 10px; border-radius: 7px; text-decoration: none; transition: .14s; }
  .comp:not(.plain):hover { border-color: var(--accent-strong); color: var(--strong); }
  .comp.plain { color: var(--muted); background: var(--surface-3); cursor: default; }

  .contrib { display: flex; align-items: center; gap: 10px; margin-top: 18px; padding-top: 16px; border-top: 1px dashed var(--border); }
  .contrib .people { display: flex; flex-wrap: wrap; gap: 8px; }
  .who { display: inline-flex; align-items: center; gap: 7px; background: var(--surface-2); border: 1px solid var(--border); padding: 3px 10px 3px 3px; border-radius: 999px; font-size: 13px; color: var(--dim); text-decoration: none; }
  .who:hover { border-color: var(--border-strong); color: var(--strong); }
  .av { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; background: var(--surface-3); }
  .av.ini { display: grid; place-items: center; font: 700 9px/1 var(--font-sans); color: #fff; background: linear-gradient(135deg,#6a2dcc,#3b9dff); }

  @media (max-width: 560px) { .rel__list li { grid-template-columns: 1fr; gap: 6px; } }
</style>
</head>
<body>

<!-- Shared site chrome — see site/chrome.mjs (topbar/footer/theme+accent JS). -->
{{TOPBAR}}

<div class="head wrap">
  <h1>Changelog</h1>
  <p>Every release of the Apliteni design system, newest first. Versions ship to the public npm registry and this site.</p>
</div>

<main class="log wrap">
  {{MAIN}}
</main>

{{FOOTER}}

<script>{{CHROME_JS}}</script>
</body>
</html>
