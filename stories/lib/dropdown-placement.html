<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/src/index.css">
<style>html,body{margin:0;padding:0}</style>
</head>
<body>
<script type="module">
// The vanilla half of the placement cases: a select in a form, in a Drawer, on a page,
// and in a wrapper with `overflow: auto` that does not scroll inside a body that does.
// The same arguments as the React story in react/src/DropdownPlacement.stories.tsx.
// stories/dropdown-reach.test.js serves this at /__shot. The kit has no vanilla Modal,
// so `stage=nested` puts the wrapper in a Drawer body.
// why: docs/components.md#the-dropdown-panel
import { dropdown, wireDropdown } from '/src/components/dropdown.js';
import { drawer, wireDrawer } from '/src/components/drawer.js';
import { field, input, button } from '/src/components/index.js';

const params = new URLSearchParams(location.search);
document.documentElement.dataset.theme = params.get('theme') || 'light';
const stage = params.get('stage') || 'drawer';
const before = Number(params.get('before') ?? '1');
const after = Number(params.get('after') ?? '0');
const rows = Number(params.get('rows') || '30');
const gap = Number(params.get('gap') || '200');
// `limit` is a consumer's own cap, the factory's `scroll: <n>`, and `find` its `search`.
const scroll = params.get('limit') ? Number(params.get('limit')) : false;
const items = Array.from({ length: rows }, (_, i) => ({ label: `Account ${i + 1}`, value: String(i + 1) }));

const form = Array.from({ length: before }, (_, i) => field({ label: i ? `Note ${i}` : 'Name', control: input({}) })).join('')
  + field({
    label: 'Account',
    control: dropdown({ variant: 'select', items, placeholder: 'Choose an account', search: params.get('find') === '1', scroll }),
  })
  + Array.from({ length: after }, (_, i) => field({ label: `Detail ${i + 1}`, control: input({}) })).join('');

const host = document.createElement('div');
if (stage === 'page') {
  host.style.cssText = `display:grid;align-content:end;box-sizing:border-box;`
    + `gap:var(--space-4);padding:0 var(--space-4) ${gap}px;min-height:${params.get('long') === '1' ? 200 : 100}dvh`;
  host.innerHTML = form;
} else {
  const body = stage === 'nested'
    ? `<div style="overflow:auto;display:grid;gap:var(--space-4)">${form}</div>`
    : form;
  host.innerHTML = drawer({ title: 'Edit campaign', body, footer: button({ label: 'Save', variant: 'primary' }), open: true });
}
document.body.appendChild(host);
wireDrawer(document.body);
wireDropdown(document.body);
window.__ready = true;
</script>
</body>
</html>
