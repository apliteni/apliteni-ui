<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/src/index.css">
<style>html,body{margin:0;padding:0}</style>
</head>
<body>
<script type="module">
// The vanilla half of #489's acceptance case: a twelve-row menu, no `scroll`,
// with its trigger a chosen distance above the viewport's bottom edge.
// stories/dropdown-reach.test.js serves this at /__shot.
// why: docs/components.md#the-dropdown-panel
import { dropdown, wireDropdown } from '/src/components/dropdown.js';

const params = new URLSearchParams(location.search);
document.documentElement.dataset.theme = params.get('theme') || 'dark';
const portal = params.get('portal') === '1';
// Distance from the trigger's own bottom edge to the viewport's bottom edge.
const bottomGap = Number(params.get('bottomGap') || '300');
// `rows=desc` gives every row a description line and `rows=search` puts a search field over
// the list: the two other row heights the kit has. They are thirty rows long, so each is capped.
const rows = params.get('rows');
const items = Array.from({ length: rows ? 30 : 12 }, (_, i) => ({
  label: `Row ${i + 1}`,
  ...(rows === 'desc' ? { description: 'A short line of detail' } : {}),
}));

// `body=1` puts the dropdown in a scrolling body the way a Modal or Drawer holds it:
// thirty rows, a body from 60px under the top to 60px above the bottom, and the
// trigger 100px above the body's end.
const inBody = params.get('body') === '1';
const spacer = document.createElement('div');
const host = document.createElement('div');
if (inBody) {
  const items30 = Array.from({ length: 30 }, (_, i) => ({ label: `Row ${i + 1}` }));
  const scroller = document.createElement('div');
  scroller.id = 'body';
  scroller.style.cssText = 'position:fixed;inset:60px 0;overflow-y:auto;padding:16px';
  host.innerHTML = dropdown({ value: 'Account', variant: 'menu', items: rows ? items : items30, align: 'start', search: rows === 'search' });
  spacer.style.height = '500px';
  const tail = document.createElement('div');
  tail.style.height = '100px';
  scroller.append(spacer, host, tail);
  document.body.appendChild(scroller);
} else {
  document.body.appendChild(spacer);
  host.innerHTML = dropdown({ value: 'Account', variant: 'menu', items, portal, align: 'start', search: rows === 'search' });
  document.body.appendChild(host);
}
wireDropdown(document.body);

const trigger = host.querySelector('[data-dropdown-trigger]');
const target = window.innerHeight - bottomGap;
if (!inBody) spacer.style.height = `${Math.max(0, target - trigger.getBoundingClientRect().height)}px`;
window.__triggerBottom = trigger.getBoundingClientRect().bottom;
window.__ready = true;
</script>
</body>
</html>
