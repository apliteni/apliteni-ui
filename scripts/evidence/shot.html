<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="/src/index.css">
<style>html,body{margin:0;padding:0}</style>
</head>
<body>
<script type="module">
// A namespace import, not named ones: `wireShell` does not exist on `main`, and
// the before side of every pair is shot off `main` with this same page.
import * as shell from '/src/components/shell.js';
const { appShell, wireShell, ACCOUNT_NAV } = shell;
import { card } from '/src/components/index.js';
import { sidebarNav } from '/src/components/nav.js';

// The same definition Apps/Collapsible rail renders — a group holding the page
// the reader is on, a counter on it, and the account rows the preset adds.
const NAV = [
  { id: 'overview', icon: 'chart', label: 'Overview' },
  {
    icon: 'card',
    label: 'Payouts',
    items: [
      { id: 'pending', icon: 'clock', label: 'Pending', badge: 3 },
      { id: 'history', icon: 'doc', label: 'History' },
    ],
  },
  ...ACCOUNT_NAV,
];

const settingRow = (lab, hint, value) =>
  `<div class="ui-card__row"><div><div class="lab">${lab}</div><div class="hint">${hint}</div></div>${value}</div>`;

const screen = (collapsed) => appShell({
  nav: NAV,
  active: 'pending',
  account: { name: 'Ada Lovelace', email: 'ada@apliteni.com' },
  signOutHref: '#logout',
  crumbs: [{ label: 'Payouts', href: '#' }, { label: 'Pending' }],
  title: 'Pending payouts',
  sub: 'Three payouts are waiting for a second approval.',
  collapsed,
  body: card({
    title: 'Waiting for approval',
    body: settingRow('Northwind Traders', 'Requested by Ada Lovelace', '<span>€4,200.00</span>')
      + settingRow('Globex', 'Requested by Ada Lovelace', '<span>€860.00</span>')
      + settingRow('Initech', 'Requested by Ada Lovelace', '<span>€1,975.50</span>'),
  }),
});

const params = new URLSearchParams(location.search);
document.documentElement.dataset.theme = params.get('theme') || 'dark';
const collapsed = params.get('collapsed') === '1'
  ? true
  : (params.get('collapsed') === '0' ? false : undefined);

// The second subject: sidebarNav({ collapsed }) on its own, with the page the
// reader is standing on inside a group — the row a shut group used to swallow.
if (params.get('subject') === 'nav') {
  document.body.innerHTML = `<div class="navbox">${sidebarNav({
    items: NAV, active: 'pending', collapsed: true,
  })}</div>`;
  // On the rail's own surface, because that is the only place a collapsed
  // sidebarNav() is drawn — #295 took that surface down a step.
  const st = document.createElement('style');
  st.textContent = 'html,body{margin:0;background:var(--surface-2);color:var(--text);'
    + 'font-family:var(--font-sans)}'
    + '.navbox{padding:var(--space-5) var(--space-4)}';
  document.head.append(st);
} else {
  document.body.innerHTML = screen(collapsed);
  if (typeof wireShell === 'function') wireShell(document.body);
}
await document.fonts.ready;
window.__ready = true;
</script>
</body>
</html>
