# Local leak-prevention hooks. Install once:
#   pip install pre-commit && pre-commit install
# Mirrors the CI gates (gitleaks + internal-terms denylist) so leaks are caught
# before they leave your machine.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1 # pin; matches the CI gitleaks version
    hooks:
      - id: gitleaks # auto-loads .gitleaks.toml

  - repo: local
    hooks:
      - id: internal-terms-denylist
        name: internal-terms denylist
        entry: bash -c 'git diff --cached -U0 | grep -nEI "[a-z0-9-]+\.lessly\.run|ttl\.sh/[a-z0-9]|LESSLY_DEPLOY_TOKEN[[:space:]]*[:=]|\b[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}\b" && { echo "Internal identifier in staged diff — redact (see CONTRIBUTING -> Data handling)."; exit 1; } || true'
        language: system
        pass_filenames: false
