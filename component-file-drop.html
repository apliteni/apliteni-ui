<script>
(function(){
  var html=document.documentElement;
  document.querySelectorAll('[data-proto-indeterminate]').forEach(function(el){el.indeterminate=true;});
  var btn=document.getElementById('proto-theme');
  btn.addEventListener('click',function(){
    html.setAttribute('data-theme',html.getAttribute('data-theme')==='dark'?'light':'dark');
    btn.textContent=html.getAttribute('data-theme')==='dark'?'Light theme':'Dark theme';
  });
  function open(){
    var id=decodeURIComponent(location.hash.slice(1));
    var states=document.querySelectorAll('[data-state]');
    if(states.length){
      var hit=false;
      states.forEach(function(s){var on=s.getAttribute('data-state')===id;s.hidden=!on;hit=hit||on;});
      if(!hit)states[0].hidden=false;
      document.querySelectorAll('[data-proto-link]').forEach(function(a){
        a.setAttribute('aria-current',String(a.getAttribute('href')==='#'+(hit?id:states[0].getAttribute('data-state'))));
      });
      return;
    }
    var el=id&&document.querySelector('[data-rule="'+id.replace(/"/g,'')+'"]');
    document.querySelectorAll('[data-proto-open]').forEach(function(s){s.removeAttribute('data-proto-open');});
    if(el){el.setAttribute('data-proto-open','');el.scrollIntoView({block:'start',behavior:'instant'});}
  }
  window.addEventListener('hashchange',open);open();
})();</script>
