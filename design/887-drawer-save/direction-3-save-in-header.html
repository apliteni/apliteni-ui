.ui-check {

/* src/styles/drawer.css */
.ui-drawer {

.ui-drawer.is-open .ui-drawer__panel { pointer-events: auto; }
.ui-drawer__scrim {
  position: absolute;

/* src/styles/tap-zone.css */

    .ui-btn,
    .ui-seg button,
    .ui-tabs__tab,
    .ui-dropdown__trigger,
    .ui-toast__action,
    .ui-drawer__close,

<script>
const css = (id) => document.getElementById(id).textContent;
const head = '<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">'
  + document.getElementById('pv-fonts').innerHTML
  + '<style>' + css('kit') + '</style><style>' + css('proposal') + '</style><style>' + css('stage') + '</style>';
// Kit themes: data-theme="light" is light, no attribute is dark.
const fit = (frame) => {
  const doc = frame.contentDocument;
  if (!doc || !doc.body) return;
  // An open panel is out of the flow, so the stage keeps its height free under the trigger.
  doc.querySelectorAll('.ui-dropdown.open').forEach((dd) => {
    dd.style.marginBottom = (dd.querySelector('.ui-dropdown__panel').offsetHeight + 9) + 'px';
  });
  doc.querySelectorAll('[data-pv-scroll="end"]').forEach((el) => { el.scrollTop = el.scrollHeight; });
  if (frame.dataset.fit === 'content') {
    frame.style.height = '0';
    frame.style.height = (doc.documentElement.scrollHeight + 2) + 'px';
  }
};
const frames = [...document.querySelectorAll('iframe[data-tpl]')];
frames.forEach((frame) => {
  frame.addEventListener('load', () => {
    fit(frame);
    frame.contentDocument.fonts.ready.then(() => { fit(frame); frame.dataset.ready = ''; });
  });
  frame.srcdoc = '<!doctype html><html lang="en"' + (frame.dataset.theme === 'light' ? ' data-theme="light"' : '') + '><head>'
    + head + '</head><body>' + document.getElementById(frame.dataset.tpl).innerHTML + '</body></html>';
});
addEventListener('resize', () => frames.forEach(fit));
</script>
