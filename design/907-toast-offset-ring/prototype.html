/* Source: src/tokens/tokens.css */
/* ============================================================================
 * apliteni-ui — design tokens. Single source of truth for the Apliteni deck theme,
 * with viz/'s colour semantics: purple accent, near-black surfaces, green = live,
 * cyan = link/flag. Two themes, dark (default) and light, toggled with `data-theme`
 * on <html>. Everything downstream references the SEMANTIC tokens, never the ramp.
 * ========================================================================== */

:root {
  /* -- Brand ramp (theme-invariant hues) ---------------------------------- */
  --purple-900: #4c1f94;
  --purple-700: #6a2dcc;
  --purple-500: #9b5dff;
  --purple-400: #b479ff;
  --cyan-500:   #20dcf5;
  --green-500:  #98ff8f;

  /* -- Radius scale ------------------------------------------------------- */
  --radius-xs: 6px;
  --radius-sm: 9px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 18px;
  --radius-2xl: 24px;
  --radius-pill: 999px;

  /* -- Spacing scale (4px base) ------------------------------------------- */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  /* -- Measure ------------------------------------------------------------
   * --container is the page, gutter to gutter; --measure is the reading column
   * INSIDE a track, beside a sidebar. Different axes, never interchangeable.
   * why: docs/foundations.md#widths */
  --container: 1120px;
  --measure: 860px;

  /* -- Typography ---------------------------------------------------------
   * Two roles, not one family. --font-display is the brand voice — headings,
   * brand lockups, large readouts — and --font-sans is what an application is
   * actually made of: tables, fields, paragraphs, chat. Poppins is a geometric
   * display grotesque and holds its character at heading sizes; at 13-14px it
   * smears, worst of all in Cyrillic, which is where the kit spends most of its
   * pixels. IBM Plex Sans is humanist and narrower, and its Cyrillic was drawn
   * by the same team as its Latin.
   * why: docs/foundations.md#typefaces */
  --font-display: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;

  --text-xs:   12px;
  --text-sm:   13px;
  --text-base: 14.5px;
  --text-md:   15.5px;
  --text-lg:   18px;
  --text-xl:   22px;
  --text-2xl:  30px;
  --text-3xl:  40px;
  --text-4xl:  56px;

  --weight-light: 300;
  --weight-normal: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;

  --leading-tight: 1.2;
  --leading-snug: 1.4;
  --leading-normal: 1.62;

  --tracking-tight: -0.01em;
  --tracking-normal: 0;
  --tracking-wide: 0.04em;
  --tracking-caps: 0.14em; /* nothing in the kit reads it since #268; consumer rules still may */

  /* -- Motion -------------------------------------------------------------
   * The kit's legacy --dur-* and --ease names alias onto the brand's
   * --duration-* and --easing-* primitives, so every component consumes one
   * vocabulary; the fallbacks keep tokens.css self-sufficient when imported
   * without brand.generated.css. Delays are the kit's own, and the reusable
   * effect layer lives in styles/motion.css.
   * Change generated brand tokens upstream in apliteni/design-system. */
  --ease: var(--easing-ease-in-out, cubic-bezier(0.4, 0, 0.2, 1));
  --ease-out: var(--easing-ease-out, cubic-bezier(0, 0, 0.2, 1));
  --ease-in: var(--easing-ease-in, cubic-bezier(0.4, 0, 1, 1));
  --ease-sharp: var(--easing-sharp, cubic-bezier(0.4, 0, 0.6, 1));
  --ease-spring: var(--easing-spring, cubic-bezier(0.34, 1.56, 0.64, 1));

  --dur-instant: var(--duration-instant, 0.08s); /* 80ms — press, tick */
  --dur-fast: var(--duration-fast, 0.15s);   /* 150ms — hover, press */
  --dur-med: var(--duration-normal, 0.25s);  /* 250ms — panels, dropdowns */
  --dur-slow: var(--duration-slow, 0.4s);    /* 400ms — enters, reveals */

  --delay-1: 60ms;
  --delay-2: 120ms;
  --delay-3: 180ms;
  --delay-4: 240ms;
  --delay-5: 300ms;

  /* -- Elevation (z) ------------------------------------------------------ */
  --z-base: 1;
  --z-sticky: 10;
  --z-dropdown: 30;
  --z-overlay: 100;
  --z-toast: 200;
}

/* ============================================================================
 * DARK THEME (default) — deck palette from viz/index.html
 * ========================================================================== */
/* A ThemeChoice scene draws this theme inside a page of either theme. */
:root,
.ui-theme-choice__scene--dark,
:root[data-theme="dark"] {
  color-scheme: dark;

  --purple: #6a2dcc;
  /* The ramp moves up one step so --accent is --purple-light again, the shape light
     Nebula and light Ocean already ship; left alone the two tokens would resolve to
     one colour. #bd8cff becomes the ramp's top step instead. See issue #157. */
  --purple-light: #b479ff;
  --purple-mid: #bd8cff;
  --cyan: #20dcf5;
  --green: #98ff8f;
  /* Lighter than it looks like it should be: --pink is read mostly ON its own 16%
     glow, and that wash lifts the ground faster than the hue lifts the ink, so danger
     moved AWAY from the canvas. Light moves the opposite way. See issue #131. */
  --pink: #e97ca5;
  --amber: #ffcf6a;

  /* The elevation ladder, bottom to top. A surface says how high it is with its step
     and, IN DARK, with the hairline around it; --muted caps how far the ladder can go.
     Nothing casts in dark below the floating step, and the floating step adds
     --elev-drop under its inner line. why: docs/foundations.md#elevation */
  --bg: #0e0d14;
  --table-bg: var(--bg);
  /* A dark table is flush with the page, so the reading surface an inline code chip has
     left inside one is the card. Light's table is white, so there it is the page. */
  --table-code-bg: var(--surface);
  /* A translucent wash paints BEHIND a chip, so it moves the ground and not the chip: the
     pair has to be read against the wash composited over whatever opaque surface is under
     it. Dark's washes lift a near-black ground away from the page, so the page is what the
     chip has left; light's darken white toward the page, so the card is. Both directions
     hold over EVERY opaque ground, which is why this is a token and not a context rule.
     Measured in stories/code-chip.test.js. */
  --wash-code-bg: var(--bg);
  --code-chip-page: var(--surface);  /* a chip on the page takes the card */
  --code-chip-surface: var(--bg);    /* a chip in a painted container takes the page */
  /* The auth page's branded ground, brand C: a 135-degree gradient a product may override. */
  --ui-auth-ground: linear-gradient(135deg, color-mix(in srgb, var(--color-apliteni-violet-1) 32%, var(--bg)), color-mix(in srgb, var(--color-apliteni-blue-1) 24%, var(--bg)));
  /* The document page's bare backdrop, behind the A4 sheet: the same sunken rung a
     table takes inside a viewer, named once so a page reads it as its own ground. */
  --ui-document-ground: var(--surface-2);
  --surface-2: #161520;     /* non-text sunken marks and tracks */
  --surface: #211e2d;       /* the card */
  --bg-elevated: #2a2639;   /* FLOATING — menus, panels, drawer, modal, toasts */
  --surface-3: #2d293c;     /* non-text quiet fills */
  --seg-active-bg: #383350; /* raised pill — clearly above the inset track in dark */
  --nav-active-fill: var(--surface); /* one rung off the page the open rail stands on */
  /* The raised handle on a control track (switch knob). White in both themes and under
     every accent: it reads on the plain track AND on the accent fill of an on control. */
  --control-knob: #ffffff;
  --border: #332f45;
  --border-strong: #453f5c;

  /* WHICH EDGE EACH LEVEL DRAWS. One name per level, so a sheet never has to ask
     which theme it is in. Dark answers all four with the hairline, because a drop
     on a near-black page reaches 1.20 at its core and has nowhere else to go.
     Light draws one line and adds a faint short drop. why: docs/foundations.md#elevation */
  --card-edge: var(--border);          /* a card */
  --rail-edge: var(--border);          /* the shell's rail */
  --float-edge: var(--border-strong);  /* a floating surface, outer line */
  --float-edge-inner: var(--border);   /* a floating surface, inner line */
  --modal-edge: transparent;           /* the modal: the deep scrim is its edge */

  /* Fields use the card surface and an edge in both themes. why: docs/foundations.md#elevation */
  --field-bg: var(--surface);
  --field-edge: var(--border);
  --field-edge-hover: var(--border-strong);
  --control-edge: var(--border);

  /* How much of its own colour a tinted card mixes in. Dark mixes upward off a mid-grey
     card, so it can afford this much. why: docs/foundations.md#elevation */
  --card-tint: 9%;
  /* A selected row takes the card's tint, and one step more under the pointer. #814 */
  --card-tint-hover: 12%;
  /* How much of its tone an undo notice's countdown ring mixes into the notice ground. The
     danger and neutral rings take the strong mix, so they keep 3:1 in dark. In light the
     soft mix is 95%, so the warn and info rings keep 3:1 on the action's hover fill. #888
     why: docs/components.md#toast */
  --toast-timer-mix: 45%;
  --toast-timer-mix-strong: 60%;

  --text: #e9e7f0;
  --strong: #ffffff;
  --dim: #c6c2d6;
  /* Picked against the TOP of the ladder above, not against the page: #948fa8 cleared the
     two floating steps by hundredths. Same violet-grey, fourteen steps up every channel.
     why: docs/foundations.md#elevation */
  --muted: #a29db6;

  /* The paint of a control that is off. NOT an opacity: `opacity` is a group property,
     so it fades label and box toward the ground TOGETHER — a disabled primary button
     measured 1.48:1 that way. These three are aliases that composite predictably, the
     ink read on the surface beside it. Held by guidelines/accessibility-floor.test.js.
     why: docs/foundations.md#colour-and-contrast */
  --disabled-ink: var(--muted);
  --disabled-surface: var(--surface);
  /* One rung below the hairline, so an off box is not the live box with quieter words
     in it: dark answered both with --border. 1.16:1 on the card against the live
     1.27:1, and as far down as the headroom goes. #564
     why: docs/foundations.md#colour-and-contrast */
  --disabled-border: var(--surface-3);
  /* The ink of a disabled control that paints no box of its own — a ghost button. With
     no surface beside it, it is read on whatever is behind it, so it is set to clear the
     floor on the dullest ground there is (--surface-3). #273
     why: docs/foundations.md#colour-and-contrast */
  --disabled-ink-bare: #a39eb7;
  /* A disabled option in a menu panel: paler than --muted, so it does not take the ink of the
     bold muted group label above it. 4.14:1 on --bg-elevated, over the 3:1 floor. #886 */
  --disabled-ink-option: color-mix(in srgb, var(--muted) 80%, var(--bg-elevated));

  /* Lifted from #9b5dff, which cleared the flat surfaces and failed on its own wash over
     a card; the value was already in the ramp. --ring-color is var(--accent) and follows by
     reference. Held by stories/accent-contrast.test.js. #157.
     why: docs/foundations.md#colour-and-contrast */
  --accent: #b479ff;
  --accent-strong: #7c3aed; /* button bg — white text clears WCAG AA at 5.70:1 */
  --accent-contrast: #ffffff;

  /* Ink that reads on a SIGNAL colour once that colour becomes a fill — the glyph in a
     success circle, or on a toast's status circle. One near-black ink clears all five in
     dark; danger keeps its own token because LIGHT still needs one.
     why: docs/foundations.md#colour-and-contrast */
  --signal-contrast: #0c0c0c;
  --danger-contrast: var(--signal-contrast);

  --glow-green: rgba(152, 255, 143, 0.16);
  /* Dropped from 0.18: the wash, not the surface beneath it, is what put --accent under
     AA. Re-tinted from the new --accent, which signal-contrast.test.js requires. #157. */
  --glow-purple: rgba(180, 121, 255, 0.12);
  --glow-cyan: rgba(32, 220, 245, 0.14);
  --glow-pink: rgba(233, 124, 165, 0.16);

  /* Status-chip paint — the ink + fill of a badge / pill. Dark tints with the signal's
     own glow; light needs a solid, deepened pair, which is why these are a token pair. */
  --chip-success-ink: var(--green);
  --chip-success-fill: var(--glow-green);
  --chip-warn-ink: var(--amber);
  --chip-warn-fill: color-mix(in srgb, var(--amber) 15%, transparent);
  /* Not --pink: that reads 4.23:1 on this fill over a floating panel, under the 4.5:1 badge
     floor. Same hue lifted toward white — 8.64 page / 7.02 card / 6.30 panel. The signal
     and the solid-toast pair keep --pink. why: docs/foundations.md#colour-and-contrast, #453 */
  --chip-danger-ink: #f5aec6;
  --chip-danger-fill: var(--glow-pink);
  --chip-info-ink: var(--cyan);
  --chip-info-fill: var(--glow-cyan);
  /* Status word ink: a tone word with no fill, read on a table row. Dark keeps the chip
     ink, which is 7.42:1 or more on every row ground. Light deepens it, see there. */
  --status-warn-ink: var(--chip-warn-ink);
  --status-info-ink: var(--chip-info-ink);
  --status-danger-ink: var(--chip-danger-ink);
  /* The fill of a chip with no status to carry. The themes match on SEPARATION, not on
     alpha — 12% here is 1.22:1 off the card, 15% in light is 1.23:1 — because --muted is
     a light violet-grey in dark and a mid slate in light.
     why: docs/foundations.md#colour-and-contrast, #453 */
  --chip-neutral-fill: color-mix(in srgb, var(--muted) 12%, transparent);

  /* Solid signal surfaces — a status that has stopped being ink and become the FILL (a
     solid toast). Fill and ink are ONE pair, never two independent picks: the fill is the
     status at this theme's extreme and the ink the pole opposite it, so a single ink
     clears all five. --muted is already its own fill-strength form. See #131, #149. */
  --signal-solid-ink: var(--signal-contrast);
  --signal-solid-success: var(--green);
  --signal-solid-danger: var(--pink);
  --signal-solid-warn: var(--amber);
  --signal-solid-info: var(--cyan);
  --signal-solid-neutral: var(--muted);

  /* Person hues: the eight fills an Avatar takes from a hash of the person's key. Fixed
     values and not accent tints, so a person keeps one hue under every accent and in
     every app. Each is an existing kit value for this theme, and --signal-solid-ink
     holds 4.5:1 on all eight. why: docs/components.md#avatar */
  --person-0: #bd8cff;
  --person-1: #5ab0ff;
  --person-2: #20dcf5;
  --person-3: #3ad9a0;
  --person-4: #98ff8f;
  --person-5: #ffcf6a;
  --person-6: #ff8a5c;
  --person-7: #f5aec6;

  /* DEPRECATED since #295: no surface below the floating step casts, and the floating
     step reads --elev-drop rather than any of these. Published still, so a consumer
     reading one gets nothing rather than an unresolved var(), and a consumer who wants a
     cast shadow sets them. Nothing in src/ reads them.

     A transparent shadow, not `none`, because these are read in a LIST — a surface's
     edge and its drop are two layers of one declaration — and `none` is valid only
     alone, so it makes the whole declaration invalid and takes the layers beside it
     with it. `0 0 #0000` composes. why: docs/foundations.md#elevation */
  --shadow-sm: 0 0 #0000;
  --shadow-md: 0 0 #0000;
  --shadow-lg: 0 0 #0000;
  --shadow-seg: 0 0 #0000;
  --shadow-card: 0 0 #0000;
  /* ONE band, drawn as a real OUTLINE, and no halo. Artur took the halo off on #578
     after #557 drew a scroll region's band without one. An outline leaves its offset
     UNPAINTED, so the 1px between the control and the band is whatever surface the
     control is already standing on — which is what retired --ring-gap and the
     per-surface recomposition behind it, and what leaves forced colors a real outline
     to repaint instead of a transparent stand-in.
     why: docs/foundations.md#the-focus-ring */
  --ring-width: 2px;
  --ring-color: var(--accent);
  --ring-gap-width: 1px;
  --ring: var(--ring-width) solid var(--ring-color);
  --ring-offset: var(--ring-gap-width);
  /* What a scroll region inside a surface takes: the same band, drawn inward rather
     than outward, because an inset shadow is painted under the box's own children and
     a table scrolled under one erases it. Only the offset differs. Chosen by Artur on
     #531 round r30. why: docs/foundations.md#the-focus-ring */
  --ring-scroll: var(--ring);
  --ring-scroll-offset: calc(-1 * (var(--ring-gap-width) + var(--ring-width)));

  /* The ink a cast shadow is made of, and the specular white that reads as gloss on a
     raised surface. Effects mix these instead of writing rgba(). */
  --shadow-ink: #000000;
  --sheen: #ffffff;

  /* The drops of the floating treatment, in Primer's --shadow-floating-* order:
     the inner half of the two-step edge, then these. The line is NOT in this
     token and cannot be — a var() inside a custom property is substituted on the
     element that DECLARES it, so an --elev-edge read here resolves at :root and
     nothing below could re-point it. A floating surface writes the pair itself:
       box-shadow: inset 0 0 0 1px var(--elev-edge, var(--float-edge-inner)), var(--elev-drop);
     Dark spends 62% / 50% of the ink and reaches 1.20 at the drop's core, having
     nowhere to go on a near-black page. why: docs/foundations.md#elevation */
  --elev-drop:
    0 14px 30px -12px color-mix(in srgb, var(--shadow-ink) 62%, transparent),
    0 3px 9px -4px color-mix(in srgb, var(--shadow-ink) 50%, transparent);

  /* The ladder's two resting rungs, which only light climbs. Transparent here and
     not `none`, for the reason the deprecated --shadow-* tokens are: these are read
     in a layer list, and `none` is valid only alone — it would invalidate the whole
     declaration and take the layers beside it with it. why: docs/foundations.md#elevation */
  --elev-rest: 0 0 #0000;   /* a card */
  --elev-rail: 0 0 #0000;   /* the shell's rail, cast sideways */

  /* Backdrop that dims the page behind an overlay (drawer, modal, composer). */
  --scrim: rgba(0, 0, 0, 0.58);

  /* Chart series tones (#740, the "Soft fade" palette), the same under every accent. A tone is the bar's data
     end and clears 3:1 on the card and the page; its -fade is the bar's base, a tint
     of the tone that does not clear 3:1 on the card by design. why: docs/components.md#chart */
  --chart-accent: #347bcd;
  --chart-accent-fade: #2b5185;
  --chart-accent-soft: #26a7a9;
  --chart-accent-soft-fade: #246971;
  --chart-bad: #dd6a77;
  --chart-bad-fade: #884856;
  --chart-good: #4c7a37;
  --chart-good-fade: #395133;
  --chart-warn: #b78c26;
  --chart-warn-fade: #745b29;
  --chart-info: #9256a0;
  --chart-info-fade: #5f3d6c;
  --chart-neutral: #a29db6;
  --chart-neutral-fade: #686478;

  /* Accent gradient stops (hero headline, marketing) — overridden per sub-theme.
     --grad-from is pinned to a literal rather than tracking --purple-light, which #157
     moved up a step; every --grad-from in accents.css is a literal for the same reason. */
  --grad-from: #9b5dff;
  --grad-to: var(--cyan);
}

/* ============================================================================
 * LIGHT THEME — deck light palette from viz/account.mjs
 *
 * A document sheet (.ui-card__page) takes this palette in both themes: the document
 * is paper, so it stays white with dark ink on a dark stage too. Decided on #736.
 * ========================================================================== */
.ui-theme-choice__scene--light,
.ui-card__page,
:root[data-theme="light"] {
  color-scheme: light;

  --purple: #6a2dcc;
  --purple-light: #6a2dcc;
  --purple-mid: #7a3be0;
  --cyan: #0c8fa8;
  --green: #1c8a2c;
  /* Deeper than the dark pink for the same reason dark's is lighter: the wash under it
     is the page, so the ink comes down to meet it. Down a second step at #295, which
     took the page off white. See issues #131 and #295. */
  --pink: #a92d59;
  --amber: #b5730a;

  /* The same ladder, run the only way light can run it: nothing is brighter than
     white, so light moves DOWN from it. #307 ran it downwards from the CARD, which
     put the page at #eef0f5 and left the card at #f8f9fc — a grey canvas under a
     surface only 1.08:1 above it, so the grey was what the screen read as and the
     card never arrived. The card takes the white instead, and the page is the
     lightest ground that still leaves it a step: 1.11:1, on a page lighter and less
     blue than the one it replaces. Light spends its white on the surface you read
     ON, and separates the panel that floats over it by role — its two-step edge and
     its drop — rather than by a rung it has nothing left to pay for. See issue #448.
     why: docs/foundations.md#elevation */
  --bg: #ffffff;           /* the page takes the card's white, #850: --surface is #ffffff here, written out because gates read --bg without var() substitution */
  --table-bg: var(--bg);   /* a table is flush with the page */
  --table-code-bg: var(--surface-3); /* a chip in a table takes a quiet fill: page and card are one white now */
  --wash-code-bg: var(--surface-3);   /* a chip on a wash takes a quiet fill for the same reason */
  --code-chip-page: var(--surface-3); /* #850: page and card are one white, so a chip takes the quiet fill */
  --code-chip-surface: var(--surface-3);
  /* The auth page's branded ground, brand C: a 135-degree gradient a product may override. */
  --ui-auth-ground: linear-gradient(135deg, var(--color-apliteni-violet-7), var(--color-apliteni-blue-8));
  /* The document page's bare backdrop, behind the A4 sheet: the same sunken rung a
     table takes inside a viewer, named once so a page reads it as its own ground. */
  --ui-document-ground: var(--surface-2);
  --surface-2: #e9ecf3;     /* non-text sunken marks and tracks */
  --surface: #ffffff;       /* the card */
  --bg-elevated: #ffffff;   /* FLOATING — menus, panels, drawer, modal, toasts */
  --surface-3: #eef0f5;     /* non-text quiet fills */
  --seg-active-bg: #ffffff; /* white pill raised above the grey track in light */
  --nav-active-fill: var(--surface-3); /* one rung off the white page, #850 */
  --control-knob: #ffffff;
  --border: #e4e7ee;
  --border-strong: #cdd2dc;

  /* Light draws each LEVEL with one line and a faint short shadow. The line is half
     way between --border and --border-strong. Decided on #730.
     why: docs/foundations.md#elevation */
  --level-line: color-mix(in srgb, var(--border) 50%, var(--border-strong));
  --card-edge: var(--level-line);
  --rail-edge: var(--level-line);
  --float-edge: var(--level-line);
  --float-edge-inner: transparent;
  --modal-edge: var(--float-edge);

  /* Light draws a field with its EDGE, because since #448 it has no well left to draw it
     with: a card and a panel are both white, the sunken step falls two rungs under either,
     and --border on it measures 1.047:1. why: docs/foundations.md#elevation */
  --field-bg: var(--surface);
  --field-edge: var(--border-strong);
  --field-edge-hover: var(--muted);
  --control-edge: var(--border-strong);

  /* Light mixes DOWN from white, so tint costs lightness: 5% is the most a card can spend
     and stay above the page. why: docs/foundations.md#elevation */
  --card-tint: 5%;
  --card-tint-hover: 8%;
  --toast-timer-mix: 95%;
  --toast-timer-mix-strong: 85%;

  --text: #1a1e27;
  --strong: #0c0e13;
  --dim: #3a404b;
  --muted: #5c6270;

  /* Disabled text stays on the card surface; its ink marks the unavailable state. */
  --disabled-ink: var(--muted);
  --disabled-surface: var(--surface);
  /* The hairline, where dark takes the rung under it: light's field edge is already
     --border-strong, so the two states read 1.52:1 and 1.24:1. #564 */
  --disabled-border: var(--border);
  --disabled-ink-bare: #585e6c;
  /* 3.88:1 on --bg-elevated. #886 */
  --disabled-ink-option: color-mix(in srgb, var(--muted) 80%, var(--bg-elevated));

  --accent: #6a2dcc;
  --accent-strong: #6a2dcc; /* already dark enough for white text */
  --accent-contrast: #ffffff;

  --signal-contrast: #0c0c0c;
  --danger-contrast: #ffffff;

  /* Re-tinted from --green; it was rgba(30, 150, 50, .1), a colour that exists nowhere
     else in the kit while the other three light glows are exact tints of their own token.
     The wash over white moves at most two levels on a channel and no verdict moves with
     it. Gated for all four glows in stories/signal-contrast.test.js. */
  --glow-green: rgba(28, 138, 44, 0.1);
  --glow-purple: rgba(106, 45, 204, 0.09);
  --glow-cyan: rgba(12, 143, 168, 0.1);
  --glow-pink: rgba(169, 45, 89, 0.1);   /* an exact tint of --pink above */

  /* Solid chip pairs for the light app. Each ink is deepened past its signal hue so 12px
     chip text clears WCAG AA on its own pale fill, and on the soft toast's wash, which
     #131 gave the same ink. Three came down again at #295 with the page; danger did not
     need to. */
  /* Success is held at the 7:1 body aim rather than the 4.5:1 floor: 7.17:1 on its own
     fill, 8.33:1 on the card. Was #1c7034 at 5.29:1. The fill did not move.
     why: docs/foundations.md#colour-and-contrast, #453 */
  --chip-success-ink: #145a26;
  --chip-success-fill: #dff3e4;
  --chip-warn-ink: #825900;
  --chip-warn-fill: #fbedd2;
  --chip-danger-ink: #b7295f;
  --chip-danger-fill: #fbe0ea;
  /* Info was the one signal family without a pair, so the info badge painted --cyan on
     --glow-cyan over white and missed AA. This pair sits in the band the other three
     already occupy. See issue #131. */
  --chip-info-ink: #096a7c;
  --chip-info-fill: #ddeff3;
  /* A status word has no fill, so a selected row's accent wash is its ground. The chip
     inks read 4.95 to 6.24:1 there. These reach the 7:1 body aim on a plain, a selected
     and a selected hover row under every accent. Owner decision on #814. */
  --status-warn-ink: #684600;
  --status-info-ink: #025463;
  --status-danger-ink: #990149;
  /* See the dark block for why the two alphas differ. */
  --chip-neutral-fill: color-mix(in srgb, var(--muted) 13%, transparent);

  /* Light runs the same rule the other way. The signals are mid-tone here, so NO ink
     rescues them and the fill is what has to move: it takes the deepened form the chip
     pair already carries, and white clears every one. A future status supplies one
     --signal-solid-* value dark enough for white and inherits the ink. See #131, #149. */
  --signal-solid-ink: #ffffff;
  --signal-solid-success: var(--chip-success-ink);
  --signal-solid-danger: var(--chip-danger-ink);
  --signal-solid-warn: var(--chip-warn-ink);
  --signal-solid-info: var(--chip-info-ink);

  /* Person hues, light: the deepened forms, so white holds on every one. */
  --person-0: #6a2dcc;
  --person-1: #005ab4;
  --person-2: #096a7c;
  --person-3: #076c48;
  --person-4: #145a26;
  --person-5: #825900;
  --person-6: #a8370c;
  --person-7: #b7295f;
  --signal-solid-neutral: var(--muted);

  /* Deprecated and unread — see the dark block. */
  --shadow-sm: 0 0 #0000;
  --shadow-md: 0 0 #0000;
  --shadow-lg: 0 0 #0000;
  --shadow-seg: 0 0 #0000;
  --shadow-card: 0 0 #0000;
  /* No --ring here. :root's band is var(--accent), and light re-points --accent. */

  --shadow-ink: #1e1e32;
  --sheen: #ffffff;

  /* THE LIGHT LADDER. Three rungs, each two layers: a wide faint one and a short one.
     Each layer is offset on one axis, blurred at least twice as wide as it is offset,
     and held in by a negative spread. None is a glow — a glow is a zero-offset layer of
     the signal's own colour. Each rung is short and faint, because the level's line
     marks the edge and the rung only adds lift. Decided on #730.
     why: docs/foundations.md#elevation */
  --elev-rest:
    0 2px 6px -1px color-mix(in srgb, var(--shadow-ink) 6%, transparent),
    0 1px 3px -1px color-mix(in srgb, var(--shadow-ink) 4%, transparent);
  --elev-rail:
    3px 0 8px -3px color-mix(in srgb, var(--shadow-ink) 6%, transparent),
    1px 0 3px -1px color-mix(in srgb, var(--shadow-ink) 4%, transparent);
  --elev-drop:
    0 12px 32px -12px color-mix(in srgb, var(--shadow-ink) 16%, transparent),
    0 1px 8px -3px color-mix(in srgb, var(--shadow-ink) 9%, transparent);

  --scrim: rgba(20, 22, 40, 0.38);

  /* Chart series tones (#740): the dark block's comment holds for these. */
  --chart-accent: #236cbd;
  --chart-accent-fade: #86aedb;
  --chart-accent-soft: #04999c;
  --chart-accent-soft-fade: #75c7c9;
  --chart-bad: #c15260;
  --chart-bad-fade: #dda0a8;
  --chart-good: #3e6c29;
  --chart-good-fade: #95ae89;
  --chart-warn: #a97e0e;
  --chart-warn-fade: #d0b87a;
  --chart-info: #80448d;
  --chart-info-fade: #b998c0;
  --chart-neutral: #5c6270;
  --chart-neutral-fade: #a5a9b0;

  --grad-from: var(--purple-light);
  --grad-to: var(--cyan);
}
/* The ring is declared once, in the dark block, and computed at :root. The sheet takes the
   light accent above, so it computes its ring again or a focus on the paper keeps the dark one. */
.ui-card__page {
  --ring-color: var(--accent);
  --ring: var(--ring-width) solid var(--ring-color);
  --ring-scroll: var(--ring);
}

/* ============================================================================
 * WIDTHS BELOW THE PAGE — the box, and the line. Two scales, and one rule for
 * choosing between them: THE UNIT SAYS WHICH SCALE YOU ARE ON.
 *
 *   a box that holds a COMPONENT   ->  --panel-*   (px)
 *   a box that holds a LINE        ->  --prose-*   (ch)
 *
 * Both are theme-invariant, so they sit outside the palette blocks.
 * why: docs/foundations.md#boxes-below-the-page
 * ========================================================================== */
:root {
  /* -- Panel widths -------------------------------------------------------
   * Not a new scale: the drawer has shipped sm/md/lg at these three values, and
   * confirm, the auth card and the toast each wrote one out again (#208). */
  --panel-sm: 320px;
  --panel-md: 420px;
  --panel-lg: 560px;

  /* -- Prose measures -----------------------------------------------------
   * ch resolves against the font-size of the element it is DECLARED on, so a step
   * goes on the paragraph itself, never on a wrapper holding two type sizes. The
   * four steps are the reading band (44–72ch), named for what is being read:
   *   caption  one or two sentences under a glyph, centred
   *   lede     the line under a title
   *   body     a left-aligned column of copy
   *   dense    reference prose set below 13px, where the band runs wider
   * --prose-display is NOT a measure — it is where a display headline rags. */
  --prose-display: 14ch;
  --prose-caption: 44ch;
  --prose-lede: 54ch;
  --prose-body: 62ch;
  --prose-dense: 72ch;
}

/* An inline code chip is text on a chip, so #455 leaves it two grounds and no grey: the
 * page and the card. It cannot read the one it is on — a var() inside a custom property is
 * substituted on the element that DECLARES it — so the painted container hands it the one
 * it is not using itself, and the chip keeps a step wherever it is written. The page hands
 * over the card below; every painted container hands over the page, in the recipe under it.
 * Held by stories/code-chip.test.js. why: docs/foundations.md#elevation */
:root { --code-bg: var(--code-chip-page); }

/* Every painted container hands an inline code chip the page. One recipe keeps surface
 * propagation cheap and consistent. The ring is not in this list since #578: an outline
 * paints no gap of its own, so a focused control needs nothing handed down to it. */
.amenu,
.dtsw,
.rx-modal,
.ui-app__rail,
.ui-auth__card,
.ui-callout,
.ui-card__page,
.ui-cmdk__panel,
.ui-confirm__panel,
.ui-drawer__footer,
.ui-drawer__panel,
.ui-dropdown__panel,
.ui-fbcomposer,
.ui-filter-bar__chip,
.ui-float-bar,
.ui-footer--app,
.ui-seg,
.ui-snippet--reveal,
.ui-sx,
.ui-table,
.ui-table-scroll,
.ui-table--sticky thead th,
.ui-table--pinned .ui-table__identity, .ui-table--pinned .ui-table__selection,
.ui-table--zebra tbody tr:nth-child(even) td,
.ui-toast,
.ui-toast--soft,
.ui-toast--outline,
.ui-toast--solid,
.vsw__menu {
  --code-bg: var(--code-chip-surface);
}

/* #850: a card on the page draws no box, so a chip inside one sits on the page and takes
 * the same surface a chip on the page takes. #850's review keeps the dark card's own
 * paint, so a chip inside one takes the page, the rung below it — --code-chip-surface is
 * the page's chip in dark and the page's chip in light, where the two agree. The split
 * auth's plain half and its shell paint the page for the same reason, and a tinted card
 * keeps the plain card as its step. */
.ui-card {
  --code-bg: var(--code-chip-surface);
}
.ui-card--accent,
.ui-card--live,
.ui-auth--split,
.ui-auth--split .ui-auth__pane {
  --code-bg: var(--code-chip-page);
}

/* The two painted grounds that are not a plain card, and what each has left to hand over.
 *
 * A table paints the page in dark and white in light and follows its card when it is in
 * one, so its hand-off travels with --table-bg as a token pair (src/styles/table.css
 * re-points both). A TINTED surface mixes its colour INTO the card, so the card is the
 * surface it still has: light mixes the tint down from white, which moves a tinted card
 * toward the page and leaves the page 1.02 away, while the card it is a variant of stays
 * 1.07-1.14 off in both themes. Measured in stories/code-chip.test.js. */
.ui-table,
.ui-table-scroll,
.ui-table--sticky thead th,
.ui-table--pinned .ui-table__identity, .ui-table--pinned .ui-table__selection,
.ui-table--zebra tbody tr:nth-child(even) td { --code-bg: var(--table-code-bg); }
/* A neutral hovered row gives an inline code chip the card surface. The step from
 * --surface-2 clears 1.1:1 in both themes, even when the table follows a card. */
.ui-table--hover tbody tr:hover:not(.is-target),
.ui-table--hover tbody tr:hover:not(.is-target) > :is(td, th),
.ui-table-scroll > .ui-table--hover tbody tr:hover:not(.is-target) > :is(td, th) {
  --code-bg: var(--surface);
}
/* The row table hovers on --surface-3, and a chip there keeps the card surface. A selected
 * row mixes the accent into the table ground, so a chip there keeps that plain ground. */
.ui-table.ui-table--hover:not(.ui-table--zebra):not(.ui-table--dense) tbody tr:hover:not(.is-target) > :is(td, th) { --code-bg: var(--surface); }
.ui-table.ui-table--hover:not(.ui-table--zebra):not(.ui-table--dense) tbody tr:not(.is-target):has(> .ui-table__selection :checked) > :is(td, th),
.ui-table.ui-table--hover:not(.ui-table--zebra):not(.ui-table--dense) tbody tr:not(.is-target):has(> .ui-table__selection :checked):hover > :is(td, th) { --code-bg: var(--table-bg); }
/* A hovered row in a drawer group takes --surface in dark, so a chip there keeps the page.
   The drawer adds no weight, so a checked row keeps the hand-off above. */
:where(.ui-drawer .ui-drawer__section) .ui-table.ui-table--hover:not(.ui-table--zebra):not(.ui-table--dense) tbody tr:hover:not(.is-target) > :is(td, th) { --code-bg: var(--code-chip-surface); }
:where(:root[data-theme="light"] .ui-drawer .ui-drawer__section) .ui-table.ui-table--hover:not(.ui-table--zebra):not(.ui-table--dense) tbody tr:hover:not(.is-target) > :is(td, th) { --code-bg: var(--surface); }
.ui-snippet--reveal { --code-bg: var(--surface); }

/* A wash is not a rung: it is a layer the kit paints OVER one, and it paints behind a chip
 * rather than under it, so the chip's ground moves and the chip does not. These five take
 * caller markup — callout() and the success panel hand their body straight through — so a
 * chip inside one is ordinary product markup rather than a shape anybody hand-places. */
.ui-callout--info,
.ui-callout--success,
.ui-callout--warn,
.ui-callout--danger,
.ui-success { --code-bg: var(--wash-code-bg); }

/* React badges and pills accept inline code on opaque or translucent status fills. */
.ui-badge,
.ui-badge--live,
.ui-badge--soon,
.ui-badge--info,
.ui-badge--warn,
.ui-badge--danger,
.ui-badge--archive,
.ui-badge--success,
.ui-badge--pending,
.ui-badge--neutral,
.ui-pill,
.ui-pill--live,
.ui-pill--soon { --code-bg: var(--wash-code-bg); }

/* Source: src/tokens/accents.css */
/* Accent sub-themes — an orthogonal `data-accent` dimension on top of
 * `data-theme`. On <html>, with or without a theme:
 *
 *     <html data-theme="dark" data-accent="phoenix">
 *     <html data-accent="phoenix">              <!-- default theme, same accent -->
 *
 * Each sub-theme only re-points the accent family. Surfaces, text and signal
 * colours (green = live, pink = danger) stay put, so every accent works in
 * light AND dark and every component follows with no component-level change.
 *
 * --ring is NOT here: it is declared once in tokens.css as var(--accent), so
 * re-pointing --accent re-points the focus ring too.
 *
 * Every dark cell is a two-line selector list — a bare `:root[data-accent]`
 * above the stamped form — which is the shape tokens.css gives the dark theme
 * one file earlier, and for the same reason: the default theme needs no
 * attribute, so neither may the accent. Written stamped-only, `data-accent`
 * paints nothing at all in the state hosts use to mean "follow the system",
 * where data-theme is simply absent. See issue #250.
 *
 * That bare line ties on specificity with :root[data-theme="light"] and wins on
 * import order, so LIGHT is what the cascade has to be careful about: each light
 * cell carries three attributes to out-specify it, and declares the same
 * properties as its dark twin so none of the dark ramp leaks past it. Adding a
 * property to one half of a pair and not the other is what breaks that, and
 * stories/accent-without-theme.test.js is the gate that says so.
 *
 * why: docs/foundations.md#the-focus-ring */

/* ---- Phoenix — ember / rising fire (the strategy's namesake) ------------- */
:root[data-accent="phoenix"],
:root[data-theme="dark"][data-accent="phoenix"] {
  --purple: #e0531f;
  --purple-light: #ff8a5c;
  --purple-mid: #ffa273;
  --accent: #ff6a3d;
  --accent-strong: var(--accent);
  --accent-contrast: #241006;
  /* Thinned from 0.18 for WCAG AA: the ember accent cleared every flat surface
     but not its own wash over a card, which lifts the ground toward the ink. The
     hue is untouched. See issue #157. */
  --glow-purple: rgba(255, 106, 61, 0.15);
  --grad-from: #ff7a45;
  --grad-to: #ffcf6a;
}
:root[data-theme="light"][data-accent="phoenix"] {
  --purple: #c2400f;
  --purple-light: #d64a12;
  --purple-mid: #b8420f;
  /* Deepened for WCAG AA on the light ground (#fff): #d64a12 was 4.33:1 as text
     and as the ink-on-fill; #a8370c clears AA at 6.53:1. See issue #96. */
  --accent: #a8370c;
  --accent-strong: var(--accent);
  --accent-contrast: #ffffff;
  --glow-purple: rgba(214, 74, 18, 0.10);
  --grad-from: #d64a12;

/* ============================================================================
 * base — reset, document defaults, ambient glow, typography primitives
 * ========================================================================== */

*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  background: var(--bg); /* code-bg: inherit — page background inherits root overrides. */
  color: var(--text);
  font-family: var(--font-sans);
  font-weight: var(--weight-normal);
  /* rank: body */
  font-size: var(--text-base);
  line-height: var(--leading-normal);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

::selection {
  background: color-mix(in srgb, var(--accent) 30%, transparent); /* code-bg: inherit — selection paint is not a focus container. */
  color: var(--strong);
}

a {
  color: var(--accent);
  text-decoration: none;
}

/* A link that reads as the text around it, for a name in a list that links to its
   detail page: body ink at rest, underlined only under the pointer.
   why: docs/foundations.md#text-ink */
.ui-link--quiet { color: inherit; }
.ui-link--quiet:hover { text-decoration: underline; }

/* -- The two typeface roles -----------------------------------------------
 * A heading is the display face, running text is the text face, and the
 * ELEMENT decides which — never the size. A size threshold would change a
 * heading's typeface halfway through a resize, which is the one thing a
 * reader notices. A component that wants a heading tag set in the text face
 * says so on its own rule, which outranks this one at (0,1,0); .ui-card__title,
 * .ui-drawer__title and .ui-confirm__title are the three that do.
 * why: docs/foundations.md#typefaces */
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-display);
}

/* The browser default for b/strong is 700, and at the 13px the kit's tables and
 * chat feeds run at, 700 stops reading as emphasis and starts reading as a
 * filled-in shape. The semibold step is the emphasis; the bold step stays
 * available to anything that asks for it by name.
 * why: docs/foundations.md#typefaces */
b,
strong {
  font-weight: var(--weight-semibold);
}

/* Ambient blurred glow — the deck's signature background depth.
   Place <span class="ui-glow ui-glow--purple"> absolutely inside a positioned
   parent. Two colour variants ship; scale/position with inline styles. */
.ui-glow {
  position: absolute;
  border-radius: 50%;
  filter: blur(100px);
  opacity: 0.5;
  pointer-events: none;
  z-index: 0;
  width: 420px;
  height: 420px;
}
.ui-glow--purple { background: radial-gradient(circle, var(--purple-light), transparent 70%); }
.ui-glow--green  { background: radial-gradient(circle, var(--green), transparent 70%); opacity: 0.28; }
.ui-glow--cyan   { background: radial-gradient(circle, var(--cyan), transparent 70%); opacity: 0.3; }

/* ----------------------------------------------------------------------------
 * Background treatments — drop-in page/section backdrops. Each is a ::before
 * layer, so add the class to a positioned wrapper and give the real content a
 * higher stacking context (position:relative;z-index:1). All read the accent /
 * glow tokens, so they re-theme with the sub-theme and work in dark + light.
 * -------------------------------------------------------------------------- */
[class*="ui-bg-"] { position: relative; }
[class*="ui-bg-"] > * { position: relative; z-index: 1; }
[class*="ui-bg-"]::before { content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none; }

/* Spotlight — a soft radial from the top-centre (auth cards, focused heroes). */
.ui-bg-spotlight::before {
  background: radial-gradient(620px 340px at 50% -12%, var(--glow-purple), transparent 70%); /* code-bg: inherit — a wash paints over a ground and behind a chip, so the opaque ground below it is the step. */
}
/* Grid — a faint token-coloured grid, masked to fade at the edges. */
.ui-bg-grid::before {
  background-image:
    linear-gradient(to right, var(--border) 1px, transparent 1px),
    linear-gradient(to bottom, var(--border) 1px, transparent 1px);
  background-size: 34px 34px;
  -webkit-mask-image: radial-gradient(circle at 50% 35%, #000, transparent 78%);
  mask-image: radial-gradient(circle at 50% 35%, #000, transparent 78%);
}
/* Dots — a subtle dot field for dashboards / technical surfaces. */
.ui-bg-dots::before {
  background-image: radial-gradient(var(--border) 1.4px, transparent 1.4px);
  background-size: 22px 22px;
  -webkit-mask-image: radial-gradient(circle at 50% 35%, #000, transparent 80%);
  mask-image: radial-gradient(circle at 50% 35%, #000, transparent 80%);
}
/* Accent wash — a gentle top-down tint in the current accent. */
.ui-bg-wash::before {
  background: linear-gradient(180deg, var(--glow-purple), transparent 45%); /* code-bg: inherit — a wash paints over a ground and behind a chip, so the opaque ground below it is the step. */
}

/* Layout helpers used by the example apps */
.ui-container { width: 100%; max-width: var(--container); margin: 0 auto; padding: 0 clamp(14px, 2.4vw, 26px); }
.ui-stack > * + * { margin-top: var(--space-4); }

/* Eyebrow — the label above a title or a figure, in sentence case like every
   label in the kit. why: docs/foundations.md#labels-and-titles */
.ui-eyebrow {
  /* rank: label */
  font-size: var(--text-sm);
  font-weight: var(--weight-medium);
  color: var(--text);
}

/* Sensible default size for inline icons that a parent rule doesn't size.
   A floor, not a ceiling: :where() holds the whole filter at zero specificity,
   so this weighs (0,0,1) and any component rule that sizes an icon outranks it.
   The count of those rules is deliberately not written here — it moved once
   already, and two gates hold it over the ground each actually sweeps.
   */
svg:where(:not([width]):not([height])) {
  width: 1.1em;
  height: 1.1em;
  flex: none;
  vertical-align: -0.15em;
}

/* Focus-visible ring, shared by all interactive controls */
/* `.toggle` is the theme switch — a real button that wears neither .ui-btn nor
   .ui-focusable, in the vanilla topbar, React ThemeToggle and the React shell's bar
   alike, so keyboard focus on it fell back to the browser's own outline in all three.
   It has no class of its own to opt in with; it joins the list instead. Found on #385. */
/* `a` is here as an ELEMENT, not a class, because a link in running text is the one
   control a consumer writes with no class on it at all — so it took the browser's
   outline, which #457 refused. The net is over every anchor; a component that rings
   its own anchor outranks this at two classes and keeps the shape it chose. The band
   sits at whatever corner the link carries, which is the rule .ui-table's links
   already take. Found on #586, decided on #587. */
a:focus-visible,
.ui-focusable:focus-visible,
.ui-snippet :focus-visible,
.ui-btn:focus-visible,
.ui-input:focus-visible,
.ui-seg button:focus-visible,
.toggle:focus-visible,
.ui-switch:focus-visible {
  outline: var(--ring);
  outline-offset: var(--ring-offset);
}
/* A text link has no box, so the ring sat on the glyphs with square corners. It takes a corner
   and room at each side. The margin gives the room back, so no word moves. #814 (rev_136bd26bc559/d22) */
a:not([class]):focus-visible {
  border-radius: var(--radius-xs);
  padding-inline: var(--space-1);
  margin-inline: calc(-1 * var(--space-1));
}

/* Source: src/styles/button.css */
/* ============================================================================
 * Button — .ui-btn  (variants: primary / secondary / ghost / danger / link)
 *                   (sizes: xs / sm / md / lg, [icon], [disabled], [aria-busy])
 * ========================================================================== */

:root {
  /* The md padding and edge. The button and --btn-height-md both read them. */
  --btn-pad-y-md: 9px;
  --btn-edge-width: 1px;
  /* The outer height of an md button: one line of --text-sm, the md padding and
     the edge on each side. A part that takes a button's place uses it, so the
     row keeps its height. */
  --btn-height-md: calc(var(--text-sm) * var(--leading-tight) + 2 * var(--btn-pad-y-md) + 2 * var(--btn-edge-width));
  /* The outer height of an sm button, with or without a glyph. It stands level with a
     pill dropdown trigger. #814 */
  --btn-height-sm: var(--space-8);
}

.ui-btn {
  --btn-pad-y: var(--btn-pad-y-md);
  --btn-pad-x: 17px;
  --btn-font: var(--text-sm);

  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-family: var(--font-sans);
  font-size: var(--btn-font);
  font-weight: var(--weight-medium);
  line-height: var(--leading-tight);
  border-radius: var(--radius-pill); /* why: docs/foundations.md#control-corners */
  padding: var(--btn-pad-y) var(--btn-pad-x);
  min-height: var(--btn-height-md);
  cursor: pointer;
  /* Light needs a stronger line here: --border on this fill measures 1.047:1.
     why: docs/foundations.md#elevation */
  border: var(--btn-edge-width) solid var(--control-edge);
  background: var(--surface); /* code-bg: inherit — control paint; the containing surface is the ground, for a chip and for a band alike. */
  color: var(--text);
  white-space: nowrap;
  transition: background var(--dur-fast) var(--ease),
    border-color var(--dur-fast) var(--ease),
    color var(--dur-fast) var(--ease),
    transform var(--dur-fast) var(--ease),
    filter var(--dur-fast) var(--ease);
}

.ui-btn:hover {
  background: color-mix(in srgb, var(--accent) 14%, var(--surface)); /* code-bg: inherit — control paint; the containing surface is the ground, for a chip and for a band alike. */
  color: var(--strong);
}
/* The hover edge steps aside under the band: an accent edge one pixel inside an
   accent band is the second band #578 round r34 took off the focus rules, and a
   pointer resting on a focused button would put it back. The fill above is not an
   edge and stays. why: docs/foundations.md#the-focus-ring */
.ui-btn:hover:not(:focus-visible) { border-color: var(--accent); }
.ui-btn:active { transform: translateY(1px); }

.ui-btn svg { width: 16px; height: 16px; flex: none; stroke-width: 2.4; }

/* -- Variants ----------------------------------------------------------- */
.ui-btn--primary {
  background: var(--accent-strong);
  color: var(--accent-contrast);
  border-color: var(--accent-strong);
  font-weight: var(--weight-semibold);
}
.ui-btn--primary:hover {
  filter: brightness(1.1);
  color: var(--accent-contrast);
  background: var(--accent-strong);
  border-color: var(--accent-strong);
}

.ui-btn--ghost {
  background: transparent;
  border-color: transparent;
  color: var(--text);
}
.ui-btn--ghost:hover {
  background: var(--surface); /* code-bg: inherit — control paint; the containing surface is the ground, for a chip and for a band alike. */
  border-color: transparent;
  color: var(--strong);
}

/* An outline button draws its edge and no fill, so an icon-only control keeps a
   visible boundary on a ground that is now one flat surface (#850). The hover
   takes the same accent edge as a plain button. */
.ui-btn--outline {
  background: transparent;
  border-color: var(--control-edge);
  color: var(--text);
}
.ui-btn--outline:hover {
  background: var(--surface); /* code-bg: inherit — control paint; the containing surface is the ground, for a chip and for a band alike. */
  color: var(--strong);
}

.ui-btn--link {
  background: transparent;
  border-color: transparent;
  color: var(--accent);
  padding-inline: 0;
}
.ui-btn--link .ui-btn__label-slot { overflow: visible; }
.ui-btn--link[aria-busy="true"] .ui-btn__label-slot { overflow: hidden; }
.ui-btn--link .ui-btn__label { text-decoration: underline; text-underline-offset: 0.2em; }
.ui-btn.ui-btn--link:hover {
  background: transparent;
  border-color: transparent;
  color: var(--strong);
}

.ui-btn--danger { color: var(--text); }
.ui-btn--danger:hover, .ui-btn--danger:focus-visible, .ui-btn--danger[data-holding] {
  color: var(--pink);
  border-color: var(--pink);
  background: color-mix(in srgb, var(--pink) 10%, transparent); /* code-bg: inherit — control paint; the containing surface is the ground, for a chip and for a band alike. */
}
/* A pointer hold is also a hover, so the held edge outranks the accent hover edge. */
.ui-btn.ui-btn--danger[data-holding]:hover { border-color: var(--pink); }

/* -- Sizes -------------------------------------------------------------- */
/* why: docs/components.md#button */
.ui-btn--xs { --btn-pad-y: 4.5px; --btn-pad-x: 8px; --btn-font: var(--text-xs); min-width: 24px; min-height: 24px; }
.ui-btn--xs svg { width: 13px; height: 13px; stroke-width: 2.8; }
.ui-btn--sm { --btn-pad-y: 6px; --btn-pad-x: 12px; --btn-font: var(--text-sm); min-height: var(--btn-height-sm); }
.ui-btn--lg { --btn-pad-y: 13px; --btn-pad-x: 24px; --btn-font: var(--text-md); }

/* Icon-only */
.ui-btn--icon { --btn-pad-y: var(--btn-pad-y-md); padding: var(--btn-pad-y-md); }
.ui-btn--icon.ui-btn--xs { --btn-pad-y: 4.5px; padding: 4.5px; }
.ui-btn--icon.ui-btn--sm { --btn-pad-y: 7px; padding: 7px; }

.ui-btn--block { width: 100%; }

/* -- States ------------------------------------------------------------- */
/* Off, in every variant. A disabled button has no variant identity — primary,
   secondary and danger all take the same flat pair, because the accent IS the
   "press me" and keeping a faded version of it was what put a disabled primary
   at 1.48:1 (white on a washed-out purple). Dropping the accent is most of what
   makes this read as inert; the quiet ink is the rest. #220 */
.ui-btn:disabled,
.ui-btn[aria-disabled="true"] {
  background: var(--disabled-surface); /* code-bg: inherit — control paint; the containing surface is the ground, for a chip and for a band alike. */
  border-color: var(--disabled-border);
  /* muted-ink: state — unavailable control */ color: var(--disabled-ink);
  cursor: not-allowed;
  pointer-events: none;
}
/* A ghost button draws no box when it is on, so it draws none when it is off. */
.ui-btn--ghost:disabled,
.ui-btn--ghost[aria-disabled="true"] {
  background: transparent;
  border-color: transparent;
  /* muted-ink: state — unavailable control */ color: var(--disabled-ink-bare);
}
.ui-btn--link:disabled,
.ui-btn--link[aria-disabled="true"] {
  background: transparent;
  border-color: transparent;
  /* muted-ink: state — unavailable link action */ color: var(--disabled-ink-bare);
}
/* With no box, the ink is read on whatever is behind it, so the ghost takes an ink
   set for the dullest ground: in dark 7.49 / 6.31 / 7.00 / 5.44 on --bg / --surface /
   --surface-2 / --surface-3, in light 5.85 / 6.50 / 5.49 / 5.70. The enabled ghost now uses body
   ink, keeping its words readable without changing the disabled pair. #273 cut this ink to rescue two
   dark pairs from under #220's floor; #295 re-picked --muted against the elevation
   ladder and lifted both clear, so it is the margin now rather than the rescue.

   #273 got here the long way. It first gave the ghost the flat disabled box
   instead, on the claim that nothing would get less readable. That was false:
   --bg and --surface lost up to 0.46. Then the box was rendered in a pager at
   page 1, and the boxed First and Prev read heavier than the boxless Next and
   Last beside them: the controls that were off looked like the live ones. No
   contrast table shows that. The box was reverted and this ink shipped.
   Held by src/styles/button-disabled.test.js. */

/* why: docs/components.md#button */
.ui-btn { position: relative; }
.ui-btn[aria-busy="true"] { pointer-events: none; }
.ui-btn[aria-busy="true"][data-btn-wired] {
  pointer-events: auto;
  filter: none;
  transform: none;
}
/* Busy keeps the resting variant paint. The disabled selector above owns the
   ordinary unavailable state; a wired busy control remains focused and must
   not flatten its action identity while work is in flight. */
.ui-btn[aria-busy="true"],
.ui-btn[aria-busy="true"]:hover,
.ui-btn[aria-busy="true"]:active {
  background: var(--surface); /* code-bg: inherit — busy paint retains the button's containing gap. */
  border-color: var(--border);
  color: var(--text);
  filter: none;
  transform: none;
}
.ui-btn[aria-busy="true"].ui-btn--primary,
.ui-btn[aria-busy="true"].ui-btn--primary:hover,
.ui-btn[aria-busy="true"].ui-btn--primary:active {
  background: var(--accent-strong); /* code-bg: inherit — busy paint retains the button's containing gap. */
  border-color: var(--accent-strong);
  color: var(--accent-contrast);
}
.ui-btn[aria-busy="true"].ui-btn--ghost,
.ui-btn[aria-busy="true"].ui-btn--ghost:hover,
.ui-btn[aria-busy="true"].ui-btn--ghost:active {
  background: transparent; /* code-bg: inherit — busy paint retains the button's containing gap. */
  border-color: transparent;
  color: var(--text);
}
.ui-btn[aria-busy="true"].ui-btn--link,
.ui-btn[aria-busy="true"].ui-btn--link:hover,
.ui-btn[aria-busy="true"].ui-btn--link:active {
  background: transparent; /* code-bg: inherit — busy paint retains the button's containing gap. */
  border-color: transparent;
  color: var(--accent);
}
.ui-btn[aria-busy="true"].ui-btn--danger,
.ui-btn[aria-busy="true"].ui-btn--danger:hover,
.ui-btn[aria-busy="true"].ui-btn--danger:active {
  background: var(--surface); /* code-bg: inherit — busy paint retains the button's containing gap. */
  border-color: var(--border);
  color: var(--text);
}
/* A caller can mark a control both busy and unavailable. The explicit marker
   keeps that ordinary disabled state from inheriting the busy variant paint. */
.ui-btn[aria-busy="true"][data-btn-disabled] {
  background: var(--disabled-surface); /* code-bg: inherit — busy+disabled keeps its containing gap. */
  border-color: var(--disabled-border);
  /* muted-ink: state — busy+disabled control */ color: var(--disabled-ink);
  cursor: not-allowed;
  pointer-events: none;
}
.ui-btn--ghost[aria-busy="true"][data-btn-disabled] {
  background: transparent; /* code-bg: inherit — busy+disabled keeps its containing gap. */
  border-color: transparent;
  /* muted-ink: state — busy+disabled ghost */ color: var(--disabled-ink-bare);
}
.ui-btn__label-slot { display: inline-grid; overflow: hidden; }
.ui-btn__label {
  grid-area: 1 / 1;
  transform: translateY(0);
}
.ui-btn[data-btn-ready] .ui-btn__label { animation: ui-btn-label-in var(--dur-med) var(--ease-out) both; }
.ui-btn[aria-busy="true"] .ui-btn__label {

  justify-content: center;

  height: 5px;

.ui-btn--xs .ui-btn__dots i { width: 3px; height: 3px; }
.ui-btn--sm .ui-btn__dots { gap: 3px; }
.ui-btn--sm .ui-btn__dots i { width: 4px; height: 4px; }
.ui-btn--lg .ui-btn__dots { gap: 5px; }
.ui-btn--lg .ui-btn__dots i { width: 6px; height: 6px; }

.ui-btn__dots i:nth-child(3) { animation-delay: 0s, 0.4s; } /* motion: ambient — stagger the third pulse */

@keyframes ui-btn-label-out { from { transform: translateY(0); } 45%, to { transform: translateY(100%); } }
@keyframes ui-btn-dot-in { from, 45% { translate: 0 24px; } to { translate: 0 0; } }

  .ui-btn[aria-busy="true"] .ui-btn__label { animation: none; }
  .ui-btn__dots i { animation: none; }

/* -- Hold to confirm ---------------------------------------------------- */

.ui-btn[data-hold] {
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;

/* ============================================================================
 * Card — .ui-card  (a grouping of space, not a box: no fill, edge or shadow on the page)
 * Rows: .ui-card__row  /  headers: .ui-card__title / .ui-card__sub
 * Title row: .ui-card__head holds the title and .ui-card__tools at its end
 * ========================================================================== */

/* The surface is the step; the line makes it legible. Both themes edge the card with
   --card-edge: the hairline in dark, --level-line in light. Light also casts --elev-rest,
   a faint short shadow. Dark casts nothing. Decided on #730.
   why: docs/foundations.md#elevation */
.ui-card {
  --ui-card-ground: var(--surface); /* the ground a scrolling row inside covers its edge with; a tint repeats it below */
  --ui-card-inset: var(--space-6); /* the side inset, which a table or a viewer in the card bleeds through */
  background: var(--surface);
  border: 1px solid var(--card-edge);
  box-shadow: var(--elev-rest);
  border-radius: var(--radius-md);
  padding: var(--space-6);
  position: relative;
}
/* #850: the light page takes the card's white, so a light card on the page is a grouping
   of space, not a box. It draws no fill, edge or shadow, and it hangs its side inset
   outside the column so its text starts on the page title's edge. Dark keeps its card.
   Floating panels keep their box; the card does not float, it is the page.
   why: docs/foundations.md#elevation */
:root[data-theme="light"] .ui-card {
  --ui-card-ground: var(--bg);
  background: transparent;
  border: 1px solid transparent;
  box-shadow: none;
}
/* The light card's top and bottom inset is gone, so content starts after its title and
   the section gap, not a box edge, separates one card from the next. The side inset stays
   and hangs outside the column, so its text lines up with the page title. --pad-lg is the
   centred landing card, which keeps its own inset and never hangs out. #850 */
:root[data-theme="light"] .ui-card:not(.ui-card--pad-lg):not(.ui-card--accent):not(.ui-card--live) {
  padding-block: 0;
  margin-inline: calc(-1 * var(--ui-card-inset));
}
/* The folded shell pads the page by --space-4, so the hang shrinks to it. A hang of 24px
   put the card and its table 8px past the page from 561 to 720px. #875 */
@media (max-width: 720px) {
  :root[data-theme="light"] .ui-card:not(.ui-card--pad-lg):not(.ui-card--accent):not(.ui-card--live) {
    --ui-card-inset: var(--space-4);
    padding-inline: var(--ui-card-inset);
  }
}
/* A light stat tile keeps its box and its 24px inset from 561 to 720px. On a phone it pads
   16px, as it did before #875. */
@media (max-width: 560px) {
  :root[data-theme="light"] .ui-stats--tiles { --ui-tile-inset: var(--space-4); }
}

/* A table wider than its card scrolls INSIDE the card instead of bleeding past
   the rounded corners / clipping its last column. Clipping to the card's
   border-box also keeps zebra stripes from escaping the radius. */
.ui-card:has(> .ui-table) { overflow-x: auto; }
/* A card that frames a table directly is the table's frame, so its top edge is
   square: the data grid reads as a straight edge at both ends, not a rounded
   card. The bottom corners keep the card's own radius. #850 */
.ui-card:has(> .ui-table) { border-top-left-radius: 0; border-top-right-radius: 0; }
/* Which makes the card a keyboard stop whenever no cell holds a control, so it
   answered with the native outline. It is a scroll region, so it takes --ring-scroll:
   the band drawn inward, inside the card's 24px padding and clear of the table.
   --elev-rest is left alone: the band is an outline, not a layer of the shadow list.
   why: docs/foundations.md#the-focus-ring */
.ui-card:has(> .ui-table):focus-visible { outline: var(--ring-scroll); outline-offset: var(--ring-scroll-offset); }

/* Vertical stacks space cards with the container's gap — see .ui-card-stack.
   (No `.ui-card + .ui-card` margin: it leaks into grid/flex rows and misaligns.) */
.ui-card-stack { --ui-block-gap: var(--space-5); display: flex; flex-direction: column; gap: var(--ui-block-gap); }
/* #850: on the light page a card draws no box, so the stack opens to the page's group gap.
   why: docs/foundations.md#spacing-and-rhythm */
:root[data-theme="light"] .ui-card-stack { --ui-block-gap: var(--space-10); gap: var(--ui-block-gap); }

/* A padding modifier moves the vertical rhythm and keeps the text edge, so cards of
   different padding line up in one column. --pad-lg is the centred landing card, never
   stacked with plain ones, and keeps its own inset.
   why: docs/foundations.md#spacing-and-rhythm */
.ui-card--pad-sm { padding: var(--space-5) var(--space-6); }
.ui-card--pad-lg { padding: var(--space-8) var(--space-10); }

/* A card framing one content-width block ends where the block ends — a 359px table sat in
   a 1232px card (#504) — and is capped, so a wider block still fills the room and scrolls.
   why: docs/foundations.md#spacing-and-rhythm */
.ui-card--fit { width: fit-content; max-width: 100%; }

/* An accent-tinted card, e.g. a highlighted plan / success surface. It draws no accent
   ring: the tint carries the signal and the edge is the plain card edge. #295
   The strength is --card-tint, per theme: light mixes down from white, so a tint that
   works in dark sinks a light card below the page. The accent card keeps the plain
   edge. why: docs/foundations.md#elevation */
.ui-card--accent {
  --ui-card-ground: color-mix(in srgb, var(--accent) var(--card-tint), var(--surface));
  background: color-mix(in srgb, var(--accent) var(--card-tint), var(--surface));
}
.ui-card--live {
  --ui-card-ground: color-mix(in srgb, var(--green) var(--card-tint), var(--surface));
  background: color-mix(in srgb, var(--green) var(--card-tint), var(--surface));
  border-color: color-mix(in srgb, var(--green) 22%, transparent);
}
/* #850: the light page takes a plain card's white, but a tinted card keeps its tint,
   so the accent or live signal stays above the page. Dark keeps its own tint. */
:root[data-theme="light"] .ui-card--accent {
  --ui-card-ground: color-mix(in srgb, var(--accent) var(--card-tint), var(--surface));
  background: color-mix(in srgb, var(--accent) var(--card-tint), var(--surface));
}
:root[data-theme="light"] .ui-card--live {
  --ui-card-ground: color-mix(in srgb, var(--green) var(--card-tint), var(--surface));
  background: color-mix(in srgb, var(--green) var(--card-tint), var(--surface));
}

/* A viewer: a document shown inside a card, set apart from the controls that act on it.
   The card's .ui-toolbar becomes a slim row between two hairlines, and its scroll box
   becomes a recessed stage that runs to the card's sides and bottom. The document
   itself is a .ui-card__page on that stage: a sheet one level up, so it reads as the
   object and the row above it as the tools. Decided on #736.
   why: docs/foundations.md#elevation */
.ui-card__viewer {
  margin: var(--space-4) calc(-1 * var(--ui-card-inset)) 0;
  border-top: 1px solid var(--card-edge);
}
.ui-card__viewer > .ui-toolbar {
  /* One row on a phone too: the page steps hold the start and the zoom the end. */
  flex-wrap: nowrap;
  align-items: center;
  padding: var(--space-2) var(--space-4);
  border-bottom: 1px solid var(--card-edge);
}
.ui-card__viewer > .ui-table-scroll {
  /* The stage is the lowest rung, so an inline code chip on it takes the card. */
  --table-bg: var(--surface-2);
  --table-code-bg: var(--surface);
  max-height: none;
  /* With the scroll box's own 4px band at the sides and bottom, an even 24px inset. */
  padding: var(--space-6) var(--space-5) var(--space-5);
  border-radius: 0 0 calc(var(--radius-md) - 1px) calc(var(--radius-md) - 1px);
}
/* A4 at the least, so a short document still reads as a page and not as a panel.
   The page carries the light palette in both themes (src/tokens/tokens.css), so its
   own ink is set here: the inherited colour is the theme's. */
.ui-card__page {
  box-sizing: border-box;
  aspect-ratio: 210 / 297;
  padding: var(--space-6) var(--space-5);
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--card-edge);
  box-shadow: var(--elev-rest);
  border-radius: var(--radius-xs);
  /* A table on the page takes the page's ground, not the stage's, and hands a chip a
     surface that steps off the white sheet in both themes. */
  --table-bg: var(--surface);
  --table-code-bg: var(--code-chip-surface);
}

@supports (corner-shape: squircle) {
  .ui-card, .ui-card__viewer > .ui-table-scroll { corner-shape: squircle; }
}

/* Interactive card (link / button semantics) */
.ui-card--interactive {
  cursor: pointer;
  /* Written as a <button>, the card would take the browser's frame, centred text and
     `font: 400 13.3333px Arial` — a shorthand, so `font: inherit` and not the family
     longhand. .ui-card states the background, the border and its rung, so a
     `border: 0` here would only delete the edge dark draws. #251 */
  text-align: left;
  font: inherit;
  transition: transform var(--dur-fast) var(--ease);
}
/* The lift alone: the card's own rung is what says it is raised, and hover is not a
   change of level. why: docs/foundations.md#elevation */
.ui-card--interactive:hover { transform: translateY(-2px); }
.ui-card--interactive:focus-visible { outline: var(--ring); outline-offset: var(--ring-offset); }
.ui-card--interactive .ui-card__sub:last-child { margin-bottom: 0; }

/* card() emits the title as an h2, so the text face is named here rather than
   left to the element. why: docs/foundations.md#labels-and-titles */
.ui-card__title {
  color: var(--strong);
  font-family: var(--font-sans);
  /* rank: card-title */
  font-size: var(--text-lg);
  font-weight: var(--weight-semibold);
  line-height: var(--leading-snug);
  display: flex;
  align-items: center;
  gap: 10px;
  /* Title to description: the step, not the 5px it was. why: docs/foundations.md#spacing-and-rhythm */
  margin: 0 0 var(--space-2);
}
/* The title row: the title, then the card's tools centred on its line, in the
   title's step. why: docs/components.md#choose-a-component */
.ui-card__head {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin: 0 0 var(--space-2);
}
.ui-card__head > .ui-card__title { flex: 1 1 auto; min-width: 0; margin: 0; }
.ui-card__tools { display: flex; flex: none; align-items: center; gap: var(--space-1); margin-inline-start: auto; }
.ui-card__tools:empty { display: none; }
/* The title of a card that supports its neighbour, such as a document beside the
   data read from it. The size, weight and rank stay the card title's.
   why: docs/foundations.md#text-ink */
.ui-card__title--muted { /* muted-ink: chrome — a supporting card ranks below its neighbour; the title is also the card's accessible name */ color: var(--muted); }
.ui-card__sub {
  color: var(--text);
  font-size: var(--text-base);
  line-height: var(--leading-snug);
  margin-bottom: var(--space-5);
}
/* Setting rows: label + control, divided by a hairline */
.ui-card__row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-5);
  padding: var(--space-4) 2px;
}
/* A choice that does not fit beside its label drops under it whole, never into a column. */
.ui-card__row:has(> .ui-seg) { flex-wrap: wrap; }
.ui-card__row:has(> .ui-seg) > :first-child { flex: 1 1 10rem; min-width: 0; }
.ui-card__row > .ui-seg { flex: none; flex-wrap: nowrap; }
.ui-card__row > .ui-seg button { white-space: nowrap; }
@media (max-width: 560px) {
  .ui-card__row { flex-direction: column; align-items: flex-start; }
  .ui-card__row > :first-child { width: 100%; }
  .ui-card__row:has(> .ui-seg) > :first-child { flex: none; }

/* The Theme choice needs 195px and the narrowest settings row gives it 160. Its pills

@media (max-width: 560px) {
  .ui-card__row--tight-choice > .ui-seg:not(.ui-seg--sm):not(.ui-seg--underline) {
    --ui-row-choice-pad: clamp(var(--space-1), calc(var(--space-3) - (360px - 100vw) * 0.3), var(--space-3));
  }
  .ui-card__row--tight-choice > .ui-seg:not(.ui-seg--sm):not(.ui-seg--underline) button {
    padding-inline: var(--ui-row-choice-pad);

     row's text edge: the track's padding plus the first pill's. The pill hangs into the
     card's padding. why: guidelines/spacing.md#put-text-on-the-column-edge */
  .ui-card__row > .ui-seg:not(.ui-seg--underline) {
    margin-inline-start: calc(-1 * (var(--space-1) + var(--ui-row-choice-pad, var(--space-3))));

}
.ui-card__row + .ui-card__row { border-top: 1px solid var(--border); }
/* #850: on the light page no hairline between rows of one list; the rows separate by
   their padding. */

/* A role badge or a row-end glyph follows the content it marks at --space-4, on the
   same line, instead of standing at the far end of the row.
   why: docs/foundations.md#spacing-and-rhythm */
.ui-card__row:has(> .ui-badge:last-child),
.ui-card__row:has(> .ui-card__glyph:last-child) { justify-content: flex-start; gap: var(--space-4); }

@media (max-width: 560px) {

    flex-direction: row;
    align-items: center;
    justify-content: space-between;
  }
  .ui-card__row:has(> .ui-card__glyph:last-child) > :first-child {

    min-width: 0;
  }
}
.ui-card__row .lab { color: var(--strong); font-size: var(--text-md); font-weight: var(--weight-medium); }
.ui-card__row .hint { color: var(--text); font-size: var(--text-sm); margin-top: 3px; }

/* Icon chip that leads a card header */
.ui-card__icon {
  width: 38px;
  height: 38px;
  border-radius: var(--radius-md);
  display: grid;
  place-items: center;
  background: var(--glow-purple); /* code-bg: inherit — a wash paints over a ground and behind a chip, so the opaque ground below it is the step. */
  color: var(--accent);
  flex: none;
}

   check is the kit's SuccessCheck (circled), not this glyph.
   why: docs/foundations.md#icons-and-glyphs */

  display: inline-flex;
  align-items: center;
  flex: none;
  /* muted-ink: glyph — a row glyph is a mark beside words */
  color: var(--muted);
}
.ui-card__glyph svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

/* A soft line between blocks: a straight hairline across the column width on the
   block's top edge, with one inner gap of air under it. A light card hangs its side inset
   outside the column, but its own padding keeps the line on the column's width, and
   the ::before draws straight where a border would follow the rounded corner. Dark
   cards are boxed and already separate, so only the light rule draws.
   why: docs/components.md#card, guidelines/dashboards-and-reports.md */
