  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 18px;
  --radius-2xl: 24px;
  --radius-pill: 999px;

  /* -- Spacing scale (4px base) ------------------------------------------- */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  /* -- Measure ------------------------------------------------------------
   * --container is the page, gutter to gutter; --measure is the reading column
   * INSIDE a track, beside a sidebar. Different axes, never interchangeable.
   * why: docs/foundations.md#widths */
  --container: 1120px;
  --measure: 860px;

  /* -- Typography ---------------------------------------------------------
   * Two roles, not one family. --font-display is the brand voice — headings,
   * brand lockups, large readouts — and --font-sans is what an application is
   * actually made of: tables, fields, paragraphs, chat. Poppins is a geometric
   * display grotesque and holds its character at heading sizes; at 13-14px it
   * smears, worst of all in Cyrillic, which is where the kit spends most of its
   * pixels. IBM Plex Sans is humanist and narrower, and its Cyrillic was drawn
   * by the same team as its Latin.
   * why: docs/foundations.md#typefaces */
  --font-display: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;

  --text-xs:   12px;
  --text-sm:   13px;
  --text-base: 14.5px;
  --text-md:   15.5px;
  --text-lg:   18px;
  --text-xl:   22px;
  --text-2xl:  30px;
  --text-3xl:  40px;
  --text-4xl:  56px;

  --weight-light: 300;
  --weight-normal: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;

  --leading-tight: 1.2;
  --leading-snug: 1.4;
  --leading-normal: 1.62;

  --tracking-tight: -0.01em;
  --tracking-normal: 0;
  --tracking-wide: 0.04em;
  --tracking-caps: 0.14em; /* nothing in the kit reads it since #268; consumer rules still may */

  /* -- Motion -------------------------------------------------------------
   * The kit's legacy --dur-* and --ease names alias onto the brand's
   * --duration-* and --easing-* primitives, so every component consumes one
   * vocabulary; the fallbacks keep tokens.css self-sufficient when imported
   * without brand.generated.css. Delays are the kit's own, and the reusable
   * effect layer lives in styles/motion.css.
   * Change generated brand tokens upstream in apliteni/design-system. */
  --ease: var(--easing-ease-in-out, cubic-bezier(0.4, 0, 0.2, 1));
  --ease-out: var(--easing-ease-out, cubic-bezier(0, 0, 0.2, 1));
  --ease-in: var(--easing-ease-in, cubic-bezier(0.4, 0, 1, 1));
  --ease-sharp: var(--easing-sharp, cubic-bezier(0.4, 0, 0.6, 1));
  --ease-spring: var(--easing-spring, cubic-bezier(0.34, 1.56, 0.64, 1));

  --dur-instant: var(--duration-instant, 0.08s); /* 80ms — press, tick */
  --dur-fast: var(--duration-fast, 0.15s);   /* 150ms — hover, press */
  --dur-med: var(--duration-normal, 0.25s);  /* 250ms — panels, dropdowns */
  --dur-slow: var(--duration-slow, 0.4s);    /* 400ms — enters, reveals */

  --delay-1: 60ms;
  --delay-2: 120ms;
  --delay-3: 180ms;
  --delay-4: 240ms;
  --delay-5: 300ms;

  /* -- Elevation (z) ------------------------------------------------------ */
  --z-base: 1;
  --z-sticky: 10;
  --z-dropdown: 30;
  --z-overlay: 100;
  --z-toast: 200;
}

/* ============================================================================
 * DARK THEME (default) — deck palette from viz/index.html
 * ========================================================================== */
/* A ThemeChoice scene draws this theme inside a page of either theme. */
:root,
.ui-theme-choice__scene--dark,
:root[data-theme="dark"] {
  color-scheme: dark;

  --purple: #6a2dcc;
  /* The ramp moves up one step so --accent is --purple-light again, the shape light
     Nebula and light Ocean already ship; left alone the two tokens would resolve to
     one colour. #bd8cff becomes the ramp's top step instead. See issue #157. */
  --purple-light: #b479ff;
  --purple-mid: #bd8cff;
  --cyan: #20dcf5;
  --green: #98ff8f;
  /* Lighter than it looks like it should be: --pink is read mostly ON its own 16%
     glow, and that wash lifts the ground faster than the hue lifts the ink, so danger
     moved AWAY from the canvas. Light moves the opposite way. See issue #131. */
  --pink: #e97ca5;
  --amber: #ffcf6a;

  /* The elevation ladder, bottom to top. A surface says how high it is with its step
     and, IN DARK, with the hairline around it; --muted caps how far the ladder can go.
     Nothing casts in dark below the floating step, and the floating step adds
     --elev-drop under its inner line. why: docs/foundations.md#elevation */
  --bg: #0e0d14;
  --table-bg: var(--bg);
  /* A dark table is flush with the page, so the reading surface an inline code chip has
     left inside one is the card. Light's table is white, so there it is the page. */
  --table-code-bg: var(--surface);
  /* A translucent wash paints BEHIND a chip, so it moves the ground and not the chip: the
     pair has to be read against the wash composited over whatever opaque surface is under
     it. Dark's washes lift a near-black ground away from the page, so the page is what the
     chip has left; light's darken white toward the page, so the card is. Both directions
     hold over EVERY opaque ground, which is why this is a token and not a context rule.
     Measured in stories/code-chip.test.js. */
  --wash-code-bg: var(--bg);
  --code-chip-page: var(--surface);  /* a chip on the page takes the card */
  --code-chip-surface: var(--bg);    /* a chip in a painted container takes the page */
  /* The auth page's branded ground, brand C: a 135-degree gradient a product may override. */
  --ui-auth-ground: linear-gradient(135deg, color-mix(in srgb, var(--color-apliteni-violet-1) 32%, var(--bg)), color-mix(in srgb, var(--color-apliteni-blue-1) 24%, var(--bg)));
  /* The document page's bare backdrop, behind the A4 sheet: the same sunken rung a
     table takes inside a viewer, named once so a page reads it as its own ground. */
  --ui-document-ground: var(--surface-2);
  --surface-2: #161520;     /* non-text sunken marks and tracks */
  --surface: #211e2d;       /* the card */
  --bg-elevated: #2a2639;   /* FLOATING — menus, panels, drawer, modal, toasts */
  --surface-3: #2d293c;     /* non-text quiet fills */
  --seg-active-bg: #383350; /* raised pill — clearly above the inset track in dark */
  --nav-active-fill: var(--surface); /* one rung off the page the open rail stands on */
  /* The raised handle on a control track (switch knob). White in both themes and under
     every accent: it reads on the plain track AND on the accent fill of an on control. */
  --control-knob: #ffffff;
  --border: #332f45;
  --border-strong: #453f5c;

  /* WHICH EDGE EACH LEVEL DRAWS. One name per level, so a sheet never has to ask
     which theme it is in. Dark answers all four with the hairline, because a drop
     on a near-black page reaches 1.20 at its core and has nowhere else to go.
     Light draws one line and adds a faint short drop. why: docs/foundations.md#elevation */
  --card-edge: var(--border);          /* a card */
  --rail-edge: var(--border);          /* the shell's rail */
  --float-edge: var(--border-strong);  /* a floating surface, outer line */
  --float-edge-inner: var(--border);   /* a floating surface, inner line */
  --modal-edge: transparent;           /* the modal: the deep scrim is its edge */

  /* Fields use the card surface and an edge in both themes. why: docs/foundations.md#elevation */
  --field-bg: var(--surface);
  --field-edge: var(--border);
  --field-edge-hover: var(--border-strong);
  --control-edge: var(--border);

  /* How much of its own colour a tinted card mixes in. Dark mixes upward off a mid-grey
     card, so it can afford this much. why: docs/foundations.md#elevation */
  --card-tint: 9%;
  /* A selected row takes the card's tint, and one step more under the pointer. #814 */
  --card-tint-hover: 12%;

  --text: #e9e7f0;
  --strong: #ffffff;
  --dim: #c6c2d6;
  /* Picked against the TOP of the ladder above, not against the page: #948fa8 cleared the
     two floating steps by hundredths. Same violet-grey, fourteen steps up every channel.
     why: docs/foundations.md#elevation */
  --muted: #a29db6;

  /* The paint of a control that is off. NOT an opacity: `opacity` is a group property,
     so it fades label and box toward the ground TOGETHER — a disabled primary button
     measured 1.48:1 that way. These three are aliases that composite predictably, the
     ink read on the surface beside it. Held by guidelines/accessibility-floor.test.js.
     why: docs/foundations.md#colour-and-contrast */
  --disabled-ink: var(--muted);
  --disabled-surface: var(--surface);
  /* One rung below the hairline, so an off box is not the live box with quieter words
     in it: dark answered both with --border. 1.16:1 on the card against the live
     1.27:1, and as far down as the headroom goes. #564
     why: docs/foundations.md#colour-and-contrast */
  --disabled-border: var(--surface-3);
  /* The ink of a disabled control that paints no box of its own — a ghost button. With
     no surface beside it, it is read on whatever is behind it, so it is set to clear the
     floor on the dullest ground there is (--surface-3). #273
     why: docs/foundations.md#colour-and-contrast */
  --disabled-ink-bare: #a39eb7;

  /* Lifted from #9b5dff, which cleared the flat surfaces and failed on its own wash over
     a card; the value was already in the ramp. --ring-color is var(--accent) and follows by
     reference. Held by stories/accent-contrast.test.js. #157.
     why: docs/foundations.md#colour-and-contrast */
  --accent: #b479ff;
  --accent-strong: #7c3aed; /* button bg — white text clears WCAG AA at 5.70:1 */
  --accent-contrast: #ffffff;

  /* Ink that reads on a SIGNAL colour once that colour becomes a fill — the glyph in a
     success circle, or on a toast's status circle. One near-black ink clears all five in
     dark; danger keeps its own token because LIGHT still needs one.
     why: docs/foundations.md#colour-and-contrast */
  --signal-contrast: #0c0c0c;
  --danger-contrast: var(--signal-contrast);

  --glow-green: rgba(152, 255, 143, 0.16);
  /* Dropped from 0.18: the wash, not the surface beneath it, is what put --accent under
     AA. Re-tinted from the new --accent, which signal-contrast.test.js requires. #157. */
  --glow-purple: rgba(180, 121, 255, 0.12);
  --glow-cyan: rgba(32, 220, 245, 0.14);
  --glow-pink: rgba(233, 124, 165, 0.16);

  /* Status-chip paint — the ink + fill of a badge / pill. Dark tints with the signal's
     own glow; light needs a solid, deepened pair, which is why these are a token pair. */
  --chip-success-ink: var(--green);
  --chip-success-fill: var(--glow-green);
  --chip-warn-ink: var(--amber);
  --chip-warn-fill: color-mix(in srgb, var(--amber) 15%, transparent);
  /* Not --pink: that reads 4.23:1 on this fill over a floating panel, under the 4.5:1 badge
     floor. Same hue lifted toward white — 8.64 page / 7.02 card / 6.30 panel. The signal
     and the solid-toast pair keep --pink. why: docs/foundations.md#colour-and-contrast, #453 */
  --chip-danger-ink: #f5aec6;
  --chip-danger-fill: var(--glow-pink);
  --chip-info-ink: var(--cyan);
  --chip-info-fill: var(--glow-cyan);
  /* Status word ink: a tone word with no fill, read on a table row. Dark keeps the chip
     ink, which is 7.42:1 or more on every row ground. Light deepens it, see there. */
  --status-warn-ink: var(--chip-warn-ink);
  --status-info-ink: var(--chip-info-ink);
  --status-danger-ink: var(--chip-danger-ink);
  /* The fill of a chip with no status to carry. The themes match on SEPARATION, not on
     alpha — 12% here is 1.22:1 off the card, 15% in light is 1.23:1 — because --muted is
     a light violet-grey in dark and a mid slate in light.
     why: docs/foundations.md#colour-and-contrast, #453 */
  --chip-neutral-fill: color-mix(in srgb, var(--muted) 12%, transparent);

  /* Solid signal surfaces — a status that has stopped being ink and become the FILL (a
     solid toast). Fill and ink are ONE pair, never two independent picks: the fill is the
     status at this theme's extreme and the ink the pole opposite it, so a single ink
     clears all five. --muted is already its own fill-strength form. See #131, #149. */
  --signal-solid-ink: var(--signal-contrast);
  --signal-solid-success: var(--green);
  --signal-solid-danger: var(--pink);
  --signal-solid-warn: var(--amber);
  --signal-solid-info: var(--cyan);
  --signal-solid-neutral: var(--muted);

  /* Person hues: the eight fills an Avatar takes from a hash of the person's key. Fixed
     values and not accent tints, so a person keeps one hue under every accent and in
     every app. Each is an existing kit value for this theme, and --signal-solid-ink
     holds 4.5:1 on all eight. why: docs/components.md#avatar */
  --person-0: #bd8cff;
  --person-1: #5ab0ff;
  --person-2: #20dcf5;
  --person-3: #3ad9a0;
  --person-4: #98ff8f;
  --person-5: #ffcf6a;
  --person-6: #ff8a5c;
  --person-7: #f5aec6;

  /* DEPRECATED since #295: no surface below the floating step casts, and the floating
     step reads --elev-drop rather than any of these. Published still, so a consumer
     reading one gets nothing rather than an unresolved var(), and a consumer who wants a
     cast shadow sets them. Nothing in src/ reads them.

     A transparent shadow, not `none`, because these are read in a LIST — a surface's
     edge and its drop are two layers of one declaration — and `none` is valid only
     alone, so it makes the whole declaration invalid and takes the layers beside it
     with it. `0 0 #0000` composes. why: docs/foundations.md#elevation */
  --shadow-sm: 0 0 #0000;
  --shadow-md: 0 0 #0000;
  --shadow-lg: 0 0 #0000;
  --shadow-seg: 0 0 #0000;
  --shadow-card: 0 0 #0000;
  /* ONE band, drawn as a real OUTLINE, and no halo. Artur took the halo off on #578
     after #557 drew a scroll region's band without one. An outline leaves its offset
     UNPAINTED, so the 1px between the control and the band is whatever surface the
     control is already standing on — which is what retired --ring-gap and the
     per-surface recomposition behind it, and what leaves forced colors a real outline
     to repaint instead of a transparent stand-in.
     why: docs/foundations.md#the-focus-ring */
  --ring-width: 2px;
  --ring-color: var(--accent);
  --ring-gap-width: 1px;
  --ring: var(--ring-width) solid var(--ring-color);
  --ring-offset: var(--ring-gap-width);
  /* What a scroll region inside a surface takes: the same band, drawn inward rather
     than outward, because an inset shadow is painted under the box's own children and
     a table scrolled under one erases it. Only the offset differs. Chosen by Artur on
     #531 round r30. why: docs/foundations.md#the-focus-ring */
  --ring-scroll: var(--ring);
  --ring-scroll-offset: calc(-1 * (var(--ring-gap-width) + var(--ring-width)));

  /* The ink a cast shadow is made of, and the specular white that reads as gloss on a
     raised surface. Effects mix these instead of writing rgba(). */
  --shadow-ink: #000000;
  --sheen: #ffffff;

  /* The drops of the floating treatment, in Primer's --shadow-floating-* order:
     the inner half of the two-step edge, then these. The line is NOT in this
     token and cannot be — a var() inside a custom property is substituted on the
     element that DECLARES it, so an --elev-edge read here resolves at :root and
     nothing below could re-point it. A floating surface writes the pair itself:
       box-shadow: inset 0 0 0 1px var(--elev-edge, var(--float-edge-inner)), var(--elev-drop);
     Dark spends 62% / 50% of the ink and reaches 1.20 at the drop's core, having
     nowhere to go on a near-black page. why: docs/foundations.md#elevation */
  --elev-drop:
    0 14px 30px -12px color-mix(in srgb, var(--shadow-ink) 62%, transparent),
    0 3px 9px -4px color-mix(in srgb, var(--shadow-ink) 50%, transparent);

  /* The ladder's two resting rungs, which only light climbs. Transparent here and
     not `none`, for the reason the deprecated --shadow-* tokens are: these are read
     in a layer list, and `none` is valid only alone — it would invalidate the whole
     declaration and take the layers beside it with it. why: docs/foundations.md#elevation */
  --elev-rest: 0 0 #0000;   /* a card */
  --elev-rail: 0 0 #0000;   /* the shell's rail, cast sideways */

  /* Backdrop that dims the page behind an overlay (drawer, modal, composer). */
  --scrim: rgba(0, 0, 0, 0.58);

  /* Chart series tones (#740, the "Soft fade" palette), the same under every accent. A tone is the bar's data
     end and clears 3:1 on the card and the page; its -fade is the bar's base, a tint
     of the tone that does not clear 3:1 on the card by design. why: docs/components.md#chart */
  --chart-accent: #347bcd;
  --chart-accent-fade: #2b5185;
  --chart-accent-soft: #26a7a9;
  --chart-accent-soft-fade: #246971;
  --chart-bad: #dd6a77;
  --chart-bad-fade: #884856;
  --chart-good: #4c7a37;
  --chart-good-fade: #395133;
  --chart-warn: #b78c26;
  --chart-warn-fade: #745b29;
  --chart-info: #9256a0;
  --chart-info-fade: #5f3d6c;
  --chart-neutral: #a29db6;
  --chart-neutral-fade: #686478;

  /* Accent gradient stops (hero headline, marketing) — overridden per sub-theme.
     --grad-from is pinned to a literal rather than tracking --purple-light, which #157
     moved up a step; every --grad-from in accents.css is a literal for the same reason. */
  --grad-from: #9b5dff;
  --grad-to: var(--cyan);
}

/* ============================================================================
 * LIGHT THEME — deck light palette from viz/account.mjs
 *
 * A document sheet (.ui-card__page) takes this palette in both themes: the document
 * is paper, so it stays white with dark ink on a dark stage too. Decided on #736.
 * ========================================================================== */
.ui-theme-choice__scene--light,
.ui-card__page,
:root[data-theme="light"] {
  color-scheme: light;

  --purple: #6a2dcc;
  --purple-light: #6a2dcc;
  --purple-mid: #7a3be0;
  --cyan: #0c8fa8;
  --green: #1c8a2c;
  /* Deeper than the dark pink for the same reason dark's is lighter: the wash under it
     is the page, so the ink comes down to meet it. Down a second step at #295, which
     took the page off white. See issues #131 and #295. */
  --pink: #a92d59;
  --amber: #b5730a;

  /* The same ladder, run the only way light can run it: nothing is brighter than
     white, so light moves DOWN from it. #307 ran it downwards from the CARD, which
     put the page at #eef0f5 and left the card at #f8f9fc — a grey canvas under a
     surface only 1.08:1 above it, so the grey was what the screen read as and the
     card never arrived. The card takes the white instead, and the page is the
     lightest ground that still leaves it a step: 1.11:1, on a page lighter and less
     blue than the one it replaces. Light spends its white on the surface you read
     ON, and separates the panel that floats over it by role — its two-step edge and
     its drop — rather than by a rung it has nothing left to pay for. See issue #448.
     why: docs/foundations.md#elevation */
  --bg: #ffffff;           /* the page takes the card's white, #850: --surface is #ffffff here, written out because gates read --bg without var() substitution */
  --table-bg: var(--bg);   /* a table is flush with the page */
  --table-code-bg: var(--surface-3); /* a chip in a table takes a quiet fill: page and card are one white now */
  --wash-code-bg: var(--surface-3);   /* a chip on a wash takes a quiet fill for the same reason */
  --code-chip-page: var(--surface-3); /* #850: page and card are one white, so a chip takes the quiet fill */
  --code-chip-surface: var(--surface-3);
  /* The auth page's branded ground, brand C: a 135-degree gradient a product may override. */
  --ui-auth-ground: linear-gradient(135deg, var(--color-apliteni-violet-7), var(--color-apliteni-blue-8));
  /* The document page's bare backdrop, behind the A4 sheet: the same sunken rung a
     table takes inside a viewer, named once so a page reads it as its own ground. */
  --ui-document-ground: var(--surface-2);
  --surface-2: #e9ecf3;     /* non-text sunken marks and tracks */
  --surface: #ffffff;       /* the card */
  --bg-elevated: #ffffff;   /* FLOATING — menus, panels, drawer, modal, toasts */
  --surface-3: #eef0f5;     /* non-text quiet fills */
  --seg-active-bg: #ffffff; /* white pill raised above the grey track in light */
  --nav-active-fill: var(--surface-3); /* one rung off the white page, #850 */
  --control-knob: #ffffff;
  --border: #e4e7ee;
  --border-strong: #cdd2dc;

  /* Light draws each LEVEL with one line and a faint short shadow. The line is half
     way between --border and --border-strong. Decided on #730.
     why: docs/foundations.md#elevation */
  --level-line: color-mix(in srgb, var(--border) 50%, var(--border-strong));
  --card-edge: var(--level-line);
  --rail-edge: var(--level-line);
  --float-edge: var(--level-line);
  --float-edge-inner: transparent;
  --modal-edge: var(--float-edge);

  /* Light draws a field with its EDGE, because since #448 it has no well left to draw it
     with: a card and a panel are both white, the sunken step falls two rungs under either,
     and --border on it measures 1.047:1. why: docs/foundations.md#elevation */
  --field-bg: var(--surface);
  --field-edge: var(--border-strong);
  --field-edge-hover: var(--muted);
  --control-edge: var(--border-strong);

  /* Light mixes DOWN from white, so tint costs lightness: 5% is the most a card can spend
     and stay above the page. why: docs/foundations.md#elevation */
  --card-tint: 5%;
  --card-tint-hover: 8%;

  --text: #1a1e27;
  --strong: #0c0e13;
  --dim: #3a404b;
  --muted: #5c6270;

  /* Disabled text stays on the card surface; its ink marks the unavailable state. */
  --disabled-ink: var(--muted);
  --disabled-surface: var(--surface);
  /* The hairline, where dark takes the rung under it: light's field edge is already
     --border-strong, so the two states read 1.52:1 and 1.24:1. #564 */
  --disabled-border: var(--border);
  --disabled-ink-bare: #585e6c;

  --accent: #6a2dcc;
  --accent-strong: #6a2dcc; /* already dark enough for white text */
  --accent-contrast: #ffffff;

  --signal-contrast: #0c0c0c;
  --danger-contrast: #ffffff;

  /* Re-tinted from --green; it was rgba(30, 150, 50, .1), a colour that exists nowhere
     else in the kit while the other three light glows are exact tints of their own token.
     The wash over white moves at most two levels on a channel and no verdict moves with
     it. Gated for all four glows in stories/signal-contrast.test.js. */
  --glow-green: rgba(28, 138, 44, 0.1);
  --glow-purple: rgba(106, 45, 204, 0.09);
  --glow-cyan: rgba(12, 143, 168, 0.1);
  --glow-pink: rgba(169, 45, 89, 0.1);   /* an exact tint of --pink above */

  /* Solid chip pairs for the light app. Each ink is deepened past its signal hue so 12px
     chip text clears WCAG AA on its own pale fill, and on the soft toast's wash, which
     #131 gave the same ink. Three came down again at #295 with the page; danger did not
     need to. */
  /* Success is held at the 7:1 body aim rather than the 4.5:1 floor: 7.17:1 on its own
     fill, 8.33:1 on the card. Was #1c7034 at 5.29:1. The fill did not move.
     why: docs/foundations.md#colour-and-contrast, #453 */
  --chip-success-ink: #145a26;
  --chip-success-fill: #dff3e4;
  --chip-warn-ink: #825900;
  --chip-warn-fill: #fbedd2;
  --chip-danger-ink: #b7295f;

 * bundle the kit publishes and a second copy would drift; a consumer who imports
 * both bundles gets it twice, which costs nothing, since every rule here is
 * idempotent and `!important`.

 * checkmark stays drawn — instead of snapping back to the start.

    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;

/* Totals open with the 2px rule the zebra header already uses, so a reader can see
 * where items end and totals begin; five identical hairlines told them nothing.
 * Collapsed borders paint one edge, so this meets the last body row's hairline and the
 * wider of the two wins — no doubled line.
 * A footer label is a row header for the figure beside it, so it sits against that
 * figure rather than against the first column it spans. */
.ui-table tfoot tr:first-child > :is(th, td) { border-top: 2px solid var(--border-strong); }
.ui-table tfoot th { text-align: right; }
.ui-table td.ui-table__title { color: var(--strong); font-weight: var(--weight-medium); width: 99%; white-space: normal; }
/* A floor, not a spacing step: a two-word name stays on one line when the table is
   wider than its frame, so the frame scrolls instead of the title breaking at each word,
   as a pinned subject column did in #832. A pinned column's own ceiling still wins. */
.ui-table td.ui-table__title { min-width: min(20ch, var(--ui-table-identity-max, 20ch)); }
.ui-table th:last-child { padding-right: 0; }
/* The last body cell ends where its header and the table end. A right-aligned amount in the
   last column stood 16px in from both, because only the header and the action cell dropped
   the cell gap. The variants below state their own end padding. why: docs/foundations.md#spacing-and-rhythm */
.ui-table td:last-child { padding-right: 0; }
.ui-table td.ui-table__act { padding-right: 0; text-align: right; }
.ui-table tr.is-dead td { /* muted-ink: state — revoked row */ color: var(--muted); }
.ui-table tbody tr { transition: background var(--dur-fast) var(--ease); }

/* Row hover: a rounded fill across the full table width. The separate border model with
 * zero spacing lets the row ends round. The table has no side padding, so the end cells
 * hold the room: --space-2 inside the fill at each end, header and body alike, so a
 * column and its header share one edge. A pinned column sticks at the frame's edge with
 * that room inside it (#736). The dense and compact variants and an end action cell
 * keep the same room. Zebra keeps the original full-bleed tint
 * (finance ledger) and is excluded here; its hover rule is below. why: #773 */
.ui-table--hover:not(.ui-table--zebra) {
  border-collapse: separate;
  border-spacing: 0;
}
:where(.ui-table--hover:not(.ui-table--zebra)) :is(th, td):not(.ui-table__act):first-child { padding-left: var(--space-2); }
:where(.ui-table--hover:not(.ui-table--zebra)) :is(th, td):not(.ui-table__act):last-child { padding-right: var(--space-2); }
:where(.ui-table--hover:not(.ui-table--zebra)) td.ui-table__act:last-child { padding-right: var(--space-2); }
.ui-table--hover:not(.ui-table--zebra) tbody tr:hover > :is(td, th):first-child {
  border-top-left-radius: var(--radius-sm); border-bottom-left-radius: var(--radius-sm); }
.ui-table--hover:not(.ui-table--zebra) tbody tr:hover > :is(td, th):last-child {
  border-top-right-radius: var(--radius-sm); border-bottom-right-radius: var(--radius-sm); }
/* A row line that met a round corner crossed it. A hovered row drops the line below it,
   the row before it drops the line above it, and the header drops its line over the
   first row. why: #773 */
.ui-table--hover:not(.ui-table--zebra) tbody tr:hover > :is(td, th),
.ui-table--hover:not(.ui-table--zebra) tbody tr:has(+ tr:hover) > :is(td, th),
.ui-table--hover:not(.ui-table--zebra) thead:has(+ tbody > tr:first-child:hover) > tr > th {
  border-bottom-color: transparent;
}

/* Data-table modifiers, composable: .ui-table--dense --zebra --hover.
 *   --dense  --space-3 across, --space-2 down — one step in from the base table
 *   --zebra  legacy spacing and 2px header rule; the base-surface rule below removes stripes
 * Cell helpers: .ui-table__num (right, tabular), .ui-table__code, .ui-table__pair.
 * why: docs/foundations.md#spacing-and-rhythm
 * held by: stories/table-rhythm.test.js */
.ui-table--dense th { padding: 0 var(--space-3) var(--space-2); }
.ui-table--dense td,
.ui-table--dense :is(tbody, tfoot) th { padding: var(--space-2) var(--space-3); font-size: var(--text-sm); white-space: nowrap; }
.ui-table--dense th:first-child,
.ui-table--dense td:first-child { padding-left: var(--space-3); }
.ui-table--dense th:last-child,
.ui-table--dense td:last-child { padding-right: var(--space-3); }

.ui-table--zebra thead th { border-bottom-width: 2px; }
.ui-table--zebra td,
.ui-table--zebra :is(tbody, tfoot) th { border-bottom: 0; }
.ui-table--zebra tbody tr:nth-child(even) td { background: var(--surface-2); }
/* The stripe stays full-bleed (the #71 inset above is hover only), but it only reads right
 * if the end cells are inset from the row's own edge, and `.ui-table td` sets
 * `padding-left: 0`. Only `--dense` supplied that inset, so `--zebra` without `--dense` —
 * `DataTable`'s composition — sat its checkboxes at x=0 of the row. Head and body are
 * inset together, or the columns stop lining up. Held by src/styles/table.test.js, and
 * kept off the card's text edge by the bleed rule at the end of this file. */
.ui-table--zebra th:first-child,
.ui-table--zebra td:first-child { padding-left: var(--space-3); }
.ui-table--zebra th:last-child,
.ui-table--zebra td:last-child { padding-right: var(--space-3); }

/* A link in a cell is a value that happens to open something: the row's ink, underlined
   on hover — what .ui-identity below has always done. Without it, base.css's bare
   `a { color: var(--accent) }` reached the ledger's IDs.
   why: guidelines/density-and-accents.md#give-accents-a-job */
.ui-table :where(td, th) a:not(.ui-btn):not(.ui-identity) {
  color: inherit;
  text-decoration: none;
}
.ui-table :where(td, th) a:not(.ui-btn):not(.ui-identity):hover {
  color: var(--strong);
  text-decoration: underline;
}
/* A plain link — one carrying no class — is the link these rules are about. An inline-block
   box, so a title link that wraps paints one ring instead of one per line, and the kit's small
   corner for that ring to follow. Anchors the kit already styles (`.ui-btn`, `.ui-identity`,
   `.ui-dropdown__item`, `.ui-nav__item`) keep the box and the corner their own component sets;
   a denylist of them went stale twice before this said what it meant (#510).
   held by: src/styles/table-focus.test.js */
.ui-table :where(td, th, caption) a:not([class]) {
  display: inline-block;
  border-radius: var(--radius-xs);
  position: relative;
}
/* A bare link in a cell is only as tall as its line box — 21px in a dense table,
   under the 24px pointer floor. This layer gives a pointer the floor without
   moving anything: growing the link's own box would grow every dense row holding
   one. Written one cell kind per line because the measuring gate splits a
   selector list on commas, and `:where(td, th, caption)` carries two of its own.
   why: guidelines/accessibility-floor.md#minimum-target-size
   held by: stories/guidelines/accessibility-floor.test.js */
.ui-table td a:not([class])::after,
.ui-table th a:not([class])::after,
.ui-table caption a:not([class])::after {
  content: '';
  position: absolute;
  height: 24px;
  left: 0;
  right: 0;
  top: 50%;
  translate: 0 -50%;
}
/* No generic focus rule here. #510 gave a cell link the ring because `base.css`
   reached no bare `a`; #587 put `a` on that shared list, so this file only keeps
   the filled-cell override below. why: guidelines/state-set.md#focus-rings */
/* The handle: a cell MARKED `.ui-table__linked` holds one link and nothing else, so the
   link fills the cell and its ring outlines the cell rather than the words. The cell hands
   its padding over and nothing moves. `height: 1px` is the cell stating no height of its
   own, which a percentage height on the link can resolve against; a cell is stretched to
   its row either way, so no row changes.
   The mark is the consumer's because a selector counts elements and not words: `:only-child`
   reads `<td>Invoice <a>1162</a></td>` as a lone link too. The link is named rather than
   denied — a denylist of the anchors that own their box went stale twice (#510).
   why: docs/components.md#data-table, #500
   held by: src/styles/table-focus.test.js */
.ui-table td.ui-table__linked:has(> :is(a:not([class]), a.ui-identity):only-child) { padding: 0; height: 1px; }
.ui-table td.ui-table__linked > :is(a:not([class]), a.ui-identity):only-child {
  box-sizing: border-box;
  display: flex;
  align-items: flex-start;
  width: 100%;
  height: 100%;
  padding: var(--space-4) var(--space-4) var(--space-4) 0;
  border-radius: var(--radius-xs);
}
/* The last cell gave up its end gap above, so the link it holds gives up the same. */
.ui-table td.ui-table__linked:where(:last-child) > :is(a:not([class]), a.ui-identity):only-child { padding-right: 0; }
/* A hover table's end cells hold the room inside the fill, so a linked end cell's link does. */
:where(.ui-table--hover:not(.ui-table--zebra)) td.ui-table__linked:first-child > :is(a:not([class]), a.ui-identity):only-child { padding-left: var(--space-2); }
:where(.ui-table--hover:not(.ui-table--zebra)) td.ui-table__linked:last-child > :is(a:not([class]), a.ui-identity):only-child { padding-right: var(--space-2); }
.ui-table--dense td.ui-table__linked > :is(a:not([class]), a.ui-identity):only-child { padding: var(--space-2) var(--space-3); }
.ui-table--compact td.ui-table__linked > :is(a:not([class]), a.ui-identity):only-child { padding: var(--space-2) var(--space-3) var(--space-1); }
:where(.ui-table--hover:not(.ui-table--zebra)):is(.ui-table--dense, .ui-table--compact) td.ui-table__linked:first-child > :is(a:not([class]), a.ui-identity):only-child { padding-left: var(--space-2); }
:where(.ui-table--hover:not(.ui-table--zebra)):is(.ui-table--dense, .ui-table--compact) td.ui-table__linked:last-child > :is(a:not([class]), a.ui-identity):only-child { padding-right: var(--space-2); }
/* Zebra insets the row's END cells only, so the fill does too: a marked identity behind a
   selection column is a middle cell, and a step it never gave up would move its name. */
.ui-table--zebra td.ui-table__linked:first-child > :is(a:not([class]), a.ui-identity):only-child { padding-left: var(--space-3); }
.ui-table--zebra td.ui-table__linked:last-child > :is(a:not([class]), a.ui-identity):only-child { padding-right: var(--space-3); }
/* The inward band, the one a scroll region takes: a filled cell's edges are the
   table's, where the pinned column's border and the scroller's 4px side padding
   cut an outset ring away. Its 1px gap is unpainted, and the ring is the outline. */
.ui-table td.ui-table__linked > :is(a:not([class]), a.ui-identity):only-child:focus-visible {
  outline: var(--ring-scroll);
  outline-offset: var(--ring-scroll-offset);
  margin-inline: 0;
}
/* A later cell's name starts at its cell's edge, so the band crossed its first letter. The band
   takes --space-2 of the gap before it: a clear edge, lent back by the margin, so no word moves.
   #814 (rev_136bd26bc559/d22) */
.ui-table td.ui-table__linked:not(:first-child) > :is(a:not([class]), a.ui-identity):only-child:focus-visible {
  width: auto;
  margin-inline-start: calc(-1 * var(--space-2));
  border-inline-start: var(--space-2) solid transparent;
}

.ui-table__num { text-align: right; font-variant-numeric: tabular-nums; }
/* A numeric column is sized to its content while .ui-table__title claims the rest,
 * so a two-word numeric header wraps where none of its values ever do. */
.ui-table th.ui-table__num { text-align: right; white-space: nowrap; }
.ui-table__num--strong { color: var(--strong); font-weight: var(--weight-semibold); }
/* `.ui-table th` and `.ui-table td` each state their own ink, and `th` its weight too,
 * so both outranked the helper: a totals row marked strong came out in body ink, and
 * bold only in the figure. Scoped to the table, the helper wins on either cell and the
 * row reads as one row. */
.ui-table :is(th, td).ui-table__num--strong { color: var(--strong); font-weight: var(--weight-semibold); }
.ui-table__code { font-size: var(--text-sm); color: var(--text); }
/* Two things in one cell — a row's own name and the state of it — side by side
 * while the column has room and stacked when it does not. The wrap comes from flex
 * because a dense cell is nowrap, and the column is then only as wide as the wider
 * of the two: a status that had a column of its own was the first thing a phone cut
 * off, and in here it is the last. The class goes on a span inside the cell, never
 * on the cell, which would leave the table box model. A pair keeps every head at every
 * width, which is what a three-value glance row is read by. why: #505 */
.ui-table__pair { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1) var(--space-2); }

/* The empty state (.ui-empty) — shown when a table/list has no rows — now
   lives in styles/empty.css as a standalone component (illustration support). */

/* Tables share their containing card's reading surface, including pinned cells. The code
   chip's hand-off travels with it, so an identifier in a cell keeps the page rather than
   the card the cell is now painted with. --table-bg is the surface in dark and the white
   page in light (where --surface is white), and --table-code-bg is --code-chip-surface,
   the page in dark and the quiet fill in light. why: src/tokens/tokens.css */
.ui-card { --table-bg: var(--surface); --table-code-bg: var(--code-chip-surface); }
/* A drawer group is a reading surface in the same way, so its table takes the drawer's ground. */
.ui-drawer .ui-drawer__section { --table-bg: var(--drawer-surface); --table-code-bg: var(--code-chip-surface); }

/* White in light, base canvas in dark; never a grey or tinted data surface. */
.ui-table { background: var(--table-bg); }
.ui-table--zebra tbody tr:nth-child(even) td { background: var(--table-bg); }
/* A row hover is a quiet neutral step. The row paints under transparent cells in a
   scroll region, while ordinary cells cover the row without breaking its fill. */
.ui-table--hover tbody tr:hover:not(.is-target),
.ui-table--hover tbody tr:hover:not(.is-target) > :is(td, th) {
  background: var(--surface-2);
}

/* The row a reference landed a reader on. The mark is a GROUND, not a line: an outline
   says the keyboard is here (Artur, r34), and this one persists — it answers which row the
   reader came for, so it stays until the next arrival and must not wear the picture focus
   draws. It took --ring-scroll until #505's review found a landed row still outlined in the
   accent after focus had moved on, with a second row beside it wearing the same box.
   The ground and the ring paint together on arrival: `landOnRow()` focuses the row, so a
   reader must see both at once, not the ring now and the ground only after they tab away.

   The wash is the accent over the table's own ground: the family `tbody tr:hover` already
   uses for "this row", one step up from its 8% so the two are told apart. 12% is the
   strongest step that keeps an accent link inside the row above 4.5:1 — 4.60:1 at the worst
   of the eight accent/theme cells, against 4.45:1 at 14%. It paints cells rather than the
   row, because the hover and zebra rules paint cells and would otherwise cover it; the two
   hover selectors are repeated with .is-target so a pointer passing over the row does not
   take its mark off.
   why: Artur, round r34; guidelines/dashboards-and-reports.md#link-each-reference-to-its-row
   held by: stories/dashboard-report-refs.test.js, for landOnRow() marking the right row and
   only the right row; stories/contrast.test.js, for the wash's contrast, now that
   stories/components/Table.stories.js:FinanceData renders a row wearing the mark at rest.
   Neither gate reads paint against focus: the ground and the ring share no selector and no
   condition, which is why one cannot switch the other off, and that is proved by the PR's
   browser captures rather than by a gate. PR #552 code review, finding F6. */
.ui-table tbody tr.is-target > :is(td, th),
.ui-table--hover tbody tr.is-target:hover > :is(td, th),
.ui-table--zebra.ui-table--hover tbody tr.is-target:hover > :is(td, th) {
  background: color-mix(in srgb, var(--accent) 12%, transparent); /* code-bg: inherit — this translucent wash leaves the chip on its opaque ground. */
}
/* A pinned cell lays the wash over its own ground, or the columns that scroll under it
   show through. #736 */
.ui-table--pinned tbody tr.is-target > :is(.ui-table__identity, .ui-table__selection),
.ui-table--pinned.ui-table--hover tbody tr.is-target:hover > :is(.ui-table__identity, .ui-table__selection) {
  background: linear-gradient(color-mix(in srgb, var(--accent) 12%, transparent)) var(--table-bg);
}

/* A focused row draws the shared ring inward, like its containing scroll region.
   why: docs/foundations.md#the-focus-ring */
.ui-table tbody tr:focus-visible {
  outline: var(--ring-scroll);
  outline-offset: var(--ring-scroll-offset);
}

/* The end-cell inset above gives a row's highlight room; the bleed is what stops the grid
   paying for it. The table hangs out by the same --space-3, into the card's 20-24px
   padding and never past it, so the columns start on the card's own text edge and the
   scroll region stays empty at rest. why: docs/foundations.md#spacing-and-rhythm */
.ui-card > :where(.ui-table--dense, .ui-table--zebra) {
  width: calc(100% + 2 * var(--space-3));
  margin-inline: calc(-1 * var(--space-3));
}
.ui-card--fit > :where(.ui-table--dense, .ui-table--zebra) {
  width: auto;
  max-width: calc(100% + 2 * var(--space-3));
}
/* A scroll wrapper owns the bleed for a nested dense table: 4px of focus
   clearance plus the 12px end-cell inset. */
.ui-card > .ui-table-scroll:has(> .ui-table--dense) {
  margin-inline: calc(-1 * var(--space-4));
}
/* A hover table holds 8px at its ends, so a dense one hangs out by that much. why: #773 */
.ui-card > .ui-table--dense.ui-table--hover:not(.ui-table--zebra) {
  width: calc(100% + 2 * var(--space-2));
  margin-inline: calc(-1 * var(--space-2));
}
.ui-card--fit > .ui-table--dense.ui-table--hover:not(.ui-table--zebra) {
  width: auto;
  max-width: calc(100% + 2 * var(--space-2));
}
/* A hover table's 8px end-cell room plus the frame's 4px band is one --space-3, so the
   frame hangs out by that much and the first column meets the title. A dense zebra hover
   table keeps the dense bleed. why: #736, #773 */
.ui-card > .ui-table-scroll:has(> .ui-table--hover:not(.ui-table--dense.ui-table--zebra)) {
  margin-inline: calc(-1 * var(--space-3));
}
.ui-table td.ui-table__num { text-align: right; }
/* The top padding centres one 18.2px line in the 33px row (7.4px), rounded up to the step. */
.ui-table--compact td,
.ui-table--compact :is(tbody, tfoot) th { padding: var(--space-2) var(--space-3) var(--space-1); font-size: var(--text-sm); line-height: var(--leading-snug); height: 33px; }
.ui-table--compact th { padding: var(--space-2) var(--space-3); }
.ui-table--compact th:first-child,
.ui-table--compact td:first-child { padding-left: var(--space-3); }
.ui-table--compact th:last-child,
.ui-table--compact td:last-child { padding-right: var(--space-3); }
/* A hover table holds --space-2 inside the fill at each end, and dense and compact too. why: #773 */
:where(.ui-table--hover:not(.ui-table--zebra)):is(.ui-table--dense, .ui-table--compact) :is(th, td):first-child { padding-left: var(--space-2); }
:where(.ui-table--hover:not(.ui-table--zebra)):is(.ui-table--dense, .ui-table--compact) :is(th, td):last-child { padding-right: var(--space-2); }
/* A wide table scrolls sideways in its frame. The frame paints no shade at its edges. #770 */
.ui-table-scroll {
  overflow: auto; max-height: var(--ui-table-height, 70vh);
  /* A transparent border, not padding: positioned cells cover an outline on the scrollport's
     padding. The side and bottom bands draw in the border at the visible edge at every scroll
     position. why: docs/foundations.md#the-focus-ring */
  border: 0 solid transparent; border-inline-width: var(--space-1); border-bottom-width: var(--space-1);
  background-color: var(--table-bg);
  /* The containing block of an absolute child, such as a screen-reader label, so the
     frame clips it and it cannot widen the page. #770 */
  position: relative;
  /* A grid track with a zero floor, so a wide table cannot widen the frame's card. */
  display: grid;
  grid-template-columns: minmax(0, 1fr);
}
/* The surface belongs to the box that scrolls, and the row fills repeat that same surface.
   The sticky header and pinned column keep their paint: they hide what scrolls beneath
   them. A target row keeps its wash. */
.ui-table-scroll > .ui-table,
.ui-table-scroll > .ui-table tbody :where(tr:not(.is-target)) > td:not(.ui-table__identity, .ui-table__selection) { background-color: transparent; }
.ui-table-scroll > .ui-table--hover tbody tr:hover:not(.is-target) > :is(td, th) {
  background: var(--surface-2);
}
/* The kit's first ringed scroller, and a scroll region inside a card like the rest, so
   it draws the band inward too rather than spending a halo across the card around it.
   It had no room of its own to draw in — the border above is horizontal — which is the
   second reason the band is an outline: it is painted over the rows, in the cell padding
   of the first and last, rather than under them. #531
   why: docs/foundations.md#the-focus-ring */
.ui-table-scroll:focus-visible { outline: var(--ring-scroll); outline-offset: var(--ring-scroll-offset); }
@media (forced-colors: active) {
  .ui-table-scroll { border-color: Canvas; }
}
.ui-table--sticky { border-collapse: separate; border-spacing: 0; }
.ui-table--sticky thead th { position: sticky; top: 0; z-index: var(--z-sticky); background: var(--table-bg); padding-top: var(--space-2); }
/* The header sticks at the region's top edge, which is where the inward band draws, and a
   positioned cell paints over an outline. While the region holds the ring, the header
   gives up the band's own 3px, so the ring is whole on the top side. The side bands lie in
   the region's border, which no cell reaches.
   why: docs/foundations.md#the-focus-ring */
.ui-table-scroll:focus-visible .ui-table--sticky thead th { clip-path: inset(calc(var(--ring-gap-width) + var(--ring-width)) 0 0 0); }
.ui-table--pinned .ui-table__identity, .ui-table--pinned .ui-table__selection { position: sticky; left: 0; z-index: var(--z-base); background: var(--table-bg); border-right: 1px solid var(--border); }
.ui-table--pinned thead .ui-table__identity, .ui-table--pinned thead .ui-table__selection { z-index: calc(var(--z-sticky) + 1); }
/* The divider is the pin's edge: it says the column stayed while the rest moved under it.
   Columns that all fit never move, so the line divides nothing and reads as an arbitrary
   rule. The resting rule keeps it, so an engine that cannot answer the query is unchanged;
   scroll-state makes a query container, not a size one. why: guidelines/dense-tables.md */
.ui-table-scroll { container-type: scroll-state; }
@container not scroll-state(scrollable: x) {
  .ui-table--pinned :is(.ui-table__identity, .ui-table__selection) { border-right-color: transparent; }
}
/* Once the frame is scrolled, the next column's text keeps its cell padding from the
   divider: the pinned cell lays its own ground over that padding, so the text that moves
   under the pin stops short of the line. A frame at rest paints nothing more. The gap is
   the next cell's padding, set beside each padding rule below. Below 720px the cell cuts
   what overflows it, so its cut reaches past the divider to hold the widest band, 12px and
   the 1px line. A plain step, because Chromium computes a calc() here as 0px. why: #845 */
@container scroll-state(scrollable: left) {
  .ui-table--pinned .ui-table__identity { overflow-clip-margin: var(--space-4); }
  .ui-table--pinned .ui-table__identity::after {
    content: ''; position: absolute; top: 0; bottom: 0; left: calc(100% + 1px);
    width: var(--ui-table-pin-gap, var(--space-3)); background: inherit; pointer-events: none;
  }
}
.ui-value, .ui-delta { white-space: nowrap; font-variant-numeric: tabular-nums; }
.ui-value__unit { margin-left: var(--space-1); font-size: var(--text-xs); color: var(--text); }
.ui-delta--success { color: var(--chip-success-ink); }
.ui-delta--danger { color: var(--chip-danger-ink); }
.ui-identity { min-height: 24px; display: inline-flex; align-items: center; gap: var(--space-2); color: var(--text); text-decoration: none; }

     under it, so whatever the cut lets out is painted over that column. A child's ring
     needs 3px and the cell's padding is 12px, so the room comes from the padding.
     why: docs/components.md#data-table, #500, #513 */

    overflow: clip;
    text-overflow: ellipsis;

    overflow: visible;
    text-overflow: clip;

    text-overflow: clip;

     control centres its label, and a capped one that centres loses the front of it. #513 */
  .ui-table--pinned .ui-table__identity :is(.ui-btn, .ui-nav__item, .ui-badge, button, input, select, textarea) {
    max-width: 100%;
    min-width: auto;
    overflow: hidden;
    justify-content: flex-start;

     cap belongs on it. The whole name stays in the DOM; only the drawn line is cut. */
  .ui-table--pinned .ui-identity { max-width: 100%; }

}

/* Automatic layout hands every column a share of the free width, and a box is not worth one: the selection column takes the width of its box and the gap after it. The pinned table below fixes it instead. */

.ui-table td.ui-table__long { white-space: normal; min-width: var(--panel-sm); }

.ui-table.ui-table--hover:not(.ui-table--zebra):not(.ui-table--dense):is(.ui-table--pinned) td.ui-table__identity.ui-table__linked > :is(a:not([class]), a.ui-identity):only-child { padding-right: calc(var(--cell-gap) / 2); }

.ui-table.ui-table--hover:not(.ui-table--zebra):not(.ui-table--dense):not(.ui-table--pinned) .ui-table__selection { padding-right: var(--space-4); }

.ui-table.ui-table--hover:not(.ui-table--zebra):not(.ui-table--dense).ui-table--compact thead th { padding-block: var(--space-2); }

   the columns that scroll under it. A target row keeps its own wash. The wash is a tinted

.ui-table.ui-table--hover:not(.ui-table--zebra):not(.ui-table--dense) td.ui-table__act .ui-btn { margin-block: calc(-1 * (var(--btn-pad-y) + var(--btn-edge-width))); }
.ui-table.ui-table--hover:not(.ui-table--zebra):not(.ui-table--dense) td.ui-table__act .ui-btn--icon { box-sizing: border-box; width: var(--space-8); height: var(--space-8); padding: 0; justify-content: center; vertical-align: top; margin-block: calc((var(--ui-cell-line) - var(--space-8)) / 2); }

/* In a card the table, or its frame, reaches the card's edges, so a row's fill does too. It
   bleeds by the card's own side inset, which is less in a light card on a narrow page. #875 */
.ui-card > :is(.ui-table.ui-table--hover:not(.ui-table--zebra):not(.ui-table--dense), .ui-table-scroll:has(> .ui-table.ui-table--hover:not(.ui-table--zebra):not(.ui-table--dense))) {
  width: calc(100% + 2 * var(--ui-card-inset));
  max-width: none;
  margin-inline: calc(-1 * var(--ui-card-inset));
}
.ui-card > :is(.ui-table.ui-table--hover:not(.ui-table--zebra):not(.ui-table--dense), .ui-table-scroll:has(> .ui-table.ui-table--hover:not(.ui-table--zebra):not(.ui-table--dense))):first-child { margin-top: calc(-1 * var(--space-6)); }
.ui-card > :is(.ui-table.ui-table--hover:not(.ui-table--zebra):not(.ui-table--dense), .ui-table-scroll:has(> .ui-table.ui-table--hover:not(.ui-table--zebra):not(.ui-table--dense))):last-child { margin-bottom: calc(-1 * var(--space-6)); }
.ui-card--pad-sm > :is(.ui-table.ui-table--hover:not(.ui-table--zebra):not(.ui-table--dense), .ui-table-scroll:has(> .ui-table.ui-table--hover:not(.ui-table--zebra):not(.ui-table--dense))):first-child { margin-top: calc(-1 * var(--space-5)); }
.ui-card--pad-sm > :is(.ui-table.ui-table--hover:not(.ui-table--zebra):not(.ui-table--dense), .ui-table-scroll:has(> .ui-table.ui-table--hover:not(.ui-table--zebra):not(.ui-table--dense))):last-child { margin-bottom: calc(-1 * var(--space-5)); }
.ui-card--fit > :is(.ui-table.ui-table--hover:not(.ui-table--zebra):not(.ui-table--dense), .ui-table-scroll:has(> .ui-table.ui-table--hover:not(.ui-table--zebra):not(.ui-table--dense))) { width: auto; max-width: calc(100% + 2 * var(--ui-card-inset)); }

   cells end on the column edges. The frame keeps its side bands below.
   why: docs/foundations.md#spacing-and-rhythm */
:root[data-theme="light"] .ui-card > :is(.ui-table, .ui-table-scroll) {
  width: 100%;
  max-width: 100%;
  margin-inline: 0;
}

   takes no bleed of its own and its end cells meet the page title's edge. A frame hangs out
   by its side band only. The selector names the light card as card.css does, so it outranks
   each bleed above. A row fill stays inside the page. */

  width: 100%;
  max-width: 100%;
  margin-inline: 0;

  width: calc(100% + 2 * var(--space-1));
  max-width: none;
  margin-inline: calc(-1 * var(--space-1));
}
/* #850: the row table's vertical bleed hangs it out by the card's 24px padding, but the
   light card removed that padding. The card clips its overflow, so the last row was cut and
   faded at the bottom. Reset the two ends to 0. why: docs/foundations.md#spacing-and-rhythm */
:root[data-theme="light"] .ui-card > :is(.ui-table.ui-table--hover:not(.ui-table--zebra):not(.ui-table--dense), .ui-table-scroll:has(> .ui-table.ui-table--hover:not(.ui-table--zebra):not(.ui-table--dense))):first-child { margin-top: 0; }
:root[data-theme="light"] .ui-card > :is(.ui-table.ui-table--hover:not(.ui-table--zebra):not(.ui-table--dense), .ui-table-scroll:has(> .ui-table.ui-table--hover:not(.ui-table--zebra):not(.ui-table--dense))):last-child { margin-bottom: 0; }
/* The frame keeps its side bands and takes a top band, because the sticky header covers a
   ring drawn anywhere else. The frame clips its cells to the inner curve of the bands, so
   the header follows the ring at the top corners. The header gives the top band back from
   its padding. The frame drops the bottom band, so the card's padding is the only room
   below the table. */

.ui-card > .ui-table-scroll > .ui-table.ui-table--hover:not(.ui-table--zebra):not(.ui-table--dense) thead th { padding-top: calc(var(--space-3) - var(--space-1)); }
.ui-card > .ui-table-scroll > .ui-table.ui-table--hover:not(.ui-table--zebra):not(.ui-table--dense).ui-table--compact thead th { padding-top: calc(var(--space-2) - var(--space-1)); }
/* The frame's corners follow the card's, so a fill in the first or last row does too. */

.ui-card > .ui-table.ui-table--hover:not(.ui-table--zebra):not(.ui-table--dense) { --cell-edge: var(--space-6); }
/* In a frame, the side band holds space-1 of the card's text edge. */
.ui-card > .ui-table-scroll > .ui-table.ui-table--hover:not(.ui-table--zebra):not(.ui-table--dense) { --cell-edge: calc(var(--space-6) - var(--space-1)); }

   column edges. The dense, zebra and compact end insets go, and the row table's --cell-edge
   room is zeroed per cell rather than by redefining the token: the contrast walk reads

:root[data-theme="light"] .ui-card .ui-table :is(th, td):first-child { padding-left: 0; }
:root[data-theme="light"] .ui-card .ui-table :is(th, td):last-child { padding-right: 0; }
:root[data-theme="light"] .ui-card .ui-table.ui-table--hover:not(.ui-table--zebra):not(.ui-table--dense) :is(th, td):first-child:not(:where(.ui-table--pinned) .ui-table__selection) { padding-left: 0; }
:root[data-theme="light"] .ui-card .ui-table.ui-table--hover:not(.ui-table--zebra):not(.ui-table--dense) :is(th, td):last-child { padding-right: 0; }
:root[data-theme="light"] .ui-card .ui-table td.ui-table__linked:first-child > :is(a:not([class]), a.ui-identity):only-child { padding-left: 0; }
:root[data-theme="light"] .ui-card .ui-table td.ui-table__linked:last-child > :is(a:not([class]), a.ui-identity):only-child { padding-right: 0; }
:root[data-theme="light"] .ui-card .ui-table.ui-table--hover:not(.ui-table--zebra):not(.ui-table--dense) td.ui-table__linked:first-child > :is(a:not([class]), a.ui-identity):only-child { padding-left: 0; }
:root[data-theme="light"] .ui-card .ui-table.ui-table--hover:not(.ui-table--zebra):not(.ui-table--dense) td.ui-table__linked:last-child > :is(a:not([class]), a.ui-identity):only-child { padding-right: 0; }

   the first column starts on the edge of the group heading and the drawer title. */
.ui-drawer .ui-drawer__section > .ui-table.ui-table--hover:not(.ui-table--zebra):not(.ui-table--dense) {
  width: calc(100% + 2 * var(--cell-edge));
  max-width: none;

<style data-kit="react/src/Toast.css">
/* Both class names, so this outranks `.ui-toast-stack--collapsed` below: a

  position: fixed;
  right: var(--space-4);
  bottom: var(--space-4);
  max-width: calc(100% - 2 * var(--space-4));
  z-index: var(--z-toast);
  pointer-events: none;
}
.ui-toast-stack.rx-toast-stack.ui-toast-stack--collapsed { pointer-events: auto; }
.rx-toast-stack > .ui-toast { pointer-events: auto; }

/* ----------------------------------------------------------------------------
 * Collapsed stack — several notices rest as one pile and fan out on hover or
 * focus, newest in front. Both positions are measured and published per card by
 * applyToastPile() in lib/toast-stack.ts; the switch between them is this
 * sheet's, so a hover never waits on a script and reduced motion reaches it
 * through the net like any other transition.
 * -------------------------------------------------------------------------- */
.ui-toast-stack--collapsed {
  position: relative;
  display: block;
  height: var(--toast-pile-height, auto);
  transition: height var(--dur-med) var(--ease);
}
.ui-toast-stack--collapsed:focus-visible { outline: var(--ring); outline-offset: var(--ring-offset); }
.ui-toast-stack--collapsed > .ui-toast {
  position: absolute;
  right: 0;
  bottom: 0;
  /* The front card is named, not assumed from paint order. */
  z-index: var(--toast-card-depth, auto);
  transform-origin: bottom center;
  /* `translate` and `scale`, not `transform`: the entrance keyframes own
     transform and `both` holds their last value after they finish, which would
     overwrite a pile offset written here. These two compose with it instead. */
  translate: 0 var(--toast-card-lift, 0px);
  scale: var(--toast-card-scale, 1);
  /* A back notice's box ends at or above the front notice's bottom edge.
     The box changes at the start of a move. Only translate and scale move;
     their endpoints both keep that edge above the front notice. The clip
     trims paint, but never has to keep pace with the move. */
  max-height: var(--toast-card-box, none);
  clip-path: inset(-100vmax var(--toast-card-clip, -100vmax) var(--toast-card-clip, -100vmax));
  transition: translate var(--dur-med) var(--ease), scale var(--dur-med) var(--ease);
}
.ui-toast-stack--collapsed:hover, .ui-toast-stack--collapsed:focus-within {
  height: var(--toast-fan-height, auto);
}
.ui-toast-stack--collapsed:hover > .ui-toast,
.ui-toast-stack--collapsed:focus-within > .ui-toast {
  translate: 0 var(--toast-card-fan, 0px);
  scale: 1;
  max-height: var(--toast-card-natural, none);
  clip-path: inset(-100vmax -100vmax var(--toast-card-fan-clip, -100vmax));
  transition: translate var(--dur-med) var(--ease), scale var(--dur-med) var(--ease);

/* Half of what opens a pile is hover. Where the reader has none, the plain
   column keeps every notice visible without one more stop on the page.
   The question is hover, not precision: `(pointer: coarse)` is the kit's field
   sizing net and answers a different one (stories/field-zoom.test.js).
   Each fanned state is named again rather than left to the shorter selector:
   a tap can still land focus inside the stack, and `:focus-within` above would
   otherwise hand a static card the offset it only has while absolute. This
   block therefore has to stay BELOW the rules it answers for. */

  .ui-toast-stack--collapsed:hover,
  .ui-toast-stack--collapsed:focus-within { display: flex; height: auto; }

  .ui-toast-stack--collapsed:hover > .ui-toast,
  .ui-toast-stack--collapsed:focus-within > .ui-toast { position: static; translate: none; scale: 1; max-height: none; clip-path: none; }

<style data-prototype="glue">
/* Prototype glue. It only places kit parts and uses kit tokens. */
.px-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2) var(--space-6);
  padding: var(--space-3) var(--space-4);

.px-bar__label { font-size: var(--text-sm); font-weight: var(--weight-medium); }
.px-bar__end { margin-inline-start: auto; }
.px-empty { display: grid; justify-items: start; gap: var(--space-3); }
.px-bar[hidden], .px-bar [hidden], .px-empty[hidden] { display: none; }
/* The kit's scroll frame keeps 4px at each side for its focus band. The offset puts the first column on the title's edge. */

html[data-motion="reduced"] *,
html[data-motion="reduced"] ::before,
html[data-motion="reduced"] ::after {

/* Direction A. The kit's timer line runs on an undo notice, in the kit's column.

<header class="px-bar" id="switches">

  </div>
  <div class="px-bar__group">

  <div class="ui-table-scroll px-table" id="table">

  </div>

<script>
(() => {
  const DUR = 8000;      // demo value: an undo notice lives 8 seconds
  const CAP = 3;         // direction A: a column of at most three
  const DATA = [
    ['Mercado Verde', '−€42.10', 'Groceries'],
    ['Tranvía Norte', '−€18.40', 'Transport'],
    ['Luz del Sur', '−€96.75', 'Utilities'],
    ['Farmacia Sol', '−€12.30', 'Health'],
    ['Café Nilo', '−€7.80', 'Dining'],
    ['Ferretería Industrial del Mediterráneo', '−€231.00', 'Repairs'],
  ];
  // Screens. The page opens one from the address hash, at load and on each change.
  const STATES = {
    'current-three': { look: 'current', seed: 3 },
    one: { seed: 1 },
    three: { seed: 3 },
    more: { seed: CAP, extra: true },
    long: { seed: 3, from: 3 },
    reduced: { seed: 3, motion: 'reduced' },
  };
  const GLYPH = {
    check: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/>',
    x: '<path d="M18 6L6 18M6 6l12 12" stroke-linecap="round"/>',
  };
  const glyph = name => '<span aria-hidden="true" style="display:inline-flex"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + GLYPH[name] + '</svg></span>';

  const root = document.documentElement;
  const stack = document.getElementById('stack');
  const tbody = document.getElementById('rows');
  const empty = document.getElementById('empty');
  const table = document.getElementById('table');
  const params = new URLSearchParams(location.search);
  const frozen = params.has('capture'); // a still capture: every timer holds part-way, and the switches hide
  const view = { look: 'proposed', motion: 'full', seed: 1, from: 0, extra: false };
  let rows = [];
  let notices = [];
  let nextId = 0;
  let stackHeld = false;
  let extraTimer = 0;

  const reduced = () => view.motion === 'reduced' || matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---- The table ---- */
  function renderTable(focusRow) {
    const open = rows.filter(row => !row.done);
    rows.forEach(row => { row.button = null; });
    tbody.replaceChildren(...open.map(row => {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td></td><td class="ui-table__num"></td><td><button type="button" class="ui-btn ui-btn--sm"></button></td>';
      tr.children[0].textContent = row.payee;
      tr.children[1].textContent = row.amount;
      const button = tr.querySelector('button');
      button.textContent = row.category;
      button.setAttribute('aria-label', 'Classify ' + row.payee + ' as ' + row.category);
      button.addEventListener('click', () => classify(row, true));
      row.button = button;
      return tr;
    }));
    table.hidden = !open.length;
    empty.hidden = !!open.length;
    // The pressed button is gone, so the focus goes to the row that takes its place.
    if (focusRow) (focusRow.button || open[open.length - 1]?.button || empty.querySelector('button')).focus();
  }

  function classify(row, byReader) {
    const after = rows.find(other => !other.done && other.index > row.index);
    row.done = true;
    renderTable(byReader && (after || row));
    push(row, DUR);
  }

  /* ---- A notice ---- */
  function build(notice) {
    const el = document.createElement('div');
    el.className = 'ui-toast ui-toast--success ui-toast--soft';
    el.setAttribute('role', 'status');
    el.setAttribute('aria-live', 'polite');
    let html = '<span class="ui-toast__icon">' + glyph('check') + '</span>'
      + '<div class="ui-toast__body"><div class="ui-toast__title"></div>'
      + '<span class="ui-sr">Undo is available for ' + DUR / 1000 + ' seconds.</span></div>'
      + '<span class="px-secs" aria-hidden="true"></span>';
    html += '<button type="button" class="ui-toast__action">Undo</button>'
      + '<button type="button" class="ui-toast__close" aria-label="Dismiss">' + glyph('x') + '</button>';
    html += '<span class="ui-toast__timer is-running" aria-hidden="true"></span>';
    el.innerHTML = html;
    el.querySelector('.ui-toast__title').textContent = notice.row.payee + ' set to ' + notice.row.category;
    el.querySelector('.ui-toast__action').addEventListener('click', () => {
      if (notice.leaving) return;
      dismiss(notice);
      notice.row.done = false;
      renderTable(notice.row);
    });
    el.querySelector('.ui-toast__close').addEventListener('click', () => dismiss(notice));
    return el;
  }

  function push(row, remaining) {
    const notice = { id: nextId++, row, remaining, started: 0, timer: 0, leaving: false };
    notice.el = build(notice);
    const line = notice.el.querySelector('.ui-toast__timer');
    if (line) { line.style.animationDuration = DUR + 'ms'; line.style.animationDelay = remaining - DUR + 'ms'; }
    notices.push(notice);
    stack.append(notice.el);
    // Above the cap, the oldest notice leaves at once. Its change stays.
    const live = notices.filter(other => !other.leaving);
    if (live.length > CAP) dismiss(live[0]);
    sync(notice);
    paint(notice);
  }

  function dismiss(notice) {
    if (notice.leaving) return;
    notice.leaving = true;
    hold(notice);
    const remove = () => {
      if (!notices.includes(notice)) return;
      notices = notices.filter(other => other !== notice);
      notice.el.remove();
      syncHeld();
    };
    if (reduced()) { remove(); return; }
    notice.el.classList.add('is-leaving');
    notice.el.querySelectorAll('button').forEach(button => { button.disabled = true; });
    notice.el.addEventListener('animationend', event => { if (event.target === notice.el) remove(); });
    setTimeout(remove, 260);
  }

  /* ---- Timers. The pointer or the focus anywhere in the stack holds every timer. ---- */
  function held() { return frozen || stackHeld; }
  const left = notice => notice.timer ? Math.max(0, notice.remaining - (performance.now() - notice.started)) : notice.remaining;
  function play(notice, value) {
    const line = notice.el.querySelector('.ui-toast__timer');
    if (line) line.style.animationPlayState = value;
  }
  function hold(notice) {
    if (notice.timer) {
      clearTimeout(notice.timer);
      notice.remaining = left(notice);
      notice.timer = 0;
    }
    play(notice, 'paused');
  }
  function run(notice) {
    if (notice.timer) return;
    notice.started = performance.now();
    notice.timer = setTimeout(() => dismiss(notice), notice.remaining);
    play(notice, 'running');
  }
  function sync(notice) {
    if (notice.leaving) return;
    if (held()) hold(notice); else run(notice);
  }
  function syncHeld() {
    const now = stack.matches(':hover') || stack.contains(document.activeElement);
    if (now === stackHeld) return;
    stackHeld = now;
    notices.forEach(sync);
  }
  for (const type of ['mouseover', 'mouseout', 'focusin', 'focusout']) stack.addEventListener(type, () => setTimeout(syncHeld));

  // The seconds change in place, one step at a time.
  function paint(notice) {
    const seconds = Math.max(1, Math.ceil(left(notice) / 1000)) + ' s';
    const secs = notice.el.querySelector('.px-secs');
    if (secs.textContent !== seconds) secs.textContent = seconds;
  }
  setInterval(() => { syncHeld(); notices.forEach(paint); }, 100);

  /* ---- Screens and the reviewer's switches ---- */
  function show() {
    clearTimeout(extraTimer);
    notices.forEach(notice => clearTimeout(notice.timer));
    notices = [];
    stack.replaceChildren();
    stackHeld = false;
    rows = DATA.map(([payee, amount, category], index) => ({ index, payee, amount, category, done: false }));
    root.dataset.motion = view.motion;
    stack.classList.toggle('px-line', view.look === 'proposed');
    const count = view.seed;
    // Each seeded notice is 2.4 s at most older than the next one.
    const step = count > 1 ? Math.min(2400, 4800 / (count - 1)) : 0;
    const newest = count > 1 || frozen ? 7400 : DUR;
    for (let index = 0; index < count; index += 1) {
      const row = rows[view.from + index];
      row.done = true;
      push(row, count > 1 ? newest - (count - 1 - index) * step : frozen ? 5000 : newest);
    }
    renderTable();
    if (view.extra && !frozen) extraTimer = setTimeout(() => classify(rows[count]), 1500);
    mark();
  }
  function mark() {
    document.querySelectorAll('[data-set]').forEach(button => {
      const [key, value] = button.dataset.set.split(':');
      const on = key === 'theme' ? root.dataset.theme === value : view[key] === value;
      button.setAttribute('aria-pressed', String(on));
    });
  }
  function open() {
    const state = STATES[location.hash.slice(1)] || STATES.one;
    Object.assign(view, { look: 'proposed', motion: 'full', from: 0, extra: false }, state);
    show();
  }
  document.querySelectorAll('[data-set]').forEach(button => button.addEventListener('click', () => {
    const [key, value] = button.dataset.set.split(':');
    if (key === 'theme') root.dataset.theme = value; else { view[key] = value; show(); }
  }));
  document.querySelectorAll('[data-replay]').forEach(button => button.addEventListener('click', show));
  // The review frame sets the theme and draws its own theme button.
  const theme = params.get('theme');
  if (theme === 'light' || theme === 'dark') root.dataset.theme = theme;
  const accent = params.get('accent');
  if (['phoenix', 'ocean', 'emerald'].includes(accent)) root.dataset.accent = accent;
  if (window.self === window.top) document.getElementById('theme-group').hidden = false;
  document.getElementById('switches').hidden = frozen;
  if (frozen) root.dataset.capture = '';
  new MutationObserver(mark).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
  addEventListener('hashchange', open);
  open();
})();
</script>
</body>
</html>
