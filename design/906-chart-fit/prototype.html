/* The review shell uses kit tokens. Dimensions below describe chart geometry. */
.review { padding: var(--space-4); display: grid; gap: var(--space-6); }
.review-title { font-size: var(--text-xl); font-weight: var(--weight-semibold); line-height: var(--leading-tight); color: var(--strong); }
.review-head { display: flex; gap: var(--space-4); align-items: center; justify-content: space-between; flex-wrap: wrap; }
.review-copy { max-width: var(--prose-body); }
.review-controls { display:flex; flex-wrap:wrap; gap:var(--space-4); align-items:end; }
.review-field { display:grid; gap:var(--space-1); }
.compare { display: grid; gap: var(--space-6); grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr)); }
.sample { min-width: 0; display:grid; grid-template-rows:subgrid; grid-row:span 3; row-gap:var(--space-2); align-content:start; }
.sample-label { font-size:var(--text-md); font-weight:var(--weight-semibold); }
.sample-note { max-width:var(--prose-caption); }
.card-slot { min-width:0; padding-inline:var(--space-6); }
.card-size { width:min(100%, 390px); }
.chart-size { width:100%; }
.chart-size .ui-chart__frame { grid-template-columns:auto minmax(0,300px); }
.review-section { display:grid; gap:var(--space-4); }
.review-section-title { font-size:var(--text-lg); font-weight:var(--weight-semibold); }
.plot-proposal { width: min(100%,300px); position:relative; }
.signed-svg { display:block; width:100%; height:auto; overflow:visible; }
.signed-name { font-family:var(--font-sans); font-size:var(--text-xs); fill:var(--text); }
.signed-caption { font-family:var(--font-sans); font-size:var(--text-xs); fill:var(--muted); }
.signed-bar { fill:var(--chart-accent); }
.signed-total { fill:var(--chart-neutral); }
.signed-down { fill:var(--chart-bad); }
.signed-up { fill:var(--chart-good); }
.signed-hit { fill:transparent; }
.signed-grid { stroke:var(--border); stroke-width:1; }
.signed-zero { stroke:var(--border-strong); stroke-width:1; }
.signed-hover { fill:var(--surface-3); }
.proposal-focus:focus-visible { outline:var(--ring); outline-offset:var(--ring-offset); border-radius:var(--radius-xs); }
.point-tip { position:absolute; z-index:2; padding:var(--space-2) var(--space-3); background:var(--bg-elevated); color:var(--text); border:1px solid var(--float-edge); border-radius:var(--radius-md); box-shadow:inset 0 0 0 1px var(--float-edge-inner), var(--elev-drop); font-size:var(--text-xs); max-width:100%; pointer-events:none; }
.prototype-table { width:100%; }
.prototype-table th { text-align:left; }
.prototype-table td { white-space:normal; }
.rules { display:grid; gap:var(--space-3); max-width:var(--prose-body); }
.rules-title { font-size:var(--text-md); }
.review-rule-list { padding-left:var(--space-5); }
@media(max-width: 860px){ .compare { grid-template-columns:minmax(0,1fr); } }
@media(max-width: 560px){ .review { padding:var(--space-3); } .card-slot {padding-inline:var(--space-3);} }
