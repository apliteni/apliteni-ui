.ui-datepicker__opt.is-selected:hover:not(:focus-visible) {
  outline-color: transparent;
  background: var(--accent-strong);
  color: var(--accent-contrast);
}
.ui-datepicker__opt.is-today {
  border-color: var(--accent);
}
.ui-datepicker__opt.is-today:hover:not(:focus-visible) {
  outline-color: transparent;
}
.ui-datepicker__opt.is-selected.is-today {
  border-color: var(--accent-contrast);
}
.ui-datepicker__opt.is-today:focus-visible {
  border-color: transparent;
}
.ui-datepicker__opt.is-disabled {
  color: var(--disabled-ink-bare);
  cursor: not-allowed;
}
.ui-datepicker__opt.is-disabled .ui-datepicker__num {
  text-decoration: line-through;
}
.ui-datepicker__opt.is-disabled:hover {
  background: transparent;
  border-color: transparent;
  color: var(--disabled-ink-bare);
}
.ui-datepicker__opt.is-disabled:hover:not(:focus-visible) {
  outline-color: transparent;
}
.ui-datepicker__opt.is-disabled.is-selected,
.ui-datepicker__opt.is-disabled.is-selected:hover,
.ui-datepicker__opt.is-disabled.is-inside,
.ui-datepicker__opt.is-disabled.is-inside:hover {
  background: transparent;
  border-color: transparent;
  color: var(--disabled-ink-bare);
}
.ui-datepicker__opt.is-disabled.is-selected {
  font-weight: var(--weight-bold);
}
.ui-datepicker__opt.is-disabled.is-today,
.ui-datepicker__opt.is-disabled.is-today:hover {
  border-color: var(--accent);
}
.ui-datepicker__presets {
  display: grid;
  align-content: start;
  gap: var(--space-1);
  padding: 0 var(--space-3) 0 0;
  border-inline-end: 1px solid var(--border);
}
.ui-datepicker__preset {
  justify-content: flex-start;
}
.ui-datepicker__body.is-sheet {
  flex-direction: column;
  align-items: stretch;
}
.ui-datepicker__body.is-sheet .ui-datepicker__presets {
  grid-auto-flow: column;
  grid-auto-columns: max-content;
  overflow-x: auto;
  scroll-padding-inline: var(--space-1);
  padding: var(--space-3) var(--space-1);
  border-inline-end: 0;
  border-block-end: 1px solid var(--border);
}
.ui-datepicker__body.is-sheet .ui-datepicker__presets:focus-visible,
.ui-datepicker__panel .ui-datepicker__presets:focus-visible {
  outline: var(--ring-scroll);
  outline-offset: var(--ring-scroll-offset);
}
.ui-datepicker__body.is-sheet .ui-datepicker__opt {
  scroll-margin-bottom: var(--space-5);
}
@media (max-width: 560px) {
  .ui-dropdown__panel.ui-datepicker__panel {
    --ui-dropdown-edge: 8px;
    width: var(--ui-dropdown-ceiling, calc(100vw - 16px));
    max-width: none;
  }
  .ui-datepicker__panel .ui-datepicker__body {
    flex-direction: column;
    align-items: stretch;
  }
  .ui-datepicker__panel .ui-datepicker__presets {
    grid-auto-flow: column;
    grid-auto-columns: max-content;
    overflow-x: auto;
    scroll-padding-inline: var(--space-1);
    padding: var(--space-3) var(--space-1);
    border-inline-end: 0;
    border-block-end: 1px solid var(--border);
  }
}

/* src/ProposedValue.css */
.ui-proposed {
  display: inline-flex;
  align-items: center;
  gap: var(--space-3);
  min-width: 0;
  max-width: 100%;
}
.ui-proposed__value {
  display: inline-flex;
  align-items: center;
  min-width: 0;
  padding: 7.2px 0 7.2px 13px;
  border: 1px solid transparent;
  font-size: var(--text-sm);
  line-height: var(--leading-tight);
  white-space: nowrap;
}
.ui-proposed__text {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  background-image:
    linear-gradient(
      90deg,
      var(--accent),
      var(--chip-info-ink));
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.ui-proposed__acts {
  display: inline-flex;
  flex: none;
  align-items: center;
  gap: var(--space-2);
}
.ui-field > .ui-proposed {
  display: flex;
  width: fit-content;
  margin-inline-start: calc(var(--space-4) * -1);
  max-width: calc(100% + var(--space-4));
}
.ui-field > .ui-proposed > .ui-proposed__value {
  padding: var(--space-3) 0 var(--space-3) var(--space-4);
  font-size: var(--text-base);
  line-height: normal;
}
.ui-table td > .ui-proposed:first-child {
  vertical-align: top;
  margin-inline-start: -13px;
  margin-block: calc((var(--ui-cell-line) - var(--btn-height-sm)) / 2);
}
.ui-table td > .ui-proposed > .ui-proposed__value {
  flex: none;
  max-width: 12rem;
}
@media (pointer: coarse) {
  .ui-field > .ui-proposed > .ui-proposed__value {
    font-size: 16px;
  }
}
@media (max-width: 560px) {
  .ui-field > .ui-proposed {
    margin-inline-start: calc(var(--space-3) * -1);
    max-width: calc(100% + var(--space-3));
  }
  .ui-field > .ui-proposed > .ui-proposed__value {
    padding-inline-start: var(--space-3);
  }
}
@media (forced-colors: active) {
  .ui-proposed__text {
    -webkit-text-fill-color: CanvasText;
    background-image: none;
  }
  .ui-proposed__value {
    border: 1px dashed CanvasText;
    border-radius: var(--radius-pill);
    padding-inline-end: var(--space-3);
  }
}

/* src/KeyValueList.css */
.ui-kv {
  display: grid;
  column-gap: var(--space-4);
  margin: 0;
  grid-template-columns: calc(var(--space-6) * 5) minmax(0, 1fr);
}
.ui-kv--two-columns {
  grid-template-columns: repeat(2, calc(var(--space-6) * 5) minmax(0, 1fr));
}
.ui-kv__hidden {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  color: var(--text);
}
.ui-kv__hidden svg {
  width: var(--space-4);
  height: var(--space-4);
  stroke-width: 2.25;
}
@media (max-width: 560px) {
  .ui-kv--two-columns {
    grid-template-columns: minmax(0, 1fr);
    row-gap: var(--space-3);
  }
  .ui-kv--two-columns > .ui-drawer__row {
    display: block;
  }
}

/* src/Timeline.css */
.ui-timeline {
  margin: 0;
  padding: 0;
  list-style: none;
  color: var(--text);
  font-size: var(--text-sm);
  line-height: 1.5;
}
.ui-timeline__event {
  position: relative;
  padding-inline-start: var(--space-6);
  padding-block-end: var(--space-6);
  overflow-wrap: anywhere;
}
.ui-timeline__event:last-child {
  padding-block-end: 0;
}
.ui-timeline__event::before {
  content: "";
  position: absolute;
  inset-inline-start: calc(var(--space-2) / 2);
  inset-block-start: 0.75em;
  inset-block-end: -0.75em;
  width: 1px;
  background: var(--border);
}
.ui-timeline__event:last-child::before {
  display: none;
}
.ui-timeline__marker {
  position: absolute;
  inset-inline-start: 0;
  inset-block-start: calc(0.75em - var(--space-2) / 2);
  width: var(--space-2);
  height: var(--space-2);
  border-radius: 50%;
  background: var(--accent);
}
.ui-timeline__head,
.ui-timeline__meta {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  column-gap: var(--space-3);
  row-gap: var(--space-1);
}
.ui-timeline__actor {
  font-weight: var(--weight-semibold);
}
.ui-timeline__head time,
.ui-timeline__meta {
  font-size: var(--text-xs);
}
.ui-timeline__relative {
  color: var(--accent);
  font-size: var(--text-xs);
}
.ui-timeline__description {
  margin: var(--space-1) 0;
}
.ui-timeline__undo {
  white-space: normal;
}
.ui-timeline__undo:hover,
.ui-timeline__undo:focus-visible {
  color: var(--pink);
}
.ui-timeline--kinds .ui-timeline__event {
  padding-inline-start: var(--space-8);
}
.ui-timeline--kinds .ui-timeline__event::before {
  inset-inline-start: calc(var(--space-5) / 2);
}
.ui-timeline--kinds .ui-timeline__marker {
  inset-inline-start: calc((var(--space-5) - var(--space-2)) / 2);
  background: var(--muted);
}
.ui-timeline--kinds .ui-timeline__event:last-child .ui-timeline__marker {
  background: var(--accent);
}
.ui-timeline--kinds .ui-timeline__marker--kind {
  display: flex;
  align-items: center;
  justify-content: center;
  inset-inline-start: 0;
  inset-block-start: calc(0.75em - var(--space-5) / 2);
  width: var(--space-5);
  height: var(--space-5);
  border: 1px solid var(--muted);
  background: var(--surface);
  color: var(--muted);
}
.ui-timeline--kinds .ui-timeline__marker--reversal {
  color: var(--pink);
}
.ui-timeline__marker--kind svg {
  width: var(--space-3);
  height: var(--space-3);
}
.ui-timeline--kinds .ui-timeline__event:last-child .ui-timeline__marker--kind {
  border-color: var(--accent-strong);
  background: var(--accent-strong);
  color: var(--accent-contrast);
}
.ui-timeline--kinds .ui-timeline__event:last-child .ui-timeline__marker--reversal {
  border-color: var(--pink);
  background: var(--pink);
  color: var(--danger-contrast);
}
.ui-timeline__event.is-entering {
  --m-dist: var(--space-2);
  animation: m-slide-up var(--dur-slow) var(--ease-out) both;
}
.ui-timeline__marker.is-entering {
  animation: m-scale-in var(--dur-med) var(--ease-out) var(--delay-1) both;
}

/* src/Wizard.css */
.ui-wizard {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  margin: 0;
  padding: 0;
  list-style: none;
  font-family: var(--font-sans);
}
.ui-wizard .ui-wizard__step {
  display: grid;
  grid-template-columns: var(--space-6) minmax(0, 1fr);
  gap: var(--space-2);
  align-items: start;
  color: var(--text);
}
.ui-wizard .ui-wizard__step.is-active {
  background: color-mix(in srgb, var(--accent) 14%, var(--surface));
}
.ui-wizard__text {
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow-wrap: anywhere;
}
.ui-wizard__state {
  font-size: var(--text-sm);
  font-weight: var(--weight-normal);
}
.ui-wizard__mark {
  box-sizing: border-box;
  display: grid;
  place-items: center;
  width: var(--space-4);
  height: var(--space-4);
  margin: calc((var(--space-6) - var(--space-4)) / 2);
  border-radius: 50%;
}
.ui-wizard__mark--todo {
  border: 1.5px solid var(--muted);
}
.ui-wizard__mark--current {
  border: 1.5px solid var(--accent);
}
.ui-wizard__mark--current::after {
  content: "";
  width: var(--space-1);
  height: var(--space-1);
  border-radius: 50%;
  background: var(--accent);
}
.ui-wizard__mark--done {
  background: var(--chip-neutral-fill);
  color: var(--signal-solid-success);
}
.ui-wizard__mark--blocked {
  color: var(--signal-solid-danger);
}
.ui-wizard__mark > span {
  display: grid;
}
.ui-wizard__mark--done svg {
  width: var(--space-3);
  height: var(--space-3);
  stroke-width: 3;
}
.ui-wizard__mark--blocked svg {
  width: var(--space-5);
  height: var(--space-5);
  stroke-width: 1.8;
}
.ui-wizard__panel,
.ui-wizard__final {
  display: flex;
  flex-direction: column;
  align-items: start;
  gap: var(--space-2);
  margin-inline: calc(var(--space-3) + var(--space-6) + var(--space-2)) var(--space-3);
  padding-block: var(--space-2);
}
.ui-wizard__panel[hidden] {
  display: none;
}
.ui-wizard__panel:empty {
  display: none;
}
.ui-wizard__panel p,
.ui-wizard__reason {
  margin: 0;
  max-width: var(--prose-caption);
  color: var(--text);
  font-size: var(--text-base);
  line-height: 1.5;
}
@media (max-width: 560px) and (pointer: coarse) {
  .ui-wizard,
  .ui-wizard__panel,
  .ui-wizard__final {
    gap: var(--tap-gap);
    --tap-clear-y: var(--tap-gap);
  }
}

/* src/Field.css */
.ui-field-number {
  display: flex;
  align-items: center;
  position: relative;
}
.ui-field-number .ui-input {
  padding-right: 4.5em;
}
.ui-field-number__unit {
  position: absolute;
  right: 15px;
  color: var(--text);
  pointer-events: none;
}
.ui-file {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 24px;
  border: 1px dashed var(--field-edge);
  border-radius: var(--radius-md);
  background: var(--field-bg);
  color: var(--text);
  font-size: var(--text-base);
  text-align: center;
  overflow-wrap: anywhere;
}
.ui-file:hover {
  border-color: var(--field-edge-hover);
}
.ui-file.is-dragging {
  border-color: var(--accent);
}
.ui-file:focus-within,
.ui-file.is-dragging {
  outline: var(--ring);
  outline-offset: var(--ring-offset);
}
.ui-file.is-invalid {
  border-color: var(--pink);
}
.ui-file__glyph {
  display: flex;
  padding: 12px;
  border-radius: var(--radius-md);
  background: var(--surface-3);
}
.ui-file__glyph svg {
  width: 24px;
  height: 24px;
}
.ui-file__choose {
  position: relative;
  display: inline-flex;
  margin-top: 8px;
}
.ui-file__input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  cursor: pointer;
}
.ui-file.is-disabled {
  background: var(--disabled-surface);
  border-color: var(--disabled-border);
  color: var(--disabled-ink);
}
.ui-file.is-disabled .ui-file__input {
  cursor: not-allowed;
}

/* ../src/styles/file-drop.css */
.ui-drop {
  position: relative;
}
.ui-drop:not(.ui-drop--area) {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
}
.ui-drop > * + .ui-drop__row {
  margin-top: var(--space-3);
}
.ui-drop__row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  min-height: var(--space-8);
  gap: var(--space-2) var(--space-3);
  font-size: var(--text-sm);
  color: var(--text);
  overflow-wrap: anywhere;
  container-type: inline-size;
  contain-intrinsic-inline-size: var(--panel-md);
}
.ui-drop__note {
  margin: 0;
}
.ui-drop__file {
  display: flex;
  flex: 1 1 auto;
  align-items: flex-start;
  gap: var(--space-3);
  min-width: 0;
}
.ui-drop__line {
  display: flex;
  flex: 1 1 0;
  flex-wrap: nowrap;
  align-items: center;
  gap: var(--space-2) var(--space-3);
  min-width: 0;
}
.ui-drop__file--failed .ui-drop__line {
  flex-wrap: wrap;
}
.ui-drop__name {
  display: flex;
  flex: 0 999 auto;
  align-items: center;
  min-width: var(--space-10);
  min-height: var(--space-8);
  color: var(--strong);
  font-weight: var(--weight-medium);
}
.ui-drop__stem {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ui-drop__ext {
  flex: none;
  white-space: nowrap;
}
.ui-drop__size {
  flex: none;
  white-space: nowrap;
}
.ui-drop__word {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 0 1 auto;
  min-width: 0;
}
@container (width <= 352px) {
  .ui-drop__size {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
}
.ui-drop__state {
  display: inline-flex;
  flex: none;
  align-items: center;
  gap: var(--space-2);
  min-width: 0;
  max-width: calc(100% - var(--space-10) - var(--space-3));
}
.ui-drop__file--failed .ui-drop__state {
  max-width: 100cqw;
}
.ui-drop__state svg {
  width: 16px;
  height: 16px;
  flex: none;
  stroke-width: 2.4;
}
.ui-drop__error {
  color: var(--pink);
}
.ui-drop__actions {
  display: flex;
  flex: none;
  align-items: stretch;
  gap: var(--space-2);
  margin-left: auto;
}
.ui-drop__bar {
  display: block;
  flex: 1 1 0;
  min-width: var(--space-12);
  height: 6px;
  border-radius: var(--radius-pill);
  background: var(--surface-2);
  overflow: hidden;
}
.ui-drop__bar span {
  display: block;
  height: 100%;
  background: var(--accent);
}
.ui-drop__target {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-3);
  border: 1px dashed var(--accent);
  border-radius: var(--radius-md);
  background: var(--surface);
  color: var(--strong);
  font-size: var(--text-sm);
  text-align: center;
}
.ui-drop.is-disabled .ui-drop__row {
  color: var(--disabled-ink);
}
.ui-drop.is-disabled .ui-drop__name {
  color: var(--disabled-ink);
}
.ui-drop--area {
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-lg);
  padding: var(--space-4);
}
.ui-drop--area.is-dragging {
  border-color: var(--accent);
}
@media (max-width: 560px) {
  .ui-drop--area {
    padding: var(--space-3);
  }
}
.ui-drop--page {
  position: fixed;
  inset: calc(var(--ui-app-band, 0px) + var(--ui-app-top, 0px) + var(--space-4)) var(--space-4) var(--space-4);
  z-index: var(--z-overlay);
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  background: var(--bg);
}
@supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)) {
  .ui-drop--page {
    background: color-mix(in srgb, var(--bg) 80%, transparent);
    -webkit-backdrop-filter: blur(var(--space-2));
    backdrop-filter: blur(var(--space-2));
  }
}
@media (prefers-reduced-transparency: reduce) {
  .ui-drop--page {
    background: var(--bg);
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
  }
}

/* src/Toast.css */
.ui-toast-stack.rx-toast-stack {
  position: fixed;
  right: var(--space-4);
  bottom: var(--space-4);
  max-width: calc(100% - 2 * var(--space-4));
  z-index: var(--z-toast);
  pointer-events: none;
}
.ui-toast-stack.rx-toast-stack.ui-toast-stack--collapsed {
  pointer-events: auto;
}
.ui-toast-stack.rx-toast-stack.rx-toast-stack--scroll {
  top: var(--space-4);
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior: contain;
  pointer-events: auto;
}
.ui-toast-stack.rx-toast-stack.rx-toast-stack--scroll:focus-visible {
  outline: var(--ring-scroll);
  outline-offset: var(--ring-scroll-offset);
}
.rx-toast-stack > .ui-toast {
  pointer-events: auto;
  flex: none;
}
.ui-toast-stack--collapsed {
  position: relative;
  display: block;
  height: var(--toast-pile-height, auto);
  transition: height var(--dur-med) var(--ease);
}
.ui-toast-stack--collapsed:focus-visible {
  outline: var(--ring);
  outline-offset: var(--ring-offset);
}
.ui-toast-stack--collapsed > .ui-toast {
  position: absolute;
  right: 0;
  bottom: 0;
  z-index: var(--toast-card-depth, auto);
  transform-origin: bottom center;
  translate: 0 var(--toast-card-lift, 0px);
  scale: var(--toast-card-scale, 1);
  max-height: var(--toast-card-box, none);
  clip-path: inset(-100vmax var(--toast-card-clip, -100vmax) var(--toast-card-clip, -100vmax));
  transition: translate var(--dur-med) var(--ease), scale var(--dur-med) var(--ease);
}
.ui-toast-stack--collapsed:hover,
.ui-toast-stack--collapsed:focus-within {
  height: var(--toast-fan-height, auto);
}
.ui-toast-stack--collapsed:hover > .ui-toast,
.ui-toast-stack--collapsed:focus-within > .ui-toast {
  translate: 0 var(--toast-card-fan, 0px);
  scale: 1;
  max-height: var(--toast-card-natural, none);
  clip-path: inset(-100vmax -100vmax var(--toast-card-fan-clip, -100vmax));
  transition: translate var(--dur-med) var(--ease), scale var(--dur-med) var(--ease);
}
@media (hover: none) {
  .ui-toast-stack--collapsed,
  .ui-toast-stack--collapsed:hover,
  .ui-toast-stack--collapsed:focus-within {
    display: flex;
    height: auto;
  }
  .ui-toast-stack--collapsed > .ui-toast,
  .ui-toast-stack--collapsed:hover > .ui-toast,
  .ui-toast-stack--collapsed:focus-within > .ui-toast {
    position: static;
    translate: none;
    scale: 1;
    max-height: none;
    clip-path: none;
  }

  .ui-columns[data-depth="2"] > .ui-columns__col--2,
  .ui-columns[data-depth="3"] > .ui-columns__col--3 {
    display: flex;
  }
  .ui-columns__scroll {
    overflow-y: visible;
  }
  .ui-columns__head,
  .ui-columns__body {
    padding-inline: var(--space-4);
  }
  .ui-columns__list {
    padding-inline: var(--space-1);
  }
}
@media (max-width: 560px) and (pointer: coarse) {
  .ui-columns__list > .ui-nav__list {
    gap: var(--tap-gap);
    --tap-clear-y: var(--tap-gap);
  }
  .ui-columns__head {
    --tap-clear-y: var(--space-3);
  }
  .ui-columns__head .ui-columns__menu {
    position: relative;
  }
  .ui-columns__list .ui-nav__item::after,
  .ui-columns__head .ui-columns__menu::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    height: min(max(100%, var(--tap-min)), calc(100% + var(--tap-clear-y)));
  }
}

/* src/SplitLayout.css */
.ui-split {
  display: grid;
  grid-template-columns: var(--ui-split-primary, minmax(0, 3fr)) minmax(0, 2fr);
  grid-template-rows: minmax(0, 1fr) auto;
  height: calc(100dvh - var(--ui-app-band, 0px));
}
.ui-split--resizable {
  grid-template-columns: var(--ui-split-primary, clamp(320px, 60%, min(860px, 100% - 320px))) minmax(0, 1fr);
}
.ui-split__primary {
  grid-area: 1 / 1;
  min-width: 0;
  overflow-y: auto;
  padding: var(--space-8);
}
.ui-split,
.ui-split__primary,
.ui-split__stage {
  position: relative;
}
.ui-split:focus-visible,
.ui-split__primary:focus-visible,
.ui-split__stage:focus-visible {
  outline: var(--ring-scroll);
  outline-offset: var(--ring-scroll-offset);
}
.ui-split__content,
.ui-split__row {
  max-width: var(--measure);
  margin-inline: auto;
}
.ui-split__content {
  --tap-clear-x: var(--space-5);
  --tap-clear-y: var(--space-5);
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}
.ui-split .ui-split__content > * {
  margin-block: 0;
}
.ui-split__content .ui-kv dd,
.ui-split__content .ui-table td:not(.ui-table__num--strong) {
  font-weight: var(--weight-medium);
}
.ui-split__content .ui-table tbody th:not(.ui-table__num--strong) {
  font-weight: var(--weight-normal);
}
.ui-split__name {
  color: var(--accent);
}
.ui-split__preview {
  grid-area: 1 / 2 / 3 / 3;
  position: relative;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  border-inline-start: 1px solid var(--border);
}
.ui-split__controls {
  flex: none;
  margin: var(--space-6) var(--space-6) 0;
  background: var(--bg);
}
.ui-split__controls > h2 {
  margin: 0;
  padding: var(--space-4) var(--space-4) var(--space-2);
}
.ui-split__tools {
  --tap-clear-x: var(--space-3);
  --tap-clear-y: var(--space-4);
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-4);
  border-bottom: 1px solid var(--border);
}
.ui-split__tools > .ui-btn[aria-pressed=true]:enabled,
.ui-split__tools > .ui-btn[aria-pressed=true]:enabled:hover {
  background: var(--surface-3);
  color: var(--strong);
  font-weight: var(--weight-semibold);
}
@media (forced-colors: active) {
  .ui-split__tools > .ui-btn[aria-pressed=true]:enabled {
    forced-color-adjust: none;
    background: Highlight;
    color: HighlightText;
    --ring: var(--ring-width) solid CanvasText;
  }
}
.ui-split__scale {
  min-width: 4ch;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.ui-split__stage {
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
  padding: var(--space-6);
}
.ui-split__sheet {
  width: var(--panel-md);
  margin-inline: auto;
}
.ui-split__sheet .ui-skel + .ui-skel {
  margin-top: var(--space-5);
}
.ui-split__empty {
  background: var(--bg);
}
.ui-split__actions {
  --tap-clear-x: var(--space-3);
  --tap-clear-y: var(--space-4);
  grid-area: 2 / 1;
  padding: var(--space-4) var(--space-8);
  background: var(--bg);
  border-top: 1px solid var(--border);
}
.ui-split__row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
}
@media (max-width: 860px) {
  .ui-split {
    display: block;
    overflow-y: auto;
    scroll-padding-bottom: calc(var(--ui-split-foot, 0px) + var(--ring-gap-width) + var(--ring-width));
  }
  .ui-split__primary {
    overflow: visible;
    padding: var(--space-6);
  }
  .ui-split__preview {
    border-inline-start: 0;
  }
  .ui-split__controls {
    position: sticky;
    top: 0;
    z-index: var(--z-sticky);
    padding-top: calc(var(--ring-offset) + var(--ring-width));
  }
  .ui-split__controls > h2 {
    padding-top: calc(var(--space-4) - var(--ring-offset) - var(--ring-width));
  }
  .ui-split__stage {
    flex: none;
    height: clamp(var(--space-16), calc(100dvh - var(--ui-app-band, 0px) - 3 * var(--space-16)), 65dvh);
  }
  .ui-split__actions {
    position: sticky;
    bottom: 0;
    z-index: var(--z-sticky);
    padding: var(--space-3) var(--space-6) calc(var(--space-3) + env(safe-area-inset-bottom));
  }
  .ui-split__preview > .ui-resizer {
    display: none;
  }
}
@media (max-width: 560px) {
  .ui-split__primary {
    padding: var(--space-6) var(--space-4);
  }
  .ui-split__content {
    gap: var(--space-5);
  }
  .ui-split__controls {
    margin-inline: var(--space-4);
  }
  .ui-split__stage {
    padding: var(--space-4);
  }
  .ui-split__actions {
    padding-inline: var(--space-4);
  }
  .ui-split__row > .ui-btn {
    flex: 1 1 100%;
  }
}

/* src/ThemeChoice.css */
.ui-theme-choice {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--space-3);
  margin-inline: calc(-1 * var(--space-2));
}
.ui-theme-choice__option {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-2);
  min-width: 0;
  padding: var(--space-2);
  border-radius: var(--radius-lg);
  color: var(--text);
  cursor: pointer;
}
.ui-theme-choice__pic {
  position: relative;
  display: block;
  container-type: inline-size;
  width: 100%;
  aspect-ratio: 2 / 1.1;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  transition: transform var(--dur-fast) var(--ease);
}
.ui-theme-choice__option:not(:has(:checked)):hover {
  background: color-mix(in srgb, var(--surface-3) 50%, transparent);
  color: var(--strong);
}
.ui-theme-choice__option:has(:checked) {
  background: var(--surface-3);
  color: var(--strong);
  font-weight: var(--weight-semibold);
}
.ui-theme-choice__option:has(.ui-theme-choice__input:focus-visible) {
  outline: var(--ring);
  outline-offset: var(--ring-offset);
}
.ui-theme-choice__option:active .ui-theme-choice__pic {
  transform: translateY(1px);
}
.ui-theme-choice__name {
  overflow-wrap: anywhere;
  text-align: center;
}
.ui-theme-choice__scene {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: 24% minmax(0, 1fr);
  background: var(--bg);
}
.ui-theme-choice__scene + .ui-theme-choice__scene {
  clip-path: inset(0 0 0 50%);
}
.ui-theme-choice__rail {
  display: flex;
  flex-direction: column;
  gap: 4cqi;
  padding: 8cqi 5cqi;
  border-inline-end: 1px solid var(--border);
  background: var(--surface);
}
.ui-theme-choice__main {
  display: flex;
  flex-direction: column;
  gap: 5cqi;
  padding: 8cqi 7cqi;
}
.ui-theme-choice__title {
  width: 40%;
  height: 3cqi;
  border-radius: 2cqi;
  background: var(--strong);
}
.ui-theme-choice__card {
  display: flex;
  flex: 1;
  flex-direction: column;
  justify-content: center;
  gap: 4cqi;
  padding-inline: 7cqi;
  border: 1px solid var(--border);
  border-radius: 4cqi;
  background: var(--surface);
}
.ui-theme-choice__rail > span,
.ui-theme-choice__card > span {
  height: 2cqi;
  border-radius: 1cqi;
  background: var(--text);
}
.ui-theme-choice__rail > span,
.ui-theme-choice__card > span + span {
  background: var(--muted);
}
.ui-theme-choice__card > span + span {
  width: 55%;
}
@media (forced-colors: active) {
  .ui-theme-choice__pic {
    forced-color-adjust: none;
  }
  .ui-theme-choice__input:checked ~ .ui-theme-choice__name {
    forced-color-adjust: none;
    padding-inline: var(--space-2);
    border-radius: var(--radius-sm);
    background: Highlight;
    color: HighlightText;
  }
}
