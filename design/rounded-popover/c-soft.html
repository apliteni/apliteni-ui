:root {

  --purple-900: #4c1f94;
  --purple-700: #6a2dcc;
  --purple-500: #9b5dff;
  --purple-400: #b479ff;
  --cyan-500:   #20dcf5;

  --radius-xs: 6px;
  --radius-sm: 9px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 18px;
  --radius-2xl: 24px;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;

  --text-2xl:  30px;
  --text-3xl:  40px;
  --text-4xl:  56px;

  --weight-light: 300;
  --weight-normal: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;

  --leading-tight: 1.2;
  --leading-snug: 1.4;
  --leading-normal: 1.62;

  --tracking-tight: -0.01em;
  --tracking-normal: 0;
  --tracking-wide: 0.04em;
  --tracking-caps: 0.14em;


  --ease: var(--easing-ease-in-out, cubic-bezier(0.4, 0, 0.2, 1));
  --ease-out: var(--easing-ease-out, cubic-bezier(0, 0, 0.2, 1));
  --ease-in: var(--easing-ease-in, cubic-bezier(0.4, 0, 1, 1));
  --ease-sharp: var(--easing-sharp, cubic-bezier(0.4, 0, 0.6, 1));
  --ease-spring: var(--easing-spring, cubic-bezier(0.34, 1.56, 0.64, 1));

  --dur-fast: var(--duration-fast, 0.15s);

  --delay-1: 60ms;
  --delay-2: 120ms;
  --delay-3: 180ms;
  --delay-4: 240ms;
  --delay-5: 300ms;


  --z-base: 1;
  --z-sticky: 10;
  --z-dropdown: 30;
  --z-overlay: 100;
  --z-toast: 200;

*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-weight: var(--weight-normal);

  font-size: var(--text-base);
  line-height: var(--leading-normal);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

::selection {
  background: color-mix(in srgb, var(--accent) 30%, transparent);
  color: var(--strong);
}

a {
  color: var(--accent);
  text-decoration: none;
}


.ui-link--quiet { color: inherit; }
.ui-link--quiet:hover { text-decoration: underline; }


h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-display);
}


b,
strong {
  font-weight: var(--weight-semibold);
}


.ui-glow {
  position: absolute;
  border-radius: 50%;
  filter: blur(100px);
  opacity: 0.5;
  pointer-events: none;
  z-index: 0;
  width: 420px;
  height: 420px;
}
.ui-glow--purple { background: radial-gradient(circle, var(--purple-light), transparent 70%); }
.ui-glow--green  { background: radial-gradient(circle, var(--green), transparent 70%); opacity: 0.28; }
.ui-glow--cyan   { background: radial-gradient(circle, var(--cyan), transparent 70%); opacity: 0.3; }


[class*="ui-bg-"] { position: relative; }
[class*="ui-bg-"] > * { position: relative; z-index: 1; }
[class*="ui-bg-"]::before { content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none; }


.ui-bg-spotlight::before {
  background: radial-gradient(620px 340px at 50% -12%, var(--glow-purple), transparent 70%);
}

.ui-bg-grid::before {
  background-image:
    linear-gradient(to right, var(--border) 1px, transparent 1px),
    linear-gradient(to bottom, var(--border) 1px, transparent 1px);
  background-size: 34px 34px;
  -webkit-mask-image: radial-gradient(circle at 50% 35%, #000, transparent 78%);
  mask-image: radial-gradient(circle at 50% 35%, #000, transparent 78%);
}

.ui-bg-dots::before {
  background-image: radial-gradient(var(--border) 1.4px, transparent 1.4px);
  background-size: 22px 22px;
  -webkit-mask-image: radial-gradient(circle at 50% 35%, #000, transparent 80%);
  mask-image: radial-gradient(circle at 50% 35%, #000, transparent 80%);
}

.ui-bg-wash::before {
  background: linear-gradient(180deg, var(--glow-purple), transparent 45%);
}


.ui-container { width: 100%; max-width: var(--container); margin: 0 auto; padding: 0 clamp(14px, 2.4vw, 26px); }
.ui-stack > * + * { margin-top: var(--space-4); }


.ui-eyebrow {

  font-size: var(--text-sm);
  font-weight: var(--weight-medium);
  color: var(--text);
}


svg:where(:not([width]):not([height])) {
  width: 1.1em;
  height: 1.1em;
  flex: none;
  vertical-align: -0.15em;
}




a:focus-visible,
.ui-focusable:focus-visible,
.ui-snippet :focus-visible,
.ui-btn:focus-visible,
.ui-input:focus-visible,
.ui-seg button:focus-visible,
.toggle:focus-visible,
.ui-switch:focus-visible {
  outline: var(--ring);
  outline-offset: var(--ring-offset);
}

:is(h1, h2, h3, h4, h5, h6)[tabindex="-1"]:focus-visible {
  outline: var(--ring);
  outline-offset: var(--ring-offset);
  border-radius: var(--radius-xs);
}

a:not([class]):focus-visible {
  border-radius: var(--radius-xs);
  padding-inline: var(--space-1);
  margin-inline: calc(-1 * var(--space-1));
}



:root {

  --btn-pad-y-md: 9px;
  --btn-edge-width: 1px;

  --btn-height-md: calc(var(--text-sm) * var(--leading-tight) + 2 * var(--btn-pad-y-md) + 2 * var(--btn-edge-width));

  --btn-height-sm: var(--space-8);

  --control-height-sm: var(--btn-height-sm);
}

@media (pointer: coarse) {
  :root { --control-height-sm: var(--space-10); }
}

.ui-btn {
  --btn-pad-y: var(--btn-pad-y-md);
  --btn-pad-x: 17px;
  --btn-font: var(--text-sm);

  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-family: var(--font-sans);
  font-size: var(--btn-font);
  font-weight: var(--weight-medium);
  line-height: var(--leading-tight);
  border-radius: var(--radius-pill);
  padding: var(--btn-pad-y) var(--btn-pad-x);
  min-height: var(--btn-height-md);
  cursor: pointer;

  border: var(--btn-edge-width) solid var(--control-edge);
  background: var(--surface);
  color: var(--text);
  white-space: nowrap;

  transition: transform var(--dur-fast) var(--ease);
}

.ui-btn:hover {
  background: color-mix(in srgb, var(--accent) 14%, var(--surface));
  color: var(--strong);
}

.ui-btn:hover:not(:focus-visible) { border-color: var(--accent); }
.ui-btn:active { transform: translateY(1px); }

.ui-btn svg { width: 16px; height: 16px; flex: none; stroke-width: 2.4; }


.ui-btn--primary {
  background: var(--accent-strong);
  color: var(--accent-contrast);
  border-color: var(--accent-strong);
  font-weight: var(--weight-semibold);
}
.ui-btn--primary:hover {
  filter: brightness(1.1);
  color: var(--accent-contrast);
  background: var(--accent-strong);
  border-color: var(--accent-strong);
}

.ui-btn--ghost {
  background: transparent;
  border-color: transparent;
  color: var(--text);
}
.ui-btn--ghost:hover {
  background: var(--surface);
  border-color: transparent;
  color: var(--strong);
}


.ui-btn--outline {
  background: transparent;
  border-color: var(--control-edge);

  --ui-avatar-pull: 4px;
  --ui-avatar-pull-start: 10px;
  margin-block: calc(var(--ui-avatar-pull) * -1);
  margin-inline-start: calc(var(--ui-avatar-pull-start) * -1);
}
.ui-dropdown__value.is-placeholder {  color: var(--muted); font-weight: var(--weight-medium); }


.ui-dropdown__line { display: inline-flex; align-items: center; gap: 8px; min-inline-size: 0; }


.ui-field > .ui-dropdown { display: inline-grid; grid-template-columns: minmax(0, max-content); max-width: 100%; }

.ui-field > .ui-dropdown > .ui-dropdown__trigger > .ui-dropdown__fit {
  grid-area: 1 / 1;
  display: grid; grid-template-columns: minmax(0, max-content);
  visibility: hidden; min-inline-size: 0; overflow: hidden;
}
.ui-field > .ui-dropdown > .ui-dropdown__trigger > .ui-dropdown__fit > * { grid-area: 1 / 1; }
.ui-field > .ui-dropdown > .ui-dropdown__trigger > .ui-dropdown__line { grid-area: 1 / 1; }
.ui-field > .ui-dropdown > .ui-dropdown__trigger > .ui-dropdown__chevron { grid-area: 1 / 2; }
.ui-field > .ui-dropdown > .ui-dropdown__panel { inline-size: 100%; min-width: 0; }

@supports (corner-shape: squircle) {
  .ui-dropdown__panel,
  .ui-dropdown__panel > .ui-dropdown__head,
  .ui-dropdown__panel > .ui-dropdown__foot,
  .ui-dropdown__search-input { corner-shape: squircle; }
}

@property --ui-dropdown-line { syntax: "<length>"; inherits: true; initial-value: 0px; }
.ui-field > .ui-dropdown > .ui-dropdown__trigger {
  grid-area: 1 / 1; max-width: 100%;
  display: grid; grid-template-columns: minmax(0, max-content) max-content;
  padding: var(--space-3) var(--space-4);
  font-size: var(--text-base); line-height: normal;
  min-inline-size: 0;

  --ui-dropdown-line: 1lh;
}

.ui-field > .ui-dropdown > .ui-dropdown__trigger .ui-dropdown__value,
.ui-field > .ui-dropdown > .ui-dropdown__trigger .ui-dropdown__text {
  min-inline-size: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  text-align: start;
}

.ui-field > .ui-dropdown > .ui-dropdown__trigger .ui-dropdown__value { font-weight: var(--weight-normal); letter-spacing: normal; }

.ui-field > .ui-dropdown > .ui-dropdown__trigger .ui-avatar {
  --ui-avatar-pull-start: calc(var(--space-4) - var(--space-3) - (var(--ui-dropdown-line) - var(--ui-avatar-size)) / 2);
}

@media (pointer: coarse) {
  .ui-field > .ui-dropdown > .ui-dropdown__trigger { font-size: 16px; }

:root {

  --tap-min: 44px;


  --tap-aa: 24px;


  --tap-gap: var(--space-5, 20px);


  --tap-gap-bordered: calc(var(--tap-min) - var(--tap-aa) + 2px);


  --tap-clear-x: 0px;
  --tap-clear-y: 0px;
}

    .ui-seg button,
    .ui-tabs__tab,
    .ui-dropdown__trigger,
    .ui-toast__action,
    .ui-drawer__close,
    .ui-snippet__copy,
    .ui-footer__social,
    .ui-app__search,
    .ui-back,
    .toggle,

    .ui-datepicker__opt
  ) { position: relative; }


  :where(
    .ui-btn,
    .ui-seg button,
    .ui-tabs__tab,
    .ui-dropdown__trigger,
    .ui-toast__action,
    .ui-drawer__close,
    .ui-snippet__copy,
    .ui-footer__social,
    .ui-switch,
    .ui-datepicker__opt,
    .ui-app__search,
    .ui-back,
    .toggle
  )::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(max(100%, var(--tap-min)), calc(100% + var(--tap-clear-x)));
    height: min(max(100%, var(--tap-min)), calc(100% + var(--tap-clear-y)));
  }


  .ui-check input::before,
  .ui-table__selection input[type="checkbox"]::before,
  .ui-toast__close::before {
    width: max(var(--tap-aa), min(max(100%, var(--tap-min)), calc(100% + var(--tap-clear-x))));
    height: max(var(--tap-aa), min(max(100%, var(--tap-min)), calc(100% + var(--tap-clear-y))));
  }




  .ui-seg {
    row-gap: var(--tap-gap) !important;
    --tap-clear-y: var(--tap-gap);
  }
  .ui-seg:not(:has(button.ui-seg--icon)) { --tap-clear-x: var(--space-1, 4px); }


  .ui-seg button.ui-seg--icon:first-child::after {
    left: calc(-1 * (var(--space-1) / 2 + min(calc(var(--tap-min) - 100% - var(--space-1)), var(--tap-clear-x))));
    width: min(var(--tap-min), calc(100% + var(--space-1) + min(calc(var(--tap-min) - 100% - var(--space-1)), var(--tap-clear-x))));
    transform: translateY(-50%);
  }
  .ui-seg button.ui-seg--icon:last-child::after {
    right: calc(-1 * (var(--space-1) / 2 + min(calc(var(--tap-min) - 100% - var(--space-1)), var(--tap-clear-x))));
    left: auto;
    width: min(var(--tap-min), calc(100% + var(--space-1) + min(calc(var(--tap-min) - 100% - var(--space-1)), var(--tap-clear-x))));
    transform: translateY(-50%);
  }


  .ui-seg--underline { row-gap: var(--space-1, 4px) !important; --tap-clear-y: var(--space-1, 4px); }


  .ui-tabs__list { --tap-clear-x: 2px; --tap-clear-y: var(--tap-gap); }


  .ui-pager__steps {
    row-gap: var(--tap-gap) !important;
    --tap-clear-x: var(--space-1, 4px);
    --tap-clear-y: var(--tap-gap);
  }
  .ui-pager { row-gap: var(--tap-gap) !important; --tap-clear-y: var(--tap-gap); }


  .ui-filter-bar { gap: var(--tap-gap) !important; --tap-clear-x: var(--tap-gap); --tap-clear-y: var(--tap-gap); }

  .ui-toolbar--split .ui-filter-bar { column-gap: calc(var(--tap-gap) + var(--space-1) + 1px) !important; }

  .ui-stack > .ui-toolbar:not(:last-child) { margin-bottom: var(--tap-gap) !important; --tap-clear-y: var(--tap-gap); }


  .ui-toolbar > .ui-btn--icon { --tap-clear-x: 10px; }



  .ui-table__act .ui-btn + .ui-btn { margin-inline-start: var(--tap-gap) !important; }


  .ui-drop__row { --tap-clear-y: var(--tap-gap); }
  .ui-drop__actions {
    gap: var(--tap-gap) !important;
    --tap-clear-x: var(--tap-gap);
    --tap-clear-y: var(--tap-gap);
  }
  .ui-table__act { --tap-clear-x: var(--tap-gap); --tap-clear-y: 0px; }


  .ui-card__head { margin-bottom: var(--space-3, 12px) !important; }
  .ui-card__tools { column-gap: var(--tap-gap) !important; --tap-clear-x: var(--tap-gap); --tap-clear-y: var(--tap-gap); }

  .ui-app__tools { gap: var(--tap-gap) !important; --tap-clear-x: var(--tap-gap); --tap-clear-y: var(--tap-gap); }


  .ui-table__selection { --tap-clear-x: var(--tap-min); --tap-clear-y: var(--tap-min); }

  .ui-table--dense .ui-table__selection,
  .ui-table--compact .ui-table__selection { --tap-clear-y: 0px; }


  .ui-toast { row-gap: var(--tap-gap) !important; --tap-clear-y: var(--tap-gap); }


  .ui-confirm__acts,
  .ui-toolbar:not(.ui-table *),
  .ui-empty__actions,
  .ui-sx__actions,
  .ui-fbc__foot,
  .ui-drawer__footer,
  .ui-snippet__bar,
  .ui-app__main .ui-card__row {
    row-gap: var(--tap-gap) !important;
    --tap-clear-y: var(--tap-gap);
  }


  .ui-card-stack { --tap-clear-y: var(--tap-gap); }


  .ui-datepicker__grid {
    row-gap: var(--tap-gap) !important;
    --tap-clear-x: var(--space-1, 4px);
    --tap-clear-y: var(--tap-gap);
  }

  .ui-datepicker__panel { --ui-dropdown-max: 100dvh; }

  .ui-drawer:has(.ui-datepicker__body.is-sheet) { --drawer-h: 72vh; }


  .ui-datepicker__head { --tap-clear-x: var(--tap-gap-bordered); --tap-clear-y: var(--tap-gap-bordered); }


  .ui-datepicker__presets {
    row-gap: var(--tap-gap-bordered) !important;
    --tap-clear-x: var(--space-1, 4px);
    --tap-clear-y: var(--tap-gap-bordered);
  }


  .ui-drawer__row > dd {
    --tap-clear-x: var(--tap-gap);
    --tap-clear-y: var(--tap-gap);
  }


  .ui-footer__socials,
  .ui-drawer__header {
    gap: var(--tap-gap) !important;
    --tap-clear-x: var(--tap-gap);
    --tap-clear-y: var(--tap-gap);
  }

  .ui-drawer__header > .ui-drawer__lead { margin-inline-end: calc(var(--space-3) - var(--tap-gap)); }
  .ui-drawer__header:has(> .ui-drawer__actions) {
    padding-inline-end: calc(var(--space-5) - (var(--tap-gap) - var(--space-3)));
  }

  .ui-drawer__lead > .ui-tip-host > span:not(.ui-tip) { position: relative; }
  .ui-drawer__lead > .ui-tip-host > span:not(.ui-tip) > .ui-drawer__title::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(max(100%, var(--tap-min)), calc(100% + var(--tap-clear-x)));
    height: min(max(100%, var(--tap-min)), calc(100% + var(--tap-clear-y)));
  }



  .ui-back { --tap-clear-y: var(--space-3, 12px); }

  .ui-app__bar,
  .topbar__in { --tap-clear-x: var(--space-3, 12px); --tap-clear-y: var(--space-3, 12px); }
}

  html { scroll-behavior: auto !important; }

    animation-duration: 0.01ms !important;

    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
  [data-reveal] { opacity: 1 !important; transform: none !important; }
}
