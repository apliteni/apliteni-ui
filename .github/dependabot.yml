version: 2
updates:
  # npm dependencies — security + version PRs, batched weekly.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 breaks the React package build: tsup 8's dts step (its bundled
      # rollup-plugin-dts) dies with "Cannot read properties of undefined (reading
      # 'useCaseSensitiveFileNames')". Minor/patch updates still come through.
      # Drop this once tsup can generate types under TS 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
  # Keep GitHub Actions (incl. the SHA-pinned ones) up to date.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
