name: Security

# Secret scanning, dependency audit, and a published-artifact check. Runs on
# every push and every PR. Third-party actions are pinned to a commit SHA
# (Dependabot bumps them). See issue #2.
#
# `push:` carries no branch filter on purpose. Filtered to main, a branch with
# no pull request open was scanned by nothing at all: the push events were
# dropped and there was no pull_request event yet. Every push is now scanned on
# its own range, and a push to the default branch keeps the whole-clone walk.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan full history, not just the tip
      # Downloaded into RUNNER_TEMP, never into the workspace. The tree scan
      # below is `--no-git --source .`, so anything sitting in the workspace is
      # scanned as though it were repository content — the tarball, the
      # checksums file and the extracted binary included. The workspace holds
      # the repository and nothing else; every later step names the binary
      # through GITLEAKS_BIN.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VER=8.30.1
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VER}"
          cd "$RUNNER_TEMP"
          curl -fsSLO "${base}/gitleaks_${VER}_linux_x64.tar.gz"
          curl -fsSLO "${base}/gitleaks_${VER}_checksums.txt"
          grep "gitleaks_${VER}_linux_x64.tar.gz" "gitleaks_${VER}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${VER}_linux_x64.tar.gz" gitleaks
      # TWO SCANS, because neither sees what the other does.
      #
      # The HISTORY scan walks commits. `detect` on a git source walks every ref
      # in the clone, so on a pull request a leak sitting on some unrelated
      # unmerged branch turned this check red on every open PR at once (issue
      # #186). A pull request scans its own commit range, and so does a push to
      # any branch but the default one — that push is the only scan a branch
      # with no pull request open ever gets. The default branch keeps the
      # whole-clone walk, which is the backstop it was built to be.
      #
      # The TREE scan walks files. It exists because `detect` on a git source is
      # `git log -p` underneath, and `git log -p` prints no diff for a MERGE
      # commit. A secret introduced in a merge's conflict resolution — the
      # ordinary shape of resolving a conflict — is therefore in no patch at
      # all: not in the pull request's range, and not in the whole-clone walk on
      # the branch it lands on. It is only ever in the tree. On a pull request
      # the checkout is refs/pull/N/merge, so `--no-git --source .` scans
      # exactly the tree that merging would produce. Squash and rebase merges
      # rewrite the change into an ordinary commit and do not carry this; this
      # repository allows merge commits and uses them.
      #
      # Every value this body reads comes in through the step's own `env:` block
      # or from the runner's own variables, and is quoted here. A branch name is
      # attacker-controlled on a fork PR, and a `${{ }}` expression is pasted
      # into the script before bash sees it — so none appears below. That also
      # makes the body runnable outside Actions, which is how
      # scripts/secret-scan-range.check.mjs runs this exact text against
      # synthetic repositories, evil merge included.
      - name: Scan for secrets
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          gitleaks="${GITLEAKS_BIN:-${RUNNER_TEMP:-.}/gitleaks}"
          history_report="$(mktemp)"
          tree_report="$(mktemp)"
          scope="the whole clone (every ref)"
          range=()
          # Set only when the range below is really in effect: it is the answer to
          # "which branch is this finding on", and it is only the right answer while
          # the scan is confined to that branch's commits.
          on_branch=""
          # Which commits this event asks for. Both events name a range the same
          # way, so one guard below covers both.
          base=""
          head=""
          ref=""
          ranged=""
          if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
            ranged="yes"
            base="${PR_BASE_SHA:-}"
            head="${PR_HEAD_SHA:-}"
            ref="${PR_HEAD_REF:-}"
          elif [ "${GITHUB_EVENT_NAME:-}" = "push" ] &&
               [ "${GITHUB_REF_NAME:-}" != "${DEFAULT_BRANCH:-main}" ]; then
            ranged="yes"
            base="${PUSH_BEFORE:-}"
            head="${PUSH_AFTER:-}"
            ref="${GITHUB_REF_NAME:-}"
          fi
          if [ -n "$ranged" ]; then
            # Never silently scan less than intended, and a range lies in two ways.
            # Either end can be missing from this checkout. And the range can span
            # NO COMMITS — base equal to head, or a head already contained in base
            # — which scans zero commits, exits 0, and is indistinguishable from a
            # clean pull request. Both fall back to the whole-clone walk, loudly.
            if [ -n "$base" ] && [ -n "$head" ] &&
               git cat-file -e "${base}^{commit}" 2>/dev/null &&
               git cat-file -e "${head}^{commit}" 2>/dev/null &&
               [ "$(git rev-list --count "${base}..${head}")" -gt 0 ]; then
              range=("--log-opts=${base}..${head}")
              on_branch="$ref"
              scope="commits ${base}..${head} on branch ${ref:-(unknown)}"
            else
              echo "::warning::This event's commit range is missing from this checkout or spans no" \
                "commits; falling back to scanning the whole clone."
            fi
          fi
          echo "gitleaks history scope: ${scope}"
          echo "gitleaks tree scope: every file in this checkout, as it stands"
          # --config loads .gitleaks.toml (default secret rules + PII/infra rules).
          # Neither scan short-circuits the other: both always run, and the step is
          # red if EITHER found something.
          history_status=0
          "$gitleaks" detect --source . --config .gitleaks.toml --redact --no-banner \
            --exit-code 1 --report-format json --report-path "$history_report" \
            ${range[@]+"${range[@]}"} || history_status=$?
          tree_status=0
          "$gitleaks" detect --no-git --source . --config .gitleaks.toml --redact --no-banner \
            --exit-code 1 --report-format json --report-path "$tree_report" || tree_status=$?
          # Both reports are written outside the workspace, so the tree scan does
          # not read the history scan's findings back as repository content.
          status=0
          # Findings are already --redact'ed, so rule/file/line/commit leak nothing.
          # `node` here is the runner's preinstalled one — these failure paths run
          # before setup-node below, and if it were missing the pipeline would fail
          # and the step would still end red, which is the safe direction.
          if [ "$history_status" -ne 0 ]; then
            echo "::error::gitleaks found secrets in the HISTORY it walked: ${scope}. Each finding" \
              "below names the commit and the branch it lives on — the value itself stays redacted."
            node -e 'for (const f of JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))) console.log([f.RuleID, f.Commit || "", f.File, f.StartLine].join("\t"))' "$history_report" |
              while IFS=$'\t' read -r rule commit file line; do
                short="$(git rev-parse --short "$commit" 2>/dev/null || echo "${commit:-(no commit)}")"
                if [ -n "$on_branch" ]; then
                  branch="$on_branch"
                else
                  # A whole-clone finding can come from any ref, so ask git which one.
                  branch="$(git branch -a --contains "$commit" --format='%(refname:short)' 2>/dev/null |
                    head -n 1)"
                fi
                echo "  ${rule}: ${file}:${line} — commit ${short} on branch ${branch:-(unknown)}"
              done
            status=1
          fi
          if [ "$tree_status" -ne 0 ]; then
            echo "::error::gitleaks found secrets in the TREE this checkout holds — the files as" \
              "they stand, which on a pull request is the tree the merge would produce. A tree" \
              "finding names no commit because it is in no patch: look at the file itself."
            node -e 'for (const f of JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))) console.log([f.RuleID, f.File, f.StartLine].join("\t"))' "$tree_report" |
              while IFS=$'\t' read -r rule file line; do
                echo "  ${rule}: ${file}:${line} — in the working tree"
              done
            status=1
          fi
          if [ "$status" -eq 0 ]; then
            echo "No secrets found in ${scope}, and none in the checked-out tree."
          fi
          exit "$status"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # No `npm ci`. The script imports nothing outside node: builtins, so there
      # is nothing to install — and not installing means no third-party code runs
      # in a job whose whole purpose is to decide whether a secret is present.
      #
      # A green scan proves nothing on its own: a rule that stopped matching looks
      # exactly like a clean repo. This plants a fabricated instance of every
      # covered shape and asserts the right rule names it.
      #
      # Then it does the same to the cases themselves, in the same run — a fixture
      # can quietly stop testing anything, and three of them had. It weakens every
      # rule in .gitleaks.toml along each axis that rule actually has (its classes,
      # its length floors, its \b boundaries, its id, an entropy floor), re-runs
      # every case against each weakened copy, and requires a case to die.
      #
      # Every [allowlist] entry is weakened too, by being REMOVED, and is held to
      # the same bar — because a gate is switched off from that side just as
      # easily: two lines added to the allowlist take a scan carrying an AWS key
      # and a GitHub token from two findings to none without touching a rule.
      #
      # A subject nothing kills fails; so does a single surviving mutation
      # carrying no written justification, and so does a justification that some
      # case has since started killing. The mutated configs are written to a temp
      # directory and never to .gitleaks.toml.
      # See docs/adr/0008-a-rule-is-proven-by-the-mutation-that-kills-its-case.md.
      #
      # GITLEAKS_BIN points at the binary the step above extracted, rather than
      # prepending its directory to PATH — that would let a file named `node`
      # committed at the repo root stand in for the interpreter and take this
      # gate green without running anything. The binary now lives in RUNNER_TEMP
      # rather than the workspace, for the reason the install step gives, so the
      # path is spelled out here instead of `./gitleaks`.
      - name: Rule regression check
        run: GITLEAKS_BIN="$RUNNER_TEMP/gitleaks" node scripts/gitleaks-rules.check.mjs
      # The scan step above decides how much history to walk, and getting that
      # wrong is invisible from its output: a pull request that scans a stranger's
      # branch looks like a scan, one that scans nothing looks like a pass, and a
      # secret that lives only in a merge commit's conflict resolution is in no
      # patch either scan would print. This lifts that step's real `run:` body out
      # of this file and executes it against synthetic repositories where the
      # answer is known — evil merge, empty range and first push included.
      - name: Commit-range check
        run: GITLEAKS_BIN="$RUNNER_TEMP/gitleaks" node scripts/secret-scan-range.check.mjs

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: npm audit — production deps (fail on high/critical)
        # The package declares no runtime dependencies and no peers. React reaches
        # this repo only as a devDependency of the react/ workspace, so `--omit=dev`
        # leaves nothing to audit and a react-dom advisory cannot turn this required
        # check red over a package that ships no React. `scripts/packaging.test.js`
        # is what keeps React out of the runtime side of the manifest. Dev tooling
        # (Storybook/Vite) is audited below, non-blocking.
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit — dev deps (informational)
        run: npm audit --audit-level=high || true

  package-contents:
    name: Published artifact check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # Packing runs `prepare`, which builds the React components with tsup, so
      # this job needs the toolchain — a bare checkout packs nothing.
      - run: npm ci
      - name: Assert no secrets/junk in the npm tarball
        run: |
          set -euo pipefail
          # `prepare` writes its own build progress to this stdout, so the JSON
          # document starts at the first bare `[` line rather than at byte 0.
          files=$(npm pack --dry-run --json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const L=s.split("\n");for(const f of JSON.parse(L.slice(L.indexOf("[")).join("\n"))[0].files)console.log(f.path)})')
          echo "Files to be published:"; echo "$files"
          if echo "$files" | grep -iE '(^|/)(\.env|\.env\..*|\.npmrc|.*\.pem|.*\.key|id_rsa|\.git/)'; then
            echo "::error::A secret or forbidden file is staged for publish"; exit 1
          fi

  denylist:
    name: Internal-terms denylist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Grep tracked files for internal-only identifiers
        run: |
          set -euo pipefail
          # Real infra occurrences that must never ship in a public repo — internal
          # Lessly hostnames, ttl.sh image paths, deploy-token assignments, bare
          # UUIDs (Lessly service/org/product IDs) and private IPs. Prose mentions
          # in the policy docs/configs are excluded below, so this matches only the
          # real thing. Product-demo hosts (strategy.apli.tech) and the 'phoenix'
          # accent/codename are intentionally NOT here — accepted as demo content.
          # Private-IP ranges are matched as full 4-octet addresses (a leaked
          # Lessly IP is always a complete IP). The 10/8 branch carries its own
          # first octet so it can't collide with 3-part semver like a "10.5.5"
          # dependency version.
          pattern='[a-z0-9-]+\.lessly\.run|ttl\.sh/[a-z0-9]|LESSLY_DEPLOY_TOKEN[[:space:]]*[:=]|\b[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}\b|\b(10\.[0-9]{1,3}|192\.168|172\.(1[6-9]|2[0-9]|3[01]))\.[0-9]{1,3}\.[0-9]{1,3}\b'
          if git grep -nEI "$pattern" -- . \
               ':(exclude)package-lock.json' \
               ':(exclude).github/' \
               ':(exclude).gitleaks.toml' \
               ':(exclude).pre-commit-config.yaml' \
               ':(exclude)CONTRIBUTING.md'; then
            echo "::error::Internal-only identifier found in tracked files. Redact before merge (see CONTRIBUTING -> Data handling)."
            exit 1
          fi
          echo "No internal-only identifiers found."
