name: Security

# Secret scanning, dependency audit, and a published-artifact check. Runs on
# every push to main and every PR. Third-party actions are pinned to a commit
# SHA (Dependabot bumps them). See issue #2.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan full history, not just the tip
      - name: Run gitleaks
        run: |
          set -euo pipefail
          VER=8.30.1
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VER}"
          curl -fsSLO "${base}/gitleaks_${VER}_linux_x64.tar.gz"
          curl -fsSLO "${base}/gitleaks_${VER}_checksums.txt"
          grep "gitleaks_${VER}_linux_x64.tar.gz" "gitleaks_${VER}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${VER}_linux_x64.tar.gz" gitleaks
          # --config loads .gitleaks.toml (default secret rules + PII/infra rules).
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --exit-code 1

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: npm audit — production deps (fail on high/critical)
        # The package ships no runtime dependencies, so this is what a consumer
        # actually installs. Dev tooling (Storybook/Vite) is audited below, non-blocking.
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit — dev deps (informational)
        run: npm audit --audit-level=high || true

  package-contents:
    name: Published artifact check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # Packing runs `prepack`, which builds the React components with tsup, so
      # this job needs the toolchain — a bare checkout packs nothing.
      - run: npm ci
      - name: Assert no secrets/junk in the npm tarball
        run: |
          set -euo pipefail
          # `prepack` writes its own build progress to this stdout, so the JSON
          # document starts at the first bare `[` line rather than at byte 0.
          files=$(npm pack --dry-run --json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const L=s.split("\n");for(const f of JSON.parse(L.slice(L.indexOf("[")).join("\n"))[0].files)console.log(f.path)})')
          echo "Files to be published:"; echo "$files"
          if echo "$files" | grep -iE '(^|/)(\.env|\.env\..*|\.npmrc|.*\.pem|.*\.key|id_rsa|\.git/)'; then
            echo "::error::A secret or forbidden file is staged for publish"; exit 1
          fi

  denylist:
    name: Internal-terms denylist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Grep tracked files for internal-only identifiers
        run: |
          set -euo pipefail
          # Real infra occurrences that must never ship in a public repo — internal
          # Lessly hostnames, ttl.sh image paths, deploy-token assignments, bare
          # UUIDs (Lessly service/org/product IDs) and private IPs. Prose mentions
          # in the policy docs/configs are excluded below, so this matches only the
          # real thing. Product-demo hosts (strategy.apli.tech) and the 'phoenix'
          # accent/codename are intentionally NOT here — accepted as demo content.
          # Private-IP ranges are matched as full 4-octet addresses (a leaked
          # Lessly IP is always a complete IP). The 10/8 branch carries its own
          # first octet so it can't collide with 3-part semver like a "10.5.5"
          # dependency version.
          pattern='[a-z0-9-]+\.lessly\.run|ttl\.sh/[a-z0-9]|LESSLY_DEPLOY_TOKEN[[:space:]]*[:=]|\b[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}\b|\b(10\.[0-9]{1,3}|192\.168|172\.(1[6-9]|2[0-9]|3[01]))\.[0-9]{1,3}\.[0-9]{1,3}\b'
          if git grep -nEI "$pattern" -- . \
               ':(exclude)package-lock.json' \
               ':(exclude).github/' \
               ':(exclude).gitleaks.toml' \
               ':(exclude).pre-commit-config.yaml' \
               ':(exclude)CONTRIBUTING.md'; then
            echo "::error::Internal-only identifier found in tracked files. Redact before merge (see CONTRIBUTING -> Data handling)."
            exit 1
          fi
          echo "No internal-only identifiers found."
