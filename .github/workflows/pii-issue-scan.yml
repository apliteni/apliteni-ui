name: PII / infra scan (issues & PRs)

# gitleaks and pre-commit never see issue/PR *bodies*, yet that's exactly where
# internal identifiers slip in (e.g. a service UUID pasted into an issue). This
# scans new/edited issue & PR bodies + comments against the infra denylist and
# posts a warning. It warns, it does not block (you can't "fail" an issue).
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]
  # SAFE use of pull_request_target: this job only READS context.payload and never
  # checks out or executes PR code, so it does not reintroduce the fork-PR secret
  # risk hardened in #74. It needs the base-repo token to comment on fork PRs.
  pull_request_target:
    types: [opened, edited]

permissions:
  issues: write
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Scan body for internal identifiers
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const body = context.eventName === "pull_request_review"
              ? (context.payload.review?.body ?? "")
              : (context.eventName === "issue_comment"
                || context.eventName === "pull_request_review_comment")
                ? (context.payload.comment?.body ?? "")
                : (context.payload.pull_request?.body
                  ?? context.payload.issue?.body ?? "");
            const patterns = [
              { name: "UUID v4", re: /\b[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}\b/ },
              { name: "ttl.sh image tag", re: /ttl\.sh\/[a-z0-9]/i },
              { name: "Lessly host", re: /[a-z0-9-]+\.lessly\.run\b/i },
              { name: "deploy-token name", re: /LESSLY_DEPLOY_TOKEN\s*[:=]/ },
              { name: "private IP", re: /\b(?:10|192\.168|172\.(?:1[6-9]|2\d|3[01]))\.\d{1,3}\.\d{1,3}\b/ },
            ];
            const match = patterns.map((pattern) => ({ pattern, result: body.match(pattern.re) }))
              .find(({ result }) => result);
            if (!match) return;
            const n = context.payload.issue?.number
              || context.payload.pull_request?.number;
            if (!n) return;
            const offset = match.result.index;
            const line = body.slice(0, offset).split("\n").length;
            const lineStart = body.lastIndexOf("\n", offset - 1) + 1;
            const column = offset - lineStart + 1;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: n,
              body: `⚠️ **Possible internal identifier detected**: ${match.pattern.name} at `
                + `line ${line}, column ${column}. This repo is `
                + "public — please redact internal infra identifiers from this thread. "
                + "See AGENTS.md → Data handling.",
            });
