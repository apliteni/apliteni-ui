name: Release

# Publish @apliteni/apliteni-ui to the PUBLIC npm registry when a GitHub Release
# is published. Bump the version + tag first (npm version <patch|minor|major>),
# push the tag, then cut a Release for it.
#
# Auth is npm Trusted Publishing (OIDC): the job exchanges a short-lived GitHub
# OIDC token for publish rights — there is no long-lived NPM_TOKEN to steal.
# The counterpart config lives on npmjs.com (package → Settings → Trusted
# Publisher): repository apliteni/apliteni-ui, workflow release.yml.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # trusted publishing needs npm >= 11.5.1
      - run: npm publish
