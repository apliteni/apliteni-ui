name: Release

# Publish @apliteni/apliteni-ui to the PUBLIC npm registry when a GitHub Release
# is published. Bump the version + tag first (npm version <patch|minor|major>),
# push the tag, then cut a Release for it.
#
# ONE-TIME SETUP (see issue #1): claim the @apliteni org on npmjs.com, create an
# automation (publish) token, and add it as the NPM_TOKEN repo secret. Until that
# secret exists the publish step is skipped — the release still succeeds.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          scope: '@apliteni'
      - name: Detect NPM_TOKEN
        id: tok
        run: echo "has=${{ secrets.NPM_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Publish
        if: steps.tok.outputs.has == 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Skipped (no token yet)
        if: steps.tok.outputs.has != 'true'
        run: echo "::notice::NPM_TOKEN is not set — skipping publish. Add the secret (issue #1) to enable public npm publishing."
