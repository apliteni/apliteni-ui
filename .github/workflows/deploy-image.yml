name: Deploy image

# Builds the ui.apli.tech site image (landing + Storybook) and pushes it to the
# GitHub Container Registry (GHCR) — a persistent registry, so no ttl.sh timeouts
# and no image-expiry ("image not found") on redeploy. Runs on push to main and
# on demand. The Lessly service pulls ghcr.io/apliteni/apliteni-ui:latest.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the code, write the package. No other scopes.
permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/apliteni-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:main-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Pushed \`${IMAGE}:latest\` and \`${IMAGE}:main-${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Redeploy the Lessly \`site\` service to roll it out." >> "$GITHUB_STEP_SUMMARY"
