name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads code, tests, builds Storybook and uploads an artifact — no write scopes needed.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 24 to match release.yml. The dev toolchain (jsdom 30, Storybook 10)
          # needs >= 22; the published package itself still supports Node >= 20.
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test --if-present
      # The React workspace has its own test + build toolchain (vitest, tsup).
      # Without these steps a break in react/ lands on main unnoticed.
      - name: React package — unit tests
        run: npm test -w @apliteni/apliteni-ui-react
      - name: React package — build
        run: npm run build -w @apliteni/apliteni-ui-react
      - name: Build Storybook
        run: npm run build-storybook
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 7
