name: Site drift (deployed site vs main)

on:
  schedule:
    - cron: '47 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: site-drift
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe502c # v7.0.0
        with:
          node-version: 24
      - name: Assess deployed site
        run: node scripts/site-drift.mjs > site-drift.json
      - name: Open an issue when the site drifts
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const verdict = JSON.parse(fs.readFileSync('site-drift.json', 'utf8'));
            core.info(verdict.summary);
            if (!verdict.drift) {
              const cannotTell = ['site-unreadable', 'site-unreachable'];
              if (cannotTell.includes(verdict.reason)) {
                core.warning(
                  `Drift could not be assessed (${verdict.reason}): ${verdict.summary} `
                    + 'This run checked nothing — it is not a clean bill of health.',
                );
              } else {
                core.info(`No issue to file (${verdict.reason}).`);
              }
              return;
            }

            const MARKER = 'site-drift';
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: MARKER,
                color: 'd93f0b',
                description: 'Deployed ui.apli.tech is behind main',
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: MARKER,
              per_page: 1,
            });
            if (open.data.length > 0) {
              core.info(`#${open.data[0].number} is already open — nothing to do.`);
              return;
            }

            const body = [
              'The deployed site does not match the repository.',
              '',
              `\`${JSON.stringify(verdict)}\``,
              '',
              'Filed by `.github/workflows/site-drift.yml`.',
            ].join('\n');
            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'ui.apli.tech has drifted from main',
              body,
              labels: [MARKER],
            });
            core.notice(`Filed #${created.data.number}: ${verdict.summary}`);
