# gitleaks config — extends the built-in secret rules with PII + internal-infra
# rules so personal data and deploy topology can't land in a public repo.
# The Security workflow (.github/workflows/security.yml) auto-loads this file.
#
# Go's RE2 has no negative lookahead, so "email not on an approved domain" is
# done the idiomatic way: match ALL emails, then subtract approved domains and
# known placeholders in [allowlist]. Add new legitimate values to the allowlist —
# never weaken a rule.
title = "apliteni-ui leak rules"

# The version these rules were written and measured against. Measured behaviour, so
# nobody over-reads it: an older gitleaks does NOT refuse the config — it logs
# "config requires a newer Gitleaks version" and scans on regardless. So this buys a
# line in the log that says which binary is out of step, not a gate. It also cannot
# protect the same-id override the 1Password rule depends on: if a future gitleaks
# changes how a redefined id composes with the default, this key will not notice.
# scripts/gitleaks-rules.check.mjs is what actually proves the rules still bite.
minVersion = "v8.30.1"

[extend]
useDefault = true # keep every built-in secret rule

# ── Emails (must be an approved corporate / noreply / placeholder domain) ─────
[[rules]]
id = "pii-email"
description = "Email address — review: only approved domains allowed"
regex = '''[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,24}'''
tags = ["pii", "email"]

# ── Private / RFC1918 IPv4 ────────────────────────────────────────────────────
[[rules]]
id = "pii-private-ip"
description = "Private (RFC1918) IPv4 address"
regex = '''\b(?:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})\b'''
tags = ["infra", "ip"]

# ── Internal Lessly runtime hostnames (*.lessly.run) ─────────────────────────
[[rules]]
id = "infra-lessly-run"
description = "Internal Lessly runtime hostname"
regex = '''\b[a-z0-9-]+\.lessly\.run\b'''
tags = ["infra", "hostname"]

# ── ttl.sh ephemeral image tags ──────────────────────────────────────────────
[[rules]]
id = "infra-ttlsh-tag"
description = "ttl.sh ephemeral registry reference"
regex = '''\bttl\.sh/[A-Za-z0-9][A-Za-z0-9._\-/]+'''
tags = ["infra", "registry"]

# ── Bare UUID v4 — Lessly service/org/product identifiers are UUIDs ───────────
[[rules]]
id = "infra-uuid"
description = "UUID (possible Lessly service/org/product identifier)"
regex = '''\b[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}\b'''
tags = ["infra", "uuid"]

# ── Deploy/service token assignment with a real-looking value ────────────────
[[rules]]
id = "infra-deploy-token"
description = "Deploy/service token assignment with a value"
regex = '''(?i)(LESSLY_DEPLOY_TOKEN|DEPLOY_TOKEN|SERVICE_TOKEN)\s*[:=]\s*['"]?[A-Za-z0-9._\-]{16,}'''
tags = ["infra", "token"]

# ── 1Password service account token ──────────────────────────────────────────
# Replaces the rule of the same id in gitleaks 8.30.1, whose `ops_eyJ[a-zA-Z0-9+/]{250,}`
# has two reachable holes: real tokens are base64url (`-` and `_`), which that class
# breaks on, and {250,} wants 250 unbroken characters, which a token quoted in wrapped
# prose never has. The quantifier here is a REMAINDER — the floor is 30 characters of
# the whole token and `ops_eyJ` is 7 of them, so {23,}; writing {30,} would mean 37 and
# miss a 36-character fragment. The low floor is safe because of the anchor, not the
# length: `ops_eyJ` is the 1Password prefix plus the base64 of the `{"` opening the
# token's JSON claims, and ordinary text essentially never contains it.
# Full argument: #179 and asabirov/claude#68.
[[rules]]
id = "1password-service-account-token"
description = "1Password service account token (base64 or base64url, wrapped or whole)"
regex = '''ops_eyJ[A-Za-z0-9+/_-]{23,}={0,3}'''
keywords = ["ops_eyj"]
tags = ["secret", "1password"]

# ── OpenAI key, anchored on the watermark alone ──────────────────────────────
# Matches a FRAGMENT: the watermark with 20 characters on either side of it, and no
# prefix requirement at all. That is the point. Requiring sk-<prefix>- and a long
# unbroken run reproduces the very hole #179 exists to close — a real sk-proj- key
# broken at column 80 is then caught by nothing, ours or upstream's, and neither is
# sk-service- or a head longer than the cap. Anchoring on T3BlbkFJ (base64 for
# "OpenAI", present in every key OpenAI mints) is what carries the specificity, the
# same trade the ops_eyJ rule above makes. Measured: zero findings from this rule
# across 118 MB of node_modules and the full tracked history.
#
# This is a NEW id, so upstream's `openai-api-key` is NOT replaced — it stays live and
# both may name the same key. Do not "tidy" this onto upstream's id for symmetry with
# the 1Password rule above: that would replace upstream's, and they are not
# interchangeable. Full argument: #179 and asabirov/claude#68.
[[rules]]
id = "openai-api-key-watermark"
description = "OpenAI key fragment — watermark-anchored, any prefix, wrapped or truncated"
regex = '''(?:[A-Za-z0-9_-]{20,}T3BlbkFJ|T3BlbkFJ[A-Za-z0-9_-]{20,})'''
keywords = ["T3BlbkFJ"]
tags = ["secret", "openai"]

# ── Vendor tokens this environment uses daily that gitleaks 8.30.1 has no rule for ──
# Without these, each reaches a commit on generic-api-key alone — which needs a
# credential-ish word beside the value, so a token quoted in prose walks through, and
# which stands down on its own stopword list. Each rule below is anchored on a vendor
# prefix no ordinary text contains, so neither weakness applies, and the length floors
# are loose on purpose: the prefix carries the specificity, as with ops_eyJ above.
# Full argument: #179 and asabirov/claude#68.

[[rules]]
id = "apify-api-token"
description = "Apify API token"
regex = '''apify_api_[A-Za-z0-9]{30,}'''
keywords = ["apify_api_"]
tags = ["secret", "apify"]

# pk_ then the numeric user id then 32 uppercase characters. Stripe's publishable keys
# also begin pk_, but they are pk_live_/pk_test_ and never carry digits in that
# position, so the two do not collide.
[[rules]]
id = "clickup-api-token"
description = "ClickUp personal API token"
regex = '''pk_\d{5,}_[A-Z0-9]{32}'''
keywords = ["pk_"]
tags = ["secret", "clickup"]

[[rules]]
id = "figma-personal-access-token"
description = "Figma personal access token"
regex = '''figd_[A-Za-z0-9_-]{35,}'''
keywords = ["figd_"]
tags = ["secret", "figma"]

# PostHog mints five prefixes (its own models/utils.py): phx_ personal, phs_ project
# secret, pha_ OAuth access, phr_ OAuth refresh — and phc_ project. The first four are
# secrets and are all matched here. phc_ deliberately is not: it ships inside published
# web pages by design, so a rule for it would flag every landing page in the tree.
[[rules]]
id = "posthog-api-key"
description = "PostHog secret key — personal, project-secret, or OAuth (not the public phc_)"
regex = '''ph[xsar]_[A-Za-z0-9]{40,}'''
keywords = ["phx_", "phs_", "pha_", "phr_"]
tags = ["secret", "posthog"]

[allowlist]
description = "Approved domains, placeholders, and known-safe demo data"
regexes = [
  # Approved email domains + GitHub noreply + demo placeholders.
  '''[A-Za-z0-9._%+\-]+@apliteni\.com''',
  '''[A-Za-z0-9._%+\-]+@sabirov\.io''',
  '''[A-Za-z0-9._%+\-]+@(?:users\.)?noreply\.github\.com''',
  '''[A-Za-z0-9._%+\-]+@example\.(?:com|org)''',
  # Fabricated "shown once" demo API token in Access.stories.js — not a real secret.
  '''apli_sk_live_9f2c4b7e1a06d8f3c5b2e9a1d4f70c83''',
]
# Anchored, and that is the point: a path entry switches off EVERY rule in this file
# for anything it matches, and gitleaks matches these as a substring search. Unanchored,
# '''.*\.svg''' exempted src/icons/sprite.svg.ts — an ordinary name in an icon kit —
# from the whole gate. Measured: gitleaks' own default allowlist already exempts .svg
# (with .png/.jpg/.gif/.pdf/.doc/.bin) and correctly does NOT exempt .svg.ts, so the
# unanchored form was strictly weaker than the default it sat beside, and the anchored
# one is belt-and-braces over it. scripts/gitleaks-rules.check.mjs holds both halves.
paths = [
  '''(?:^|/)package-lock\.json$''',
  '''(?i)\.svg$''',
]
